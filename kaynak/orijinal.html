describe every important decision as “corporate strategy,” even when a decision concerns one department’s contribution. MedLink’s strategy director emphasizes that corporate strategy concerns the organization’s overall scope, business strategy concerns how a business competes, and functional strategy concerns how departments support the broader direction. The distinction is important because responsibilities, budgets, and performance measures must be assigned clearly before expansion begins.", "During the planning meeting, the cybersecurity director presents a detailed departmental program covering encryption standards, access controls, employee training, supplier reviews, and incident reporting. The program does not decide which countries MedLink enters or the overall basis of competition. Instead, it explains how one specialist function will contribute to the broader strategic priorities established by senior and business-level management.", "MedLink also reviews its external position. Because a small number of large hospital groups purchase most subscriptions, those buyers can negotiate strongly over price and service conditions. New privacy legislation raises mandatory compliance requirements, while advances in encryption, video quality, and system integration create technological opportunities. Managers therefore use Porter’s Five Forces to interpret bargaining pressure and PESTEL to separate legal change from technological development. The tools provide different but complementary explanations of the competitive environment facing the platform."]}, {"title": "HarborTech Manufacturing", "ch": "Ch 11", "text": ["HarborTech Manufacturing produces navigation and communication equipment for commercial ships. Its products are known for reliability, but competitors have begun offering similar equipment at lower prices and with shorter delivery times. Several important customers have warned HarborTech that future contracts will depend on improved production speed and consistent quality. Internal reports also show that repetitive assembly work causes errors and employee injuries.", "The leadership team proposes introducing collaborative robots on selected production lines. Unlike traditional industrial robots that operate separately from employees, collaborative robots can perform repetitive tasks alongside trained technicians. Management expects the technology to increase precision, reduce physical strain, and allow employees to focus on testing and complex technical work. However, the investment is expensive and requires major changes in skills, roles, and daily routines.", "Employee reactions are mixed. Younger technicians are interested in learning robotics, while some experienced employees fear that automation will eventually eliminate their jobs. Union representatives ask for clear employment guarantees and meaningful involvement in implementation. Rumors spread that the company has already decided to reduce staffing, although senior leaders state that the current plan focuses on retraining rather than dismissal.", "The chief operating officer begins the change process by presenting evidence. She shares data showing longer delivery times, rising error rates, physical strain, and lost customer contracts. She explains how competitors are using advanced production technology and why HarborTech cannot maintain its current methods without risking further decline. Managers organize workshops in which employees can discuss concerns and examine how future roles may change.", "Only after these activities does HarborTech begin a supervised pilot on one production line. Employees receive training, safety procedures are tested, and the pilot team collects feedback. If the test succeeds, the new workflow will be expanded and eventually incorporated into job descriptions and performance systems. The leadership team uses Lewin’s model to distinguish preparation for change from implementation and later stabilization. It wants employees to understand why the first stage must weaken attachment to the existing situation before new behavior is introduced.", "Leaders deliberately avoid presenting the robots as a completed decision requiring immediate compliance. They first challenge the belief that existing performance is acceptable and create awareness of the gap between current results and customer expectations. This preparation is intended to build readiness. Training, pilot testing, and formal reinforcement will follow, but they belong to later parts of the change process.", "Resistance takes different forms. Some employees openly organize protests, representing active resistance. Others appear cooperative but quietly delay sharing information with the pilot team, representing passive resistance. Management wants the wider change to support innovation rather than fear. Leaders therefore propose safe experiments, cross-functional learning, transparent reporting, and recognition for responsible improvement ideas. Unsuccessful tests that follow agreed safety rules will be reviewed for learning instead of receiving automatic punishment. HarborTech sees this approach as a possible source of faster improvement, employee involvement, and competitive advantage."]}, {"title": "FreshLoop Packaging", "ch": "Ch 6", "text": ["FreshLoop Packaging was created to reduce the amount of single-use packaging generated by supermarkets, restaurants, and takeaway services. The company supplies reusable food containers that customers can return after use. FreshLoop’s mission is to make reuse as convenient as disposal while maintaining strict standards for food safety. Its customers include several supermarket chains, workplace cafeterias, and more than two hundred independent restaurants", "FreshLoop originally focused on container design and sales. The company developed a patented sealing system that keeps food fresh and reduces leakage. However, management soon discovered that a reusable container creates value only when customers can return it easily and the container can be prepared safely for another cycle. FreshLoop therefore built collection points near shops and restaurants. Returned containers are transported to regional cleaning hubs, where they are inspected, washed, sanitized, and prepared for recirculation.", "The operational system is complex. Transport partners move containers between customers, collection points, and cleaning hubs. Employees at the hubs monitor hygiene, remove damaged products, and organize containers for delivery. The company’s technology team maintains tracking software, while marketing employees explain the deposit-return system to customers. Procurement specialists purchase materials and cleaning supplies, and senior management coordinates finance, legal compliance, and long-term planning.", "Demand is increasing because European packaging regulations are becoming stricter. Retailers want alternatives that help them meet waste-reduction targets. At the same time, competitors are introducing cheaper reusable containers. FreshLoop’s main difficulty is profitability: transportation and cleaning costs are higher than expected, especially when collection volumes are low. Some managers argue that the patented seal is the company’s main source of value. Others believe that the return and cleaning network is more important because it makes repeated use possible.", "FreshLoop is conducting a value-chain review before deciding where to invest. Management wants to distinguish primary activities that directly create and deliver the reusable service from support activities such as technology development, procurement, human-resource management, and firm infrastructure. The review will influence decisions about expanding cleaning capacity, improving tracking technology, outsourcing transportation, and licensing the sealing system.", "Managers map the complete journey of a container, from material purchasing and manufacturing to customer use, collection, cleaning, inspection, redistribution, and support. They want employees to classify activities according to the value-chain framework rather than simply describing every visible facility as infrastructure. This distinction will help FreshLoop identify where cost reductions might damage the service and where investment could improve customer value.", "FreshLoop’s original intended strategy was to sell annual subscriptions to large retailers. Pilot results showed limited consumer participation, while independent restaurants strongly preferred a deposit-return service. Regional managers responded by expanding neighborhood collection points and cleaning capacity, creating a realized strategy that differed from the original plan. The company is now considering a differentiation strategy based on container durability, convenient returns, and its patented freshness technology. A competing proposal would emphasize low price, but managers worry that cost leadership could weaken hygiene, collection coverage, and service reliability."]}, {"title": "GreenCity Permits", "ch": "Ch 11", "text": ["GreenCity’s municipal permit department processes applications for home renovations, business signs, public events, and small construction projects. The department still relies heavily on paper files, email attachments, and in-person appointments. Residents often travel to the municipal office simply to check whether a document has been received. Employees spend considerable time searching for files and manually transferring information between systems.", "Public dissatisfaction is growing. Surveys show that residents consider the process slow and difficult to understand. Average processing time has increased to seven weeks, and missing documents cause repeated delays. Local businesses argue that slow permits postpone investments. At the same time, national digital-accessibility standards will soon require municipalities to provide online services that people with different abilities can use effectively.", "The department plans to introduce an online portal through which residents can submit documents, monitor progress, and receive requests for additional information. Human support will remain available by telephone and at municipal service points. Nevertheless, employees express concerns. Some fear that older residents will be excluded, while others worry that automation will make their administrative knowledge less valuable. Several supervisors prefer gradual technical improvements without changing the existing process.", "The department head believes the organization first needs a shared understanding of why change is necessary. At a staff meeting, she presents waiting-time data, examples of lost documents, survey results, and direct citizen complaints. She compares GreenCity’s performance with municipalities that already provide accessible online services. She also explains the approaching national standards and the consequences of failing to meet them.", "Afterward, the department forms a guiding group of employees, accessibility specialists, community representatives, and IT staff. The group develops a vision of “accessible permits anywhere, with human support when needed.” A pilot in one district later reduces processing time by 30 percent. GreenCity uses Kotter’s model to understand how urgency, a guiding coalition, a clear vision, short-term wins, and cultural reinforcement contribute to change. The immediate question is how to classify the department head’s opening use of performance evidence and public complaints.", "The sequence is important. The department head does not begin by purchasing software or changing job descriptions. She first demonstrates that delay, citizen dissatisfaction, and approaching legal standards make the current situation unsustainable. The evidence is intended to overcome complacency and establish a shared reason for action before the coalition develops solutions and the pilot produces measurable results.", "The later steps provide additional evidence for classification. The mixed group of employees, accessibility experts, residents, and IT specialists functions as a guiding coalition. The statement about accessible permits provides a change vision. The district pilot’s measurable 30 percent reduction in processing time is communicated as a short-term win. Leaders plan to use training, performance expectations, and continuing citizen feedback to reinforce the new process. Each action belongs to a different part of Kotter’s sequence, even though all support the same overall transformation."]}, {"title": "UrbanStay Hotels", "ch": "Ch 6", "text": ["UrbanStay Hotels operates medium-sized properties in European business districts. Before the pandemic, most guests were employees traveling for meetings, conferences, and short assignments. UrbanStay’s mission emphasized dependable accommodation for business travelers, and its operating model was designed around high weekday occupancy. The hotels offered standard rooms, meeting spaces, breakfast, and corporate billing arrangements.", "Remote and hybrid work have changed travel behavior. Many companies now hold routine meetings online, reducing traditional weekday bookings. At the same time, a different group of guests has emerged. Remote professionals, consultants, and entrepreneurs increasingly combine work and travel. They may stay for several weeks and expect reliable internet, comfortable workspaces, flexible services, and opportunities to connect with local communities.", "Senior management originally intended to restore occupancy through discounted room rates for existing corporate customers. A formal plan was approved, and hotels received standard promotional materials. However, regional managers in Lisbon and Copenhagen observed that discounts did not address the needs of longer-stay guests. Without waiting for a full company-wide redesign, they tested monthly packages combining accommodation, coworking space, laundry services, and community activities.", "The pilots produced unexpected results. Occupancy increased, guests stayed longer, and revenue per guest was higher than under the discount program. Customer feedback showed that the package’s convenience and social elements were more important than a low nightly price. Other regional managers began copying the approach, and UrbanStay gradually redirected marketing resources toward flexible long-stay packages.", "The strategy department is reviewing what happened. The original discount program represents what senior leaders deliberately planned. The monthly package emerged through local experimentation and became a consistent pattern because it produced results. Management recognizes that an organization’s realized strategy may differ from its intended strategy when experience, learning, or external developments lead managers to adjust their actions. UrbanStay must now decide whether to formalize the monthly package across the group and revise its mission and vision accordingly.", "Executives emphasize that the local packages were not isolated accidents. Managers repeated them over several months, allocated staff and space to support them, and shared the approach with other regions. The resulting pattern became more important than the original discount plan. The case therefore requires students to distinguish what leadership initially intended from what the organization ultimately implemented and learned to perform successfully.", "UrbanStay’s internal review identifies centrally located properties and corporate relationships as strengths, while high energy costs and outdated meeting rooms are weaknesses. Growing demand for extended work-from-anywhere stays is an external opportunity, whereas aggressive competition from flexible-apartment platforms is a threat. Leaders are also reconsidering the organization’s future aspiration. A proposed vision describes UrbanStay as Europe’s leading home for flexible and sustainable mobile professionals, distinguishing an aspirational future from its present mission, operating activities, and legal responsibilities."]}, {"title": "CareConnect Hospital", "ch": "Ch 11", "text": ["CareConnect Hospital has traditionally stored patient information in separate paper files maintained by different departments. Doctors, nurses, pharmacists, and laboratory employees often record related information in different locations. This creates delays when files must be transferred and increases the risk that employees will overlook important information. Hospital leaders believe that one electronic patient-record system will improve safety, reduce duplicated tests, and make information available during treatment.", "The proposed change affects almost every clinical role. Doctors support faster access to laboratory results but worry that data entry will reduce the time available for patients. Nurses are concerned about using computers during busy shifts. Some experienced employees believe paper records are safer because familiar routines have worked for many years. Others welcome the opportunity to reduce repeated paperwork.", "CareConnect begins with communication, training, and a supervised pilot in one department. Employees practice entering information, and technical staff remain available during every shift. The pilot reveals problems with screen design and role responsibilities, so leaders revise the workflow and provide additional coaching. These activities represent the movement toward new behavior rather than the final stage of change.", "After the revised system performs reliably, CareConnect focuses on making the new approach stable. Electronic documentation becomes part of formal job descriptions. Audits measure whether required information is entered correctly, and performance discussions include appropriate system use. New employees receive training during orientation, while experienced staff receive continuing support. Senior clinicians consistently use the system during patient rounds and correct colleagues who return to unofficial paper notes.", "Hospital leaders use Lewin’s three-stage model to understand the process. Unfreezing creates readiness by questioning the old system. Changing involves learning and testing the new behavior. Refreezing stabilizes the behavior by aligning structures, expectations, and routines with the change. CareConnect now wants managers to recognize which of its actions most clearly demonstrates refreezing rather than preparation or implementation.", "Managers review several actions that occurred at different times. Presenting safety concerns challenged the existing approach. Training and the pilot helped employees practice unfamiliar behavior. Formal job requirements, audits, performance discussions, orientation, and visible senior-clinician behavior now make the electronic system part of normal work. These later mechanisms reduce the likelihood that departments will return to separate unofficial paper routines.", "Not every employee responds in the same way. Some attend training but secretly continue using paper records when supervisors are absent, demonstrating passive rather than active resistance. The belief that paper is inherently safer is not merely a visible artifact or formal policy; for experienced staff it operates as a deeply taken-for-granted underlying assumption. Leaders therefore combine structural reinforcement with visible role modeling to change both behavior and the meaning employees attach to safe documentation."]}, {"title": "NorthSea Foods", "ch": "Ch 6", "text": ["NorthSea Foods is a European food producer with brands in traditional dairy products, plant-based alternatives, snacks, and desserts. For many years, the company’s dairy business generated most of its revenue. More recently, NorthSea has invested in plant-based drinks, meat alternatives, and protein-rich snacks. Senior management wants the portfolio to remain profitable while responding to changes in customer expectations and regulation.", "The market is developing quickly. A growing group of consumers is reducing its use of animal products because of health concerns, animal-welfare values, allergies, and environmental awareness. Supermarkets are giving more shelf space to plant-based products, and social media has made new eating patterns visible across age groups. Younger consumers often expect food companies to explain where ingredients come from and how products affect people, animals, and the environment.", "Other environmental forces are also relevant. Inflation is increasing ingredient and transportation costs. New production technologies are improving the taste and texture of plant-based food. Governments are debating agricultural subsidies, while environmental labeling rules require clearer information about emissions. Climate change may affect the availability and price of crops used in both dairy and plant-based production. These developments belong to different parts of the external environment and may require different strategic responses.", "NorthSea’s managers are using PESTEL to organize the information. Political factors include government priorities and agricultural policy. Economic factors include inflation, interest rates, and purchasing power. Social factors concern lifestyles, values, demographics, and consumption preferences. Technological factors include production methods and product innovation. Environmental factors concern climate and natural resources, while legal factors include mandatory standards and enforceable labeling requirements", "The classification matters because managers must understand what is driving demand. If plant-based growth mainly reflects changing values and lifestyles, marketing and product development may need to respond differently than they would to a legal requirement or temporary economic condition. NorthSea therefore wants employees to distinguish the increasing consumer preference for plant-based food from the separate legal trend toward stricter environmental labeling.", "Market researchers report that the preference exists even in countries without new labeling laws or additional subsidies. Interviews repeatedly mention personal health, animal welfare, identity, and environmental concern as reasons for changing diets. Management concludes that regulation may influence how products are described, but it does not fully explain why consumers are voluntarily choosing different foods and incorporating them into everyday routines.", "The company also reviews its portfolio through the BCG Matrix. Traditional dairy has high market share in a slow-growth market and supplies stable cash. The plant-based brand has high share in a rapidly growing market but still needs investment. A seaweed-snack brand operates in a growing category with low share, while an older dessert brand has low share in a low-growth market. Decisions about allocating resources across these different businesses belong to corporate strategy rather than the functional or team level.", "To support its strategic planning, NorthSea combines its external analysis with portfolio data. Management recognizes that identifying environmental trends is only useful when those insights influence strategic choices. The company therefore compares the market growth and relative market position of its four major businesses. Managers must decide which businesses can generate resources, which require continued investment, which need selective strategic attention, and which may have limited future potential. These decisions help NorthSea translate external analysis into corporate-level resource allocation and execution."]}, {"title": "AeroLogistics", "ch": "Ch 11", "text": ["AeroLogistics specializes in urgent deliveries of medicines, laboratory samples, and small medical devices. Most deliveries currently travel by road. This works well in cities, but remote communities may wait several hours because of distance, traffic, ferries, or severe weather. Healthcare customers have asked AeroLogistics to investigate faster alternatives without weakening safety or reliability.", "Recent advances in drone technology create a possible solution. Modern drones can carry heavier loads, navigate longer routes, and transmit detailed flight information. However, aviation regulation is still developing, and communities have concerns about noise, privacy, and safety. Several competitors are testing similar services in partnership with technology startups.", "AeroLogistics forms a cross-functional innovation team that includes pilots, engineers, logistics employees, healthcare customers, safety specialists, and community representatives. The team runs a limited pilot between one pharmacy and an island clinic. The route follows all current safety requirements and reduces average delivery time from three hours to forty minutes. The company publishes the results and asks participants to identify improvements.", "Management wants more employees to propose ideas for routes, packaging, scheduling, and community communication. Leaders recognize that innovation requires experimentation and that not every proposal will succeed. They establish clear boundaries: experiments must follow safety rules, use evidence, and have an agreed learning purpose. When a responsible experiment fails to meet its target, the team documents the result, explains what was learned, and decides whether to revise or discontinue the idea.", "Some managers argue that unsuccessful experiments should reduce an employee’s performance rating. Others believe automatic punishment would discourage useful ideas and cause employees to hide problems. AeroLogistics therefore reviews how leadership behavior, psychological safety, cross-functional collaboration, and attitudes toward responsible failure shape an innovative culture. The company does not want uncontrolled risk-taking, but it also does not want employees to wait until competitors have proven every idea. Managers must distinguish a learning-oriented innovative culture from a culture that either punishes experimentation or ignores responsible controls.", "The leadership team clarifies that learning from failure does not mean accepting carelessness. Proposals must still use evidence, respect regulations, and protect patients and communities. The cultural question concerns how the organization responds when a well-designed experiment produces an unexpected result. Leaders believe that open discussion of such outcomes can improve later decisions, whereas blame may encourage employees to hide information or avoid proposing improvements.", "The case also illustrates how external developments can be classified. Advances in drone design are technological, uncertain aviation requirements are legal, competitor partnerships are competitive, and community concerns reflect changing social expectations. The island pilot provides a short-term win because it reduces delivery time while meeting safety standards. Together, the external classification, measurable result, and learning-oriented treatment of responsible experiments help managers explain why innovation can strengthen service quality and future competitive position.", "As AeroLogistics considers expanding the drone service, management also examines whether the innovation can create lasting value. A Value Chain analysis shows that drone technology could improve outbound logistics by reducing delivery times, while engineering expertise, healthcare partnerships, and flight-data capabilities support the new service. A VRIO analysis suggests that the drone itself is not a unique resource because competitors can purchase similar technology. However, AeroLogistics’ combination of medical-logistics knowledge, safety expertise, healthcare relationships, and learning from pilot projects may be more difficult for competitors to reproduce. Management therefore recognizes that successful innovation depends not only on adopting new technology, but also on developing the organizational capabilities and culture needed to use it effectively."]}];

function drawQ(uid,d,used){
 const order=d===1?[1,2,3]:d===2?[2,3,1]:[3,2,1],now=Date.now();
 for(const dd of order){
  const items=[];

 const checkOk=st.check>=BAR,chalOk=st.chal>=BAR,perfect=mk&&mk[1]>0&&mk[0]===mk[1];

 const h=st.hist.slice(-10);let p;

 list.forEach(i=>{if(acc+cost(i)>cap&&k<out.length-1){k++;acc=0;}out[k].items.push(i);acc+=cost(i);});

 if(z.done){const r=rmScore(z),g=grade(r.pts);
  const list=z.refs.map((_,j)=>j).filter(j=>{const q=rmSrc(z.refs[j]);return rmFilter==="all"||z.ans[j]==null||z.ord[j][z.ans[j]]!==q.a;});
  return`<div class="page"><section class="panel"><div class="eyebrow">Final mock · result</div><div class="score" style="margin:10px 0"><span class="big ${r.pts>=75?"c-good":r.pts>=61.25?"c-warn":"c-bad"}">${r.pts}<small style="font-size:28px" class="muted">/100</small></span><span><b>${r.ok} of ${r.n} correct</b><br><span class="muted">Estimated grade ${gf(g)}. Target: 75 points.</span></span></div>
  <div class="row"><button class="btn primary" data-act="rmstart" data-inst="${z.instant?1:0}">New mix</button><button class="btn" data-act="rmback">Back</button></div></section>
  <section class="page" style="padding-top:0"><div class="row" style="justify-content:space-between"><h3>Review</h3><div class="seg"><button data-act="rmf" data-v="all" aria-pressed="${rmFilter==="all"}">All ${N}</button><button data-act="rmf" data-v="wrong" aria-pressed="${rmFilter==="wrong"}">Only wrong (${N-r.ok})</button></div></div><div class="review">${list.map(j=>rmCard(z,j,"review")).join("")||`<div class="panel empty">Nothing wrong. Nice.</div>`}</div></section></div>`;}
 const i=z.i,last=i===N-1,answered=z.ans[i]!=null;
 const grid=[["Part 1",0,20],["Part 2",20,35],["Part 3",35,N]].map(([t,a,b])=>`<div class="navrow"><span class="mono">${t}</span>${z.refs.slice(a,b).map((_,o)=>{const j=a+o;return`<button class="nb ${z.ans[j]!=null?"ans":""} ${j===i?"cur":""}" data-act="rmgo" data-k="${j}">${j+1}</button>`;}).join("")}</div>`).join("");
 return`<div class="page"><div class="exbar"><span>Final mock · ${z.instant?"practice":"exam mode"}</span><span class="sp"></span><span><b>${n}</b>/${N} answered</span><button data-act="rmback">Leave</button><button class="go" data-act="rmsubmit">Submit</button></div>
 ${rmConfirm?`<div class="confirm"><span><b>${N-n?`${N-n} unanswered.`:"All questions answered."}</b> Submit and see your score?</span><span class="row"><button class="btn sm" data-act="rmcancel">Keep working</button><button class="btn sm ink" data-act="rmconfirm">Submit</button></span></div>`:""}
 ${rmCard(z,i,"run")}
 <div class="qfoot"><button class="btn" data-act="rmgo" data-k="${i-1}" data-prev ${i===0?"disabled":""}>Previous</button><div class="prog"><i style="width:${100*n/N}%"></i></div>${last?`<button class="btn primary" data-act="rmsubmit">Submit</button>`:`<button class="btn ${answered?"primary":""}" data-act="rmgo" data-k="${i+1}" data-next>Next <kbd>Enter</kbd></button>`}</div>
 <section class="panel"><div class="navg">${grid}</div></section></div>`;}
/* ---------- key terms ---------- */
let KT={mode:"list",grp:-1,q:null,ans:null,n:0,ok:0};
const ALLT=GLOSS.flatMap((g,gi)=>g.t.map(([t,d])=>({t,d,gi})));
function ktPick(){S.kt=S.kt||{};const pool=KT.grp<0?ALLT:ALLT.filter(x=>x.gi===KT.grp);
 const w=pool.map(x=>{const s=S.kt[x.t]||[0,0];return Math.max(.25,1+2*s[1]-.6*s[0])*(KT.q&&KT.q.t===x.t?0:1);});
 let r=R()*w.reduce((a,b)=>a+b,0),c=pool[0];for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){c=pool[i];break;}}
 let others=shuffle(ALLT.filter(x=>x.gi===c.gi&&x.t!==c.t));if(others.length<3)others=others.concat(shuffle(ALLT.filter(x=>x.gi!==c.gi)));
 const o=shuffle([c].concat(others.slice(0,3)));KT.q={t:c.t,d:c.d,gi:c.gi,o:o.map(x=>x.t),a:o.indexOf(c)};KT.ans=null;}
function vTerms(){const seg=`<div class="seg"><button data-act="kt-mode" data-m="list" aria-pressed="${KT.mode==="list"}">Study list</button><button data-act="kt-mode" data-m="drill" aria-pressed="${KT.mode==="drill"}">Drill</button><button data-act="kt-mode" data-m="compare" aria-pressed="${KT.mode==="compare"}">Differences</button></div>`;
 const grps=`<div class="row ktg"><button class="btn sm ${KT.grp<0?"primary":""}" data-act="kt-grp" data-g="-1">All ${ALLT.length}</button>${GLOSS.map((g,i)=>`<button class="btn sm ${KT.grp===i?"primary":""}" data-act="kt-grp" data-g="${i}">${g.g}</button>`).join("")}</div>`;
 const head=`<section class="panel"><div class="eyebrow">Vocabulary · all chapters</div><h3>Key terms</h3><p class="sub">These ${ALLT.length} terms come back in almost every mock question. Read the list once, then drill until the definitions trigger the right word instantly. Terms you miss come back more often.</p>${seg}</section>`;
 let body="";
 if(KT.mode==="list"){body=`<section class="panel"><input id="ktq" class="ktq" type="search" placeholder="Search a term or word in a definition" autocomplete="off">${GLOSS.map((g,i)=>`<div class="ktgrp" data-g="${i}"><h4>${g.g} <span class="tag">${g.ch}</span></h4><div class="terms">${g.t.map(([t,d])=>{const s=(S.kt||{})[t];return`<div class="ktrow"><b>${t}${s&&s[1]>s[0]?` <span class="tag study">review</span>`:""}</b><span>${d}</span></div>`;}).join("")}</div></div>`).join("")}<div class="row" style="margin-top:16px"><button class="btn primary" data-act="kt-mode" data-m="drill">Start the drill</button></div></section>`;}
 else if(KT.mode==="compare"){body=`<section class="panel"><p class="sub">Exam questions love asking for the difference between two look-alike concepts.</p><div class="terms">${COMPARE.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("")}</div></section>`;}
 else{if(!KT.q)ktPick();const q=KT.q,L="ABCD",done=KT.ans!=null;
  const opts=q.o.map((t,k)=>{let cls="opt";if(done){if(k===q.a)cls+=" right";else if(k===KT.ans)cls+=" wrong";}return`<button class="${cls}" data-act="ktans" data-i="${k}" ${done?"disabled":""}><span class="L">${L[k]}</span><span>${t}</span></button>`;}).join("");
  const wrongDef=done&&KT.ans!==q.a?(ALLT.find(x=>x.t===q.o[KT.ans])||{}).d:"";
  const fb=done?`<div class="fb">${KT.ans===q.a?`<b class="ok">Correct.</b>`:`<b class="no">Not quite. It's ${q.t}.</b> <br><span class="muted">${q.o[KT.ans]} means: ${wrongDef}</span>`}</div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" data-act="kt-next" data-next>Next term <kbd>Enter</kbd></button></div>`:"";
  body=`<section>${grps}</section><article class="q"><div class="meta"><span class="row" style="gap:6px"><span class="tag">${GLOSS[q.gi].g} · ${GLOSS[q.gi].ch}</span></span><span class="mono">${KT.n?`${KT.ok} / ${KT.n} correct`:"Which term matches?"}</span></div><div class="stem">${q.d}</div><div class="opts">${opts}</div>${fb}</article>`;}
 return`<div class="page">${head}${body}</div>`;}
function render(){paintPills();paintRail();const main=document.getElementById("main");
 main.innerHTML=S.view==="plan"?vPlan():S.view==="mock"?vMock():S.view==="result"?vResult():S.view==="mistakes"?vMistakes():S.view==="grading"?vGrading():S.view==="cases"?vCases():S.view==="terms"?vTerms():S.view==="rmock"?vRmock():vUnit();}
function scrollTop(){window.scrollTo({top:0});}
function scrollToQ(){const el=document.querySelector("#main .q");if(el){const r=el.getBoundingClientRect();if(r.top<0||r.top>window.innerHeight*.6)el.scrollIntoView({block:"start"});}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==="go"){S.view=b.dataset.v;if(S.view==="mistakes"&&S.quiz&&S.quiz.kind==="redo"&&S.quiz.done)S.quiz=null;save();render();scrollTop();}
 else if(a==="unit"){S.view="unit";if(S.unit!==b.dataset.u){P=null;FC=null;}S.unit=b.dataset.u;S.tab=b.dataset.t||"learn";save();render();scrollTop();}
 else if(a==="tab"){S.tab=b.dataset.t;save();render();scrollTop();}
 else if(a==="startquiz"){startQuiz(b.dataset.k,S.unit);render();scrollTop();}
 else if(a==="ans"){const val=+b.dataset.i;
  if(S.view==="unit"&&S.tab==="practice"&&P&&P.q){if(P.ans!=null)return;P.ans=val;P.n++;const ok=val===P.q.a;if(ok)P.ok++;record(P.q,ok,val,"practice");save();render();return;}
  const z=S.quiz;if(!z||z.done||z.ans[z.i]!=null)return;z.ans[z.i]=val;record(z.qs[z.i],val===z.qs[z.i].a,val,z.kind);save();render();}
 else if(a==="qnext"){const z=S.quiz;if(!z)return;if(z.i<z.qs.length-1){z.i++;}else{z.done=true;finishQuiz(z);}save();render();scrollToQ();if(z.done)scrollTop();}
 else if(a==="pnext"){P.q=nextPractice();P.ans=null;render();scrollToQ();}
 else if(a==="fcflip"){FC.flip=!FC.flip;render();}
 else if(a==="fcnext"){if(b.dataset.k==="1")FC.known++;else{FC.again++;FC.order.push(FC.order[FC.i]);}FC.i++;FC.flip=false;render();}
 else if(a==="fcreset"){FC=null;render();}
 else if(a==="cz-open"){const c=CASE[b.dataset.id];CZ={id:c.id,qs:c.qs.map((_,i)=>caseQ(c,i)),ans:c.qs.map(()=>null)};S.view="cases";save();render();scrollTop();}
 else if(a==="cz-close"){CZ=null;render();scrollTop();}
 else if(a==="czans"){const k=+b.dataset.k,val=+b.dataset.i;if(!CZ||CZ.ans[k]!=null)return;CZ.ans[k]=val;record(CZ.qs[k],val===CZ.qs[k].a,val,"case");save();render();}
 else if(a==="startmock"){if(S.cur){S.view="mock";render();return;}if(S.view!=="mock"||!document.getElementById("timed")){S.view="mock";S.cur=null;render();scrollTop();return;}startMock();}
 else if(a==="mans"){const c=S.cur;if(!c)return;const v=+b.dataset.i;c.ans[c.i]=c.ans[c.i]===v?null:v;save();render();}
 else if(a==="mgo"){S.cur.i=+b.dataset.k;confirmSubmit=false;save();render();scrollToQ();}
 else if(a==="mnext"){if(S.cur.i<S.cur.qs.length-1)S.cur.i++;save();render();scrollToQ();}
 else if(a==="mprev"){if(S.cur.i>0)S.cur.i--;save();render();scrollToQ();}
 else if(a==="mflag"){S.cur.flag[S.cur.i]=!S.cur.flag[S.cur.i];save();render();}
 else if(a==="msubmit"){confirmSubmit=true;render();scrollTop();}
 else if(a==="mcancel"){confirmSubmit=false;render();}
 else if(a==="mconfirm"){submitMock();}
 else if(a==="result"){S.resId=b.dataset.id;S.view="result";resFilter="all";save();render();scrollTop();}
 else if(a==="rf"){resFilter=b.dataset.v;render();}
 else if(a==="rmstart"){rmStart(b.dataset.inst==="1");}
 else if(a==="rmans"){const z=S.rm;if(!z||z.done)return;if(z.instant&&z.ans[z.i]!=null)return;z.ans[z.i]=+b.dataset.i;save();render();}
 else if(a==="rmgo"){const z=S.rm,k=+b.dataset.k;if(!z||k<0||k>=z.ans.length)return;z.i=k;rmConfirm=false;save();render();scrollToQ();}
 else if(a==="rmsubmit"){rmConfirm=true;render();scrollTop();}
 else if(a==="rmcancel"){rmConfirm=false;render();}
 else if(a==="rmconfirm"){const z=S.rm;z.done=true;rmConfirm=false;const r=rmScore(z);S.rmHist=(S.rmHist||[]).concat([{pts:r.pts,when:Date.now()}]).slice(-20);save();render();scrollTop();}
 else if(a==="rmback"){if(S.rm&&S.rm.done)S.rm=null;rmList=true;rmConfirm=false;S.view="rmock";save();render();scrollTop();}
 else if(a==="rmresume"){rmList=false;render();scrollTop();}
 else if(a==="rmf"){rmFilter=b.dataset.v;render();}
 else if(a==="kt-mode"){KT.mode=b.dataset.m;if(KT.mode==="drill"&&KT.ans!=null)ktPick();render();scrollTop();}
 else if(a==="kt-grp"){KT.grp=+b.dataset.g;ktPick();render();}
 else if(a==="kt-next"){ktPick();render();}
 else if(a==="ktans"){if(KT.ans!=null)return;const q=KT.q;KT.ans=+b.dataset.i;KT.n++;const ok=KT.ans===q.a;if(ok)KT.ok++;S.kt=S.kt||{};const s=S.kt[q.t]||[0,0];s[ok?0:1]++;S.kt[q.t]=s;save();render();}
 else if(a==="redo"){const w=S.wrong.slice().reverse().slice(0,10);const qs=w.map(x=>{const n=x.q.o.length,p=shuffle([...Array(n).keys()]);return Object.assign({},x.q,{o:p.map(i=>x.q.o[i]),a:p.indexOf(x.q.a)});});S.quiz={kind:"redo",u:null,qs,ans:qs.map(()=>null),i:0,done:false};save();render();scrollTop();}
});
document.addEventListener("input",e=>{if(e.target.id==="ktq"){const v=e.target.value.toLowerCase().trim();document.querySelectorAll("#main .ktgrp").forEach(g=>{let any=0;g.querySelectorAll(".ktrow").forEach(r=>{const m=!v||r.textContent.toLowerCase().includes(v);r.hidden=!m;if(m)any=1;});g.hidden=!any;});return;}if(e.target.id==="calcn"){calcN=+e.target.value;const g=grade(calcN);const gb=document.getElementById("calcg");gb.textContent=gf(g);gb.className=g>=7?"c-good":g>=5.5?"c-warn":"c-bad";document.getElementById("calct").textContent=`${calcN} of 100 points`;const mk=document.querySelector("#main .scale .mk");if(mk){const pos=calcN;mk.style.left=pos+"%";mk.className=`mk you ${pos<12?"edgeL":pos>88?"edgeR":""}`;mk.querySelector("span").textContent=`${calcN} → ${gf(g)}`;}}});
function finishQuiz(z){if(z.kind==="redo")return;const st=S.u[z.u],sc=z.ans.filter((a,k)=>a===z.qs[k].a).length;const was=unitInfo(z.u).status;
 if(z.kind==="check"){st.check=Math.max(st.check,sc);st.checkN++;}else{st.chal=Math.max(st.chal,sc);st.chalN++;}
 if(was!=="done"&&unitInfo(z.u).status==="done")toast(`Mastered: ${UNIT[z.u].t}`);}
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea,select"))return;if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),map={a:0,b:1,c:2,d:3,e:4,f:5,"1":0,"2":1,"3":2,"4":3,"5":4,"6":5};
 if(S.view==="unit"&&S.tab==="cards"&&FC){if(k===" "){e.preventDefault();FC.flip=!FC.flip;render();return;}if(k==="1"||k==="2"){const btn=document.querySelector(`#main [data-act="fcnext"][data-k="${k==="2"?1:0}"]`);if(btn){btn.click();e.preventDefault();}return;}}
 if(k in map){const btn=document.querySelector(`#main [data-act="ans"][data-i="${map[k]}"]:not([disabled]),#main [data-act="mans"][data-i="${map[k]}"],#main [data-act="ktans"][data-i="${map[k]}"]:not([disabled]),#main [data-act="rmans"][data-i="${map[k]}"]:not([disabled])`);if(btn){btn.click();e.preventDefault();}}
 else if(k==="enter"||k==="arrowright"){const btn=document.querySelector("#main [data-next]:not([disabled])");if(btn&&!(k==="enter"&&document.activeElement&&document.activeElement.tagName==="BUTTON"&&document.activeElement!==btn)){btn.click();e.preventDefault();}}
 else if(k==="arrowleft"){const btn=document.querySelector("#main [data-prev]:not([disabled])");if(btn){btn.click();e.preventDefault();}}});
let tickN=0;
setInterval(()=>{if(S.view!=="mock"||!S.cur||document.hidden)return;const c=S.cur;c.elapsed++;tickN++;const el=document.getElementById("timer");if(el)el.textContent=c.timed?fmtT(MOCK_SECS-c.elapsed):fmtT(c.elapsed);
 if(c.timed&&c.elapsed>=MOCK_SECS){toast("Time is up. Your mock was submitted.");submitMock();return;}if(tickN%15===0)save();},1000);
setInterval(paintPills,6e4);
render();
</script>
