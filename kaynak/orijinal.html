<p class="bl"><b>Mechanistic</b>: top-down hierarchy, rules, centralized, narrow span of control. For stable, simple environments.</p>
<p class="bl"><b>Organic</b>: flatter, participative, fewer rules, wider span of control. For unstable, complex environments.</p>
<h4>Six structures</h4>
<table class="rules"><tr><th>Structure</th><th>Organized by</th><th>Plus / minus</th></tr>
<tr><td><b>Functional</b></td><td>Departments of expertise (R&D, production, finance, HR)</td><td>+ specialization, economies of scale · − silos, slow coordination</td></tr>
<tr><td><b>Divisional</b></td><td>Divisions (product, market), each with its own marketing, sales, finance…</td><td>+ focus, faster customer contact · − duplication, divisions isolated</td></tr>
<tr><td><b>Geographic</b></td><td>Locations of customers (regions, countries)</td><td>+ local knowledge · − too decentralized</td></tr>
<tr><td><b>Matrix</b></td><td>Two dimensions: employees report to a functional boss <b>and</b> a project/product boss</td><td>+ flexibility, cross-functional · − two bosses, confusion, conflict</td></tr>
<tr><td><b>Network / team</b></td><td>Informal, flexible horizontal teams</td><td>+ fast, adaptive · − unclear communication, tech-dependent</td></tr>
<tr><td><b>Virtual</b></td><td>Boundaryless, depends on ICT; HQ may be the only fixed base (Uber, Airbnb)</td><td>+ cost savings, wide talent pool · − isolation, less trust</td></tr></table>
<div class="trap"><b>Exam traps</b><br>Engineers stay in their specialist department <b>but also</b> report to product managers = matrix (mock Q28).<br>Remote specialists across countries working online = virtual. Regional authority = geographic.</div>`,
 terms:[["Macro (general, external) environment","The big-picture world of PESTEL factors the organization barely controls."],["Mechanistic structure","Top-down, rule-based, centralized; for stable environments."],["Organic structure","Flat, flexible, participative; for changing environments."],["Functional structure","Organized by departments and areas of expertise."],["Divisional structure","Functional departments grouped under division heads, each with its own functions."],["Geographic structure","Organized by the locations of customers."],["Matrix structure","Employees report to a functional boss and a project/product boss."],["Networked team structure","Informal, flexible, decentralized horizontal teams."],["Virtual structure","Boundaryless organization relying on information and communication technology."]]
},
{id:"c8b", ch:8, pts:4, t:"Organizational culture & diversity (DEI)",
 notes:`
<p><b>Organizational culture</b>: a system of shared assumptions, values and beliefs that show people what is appropriate and inappropriate behaviour. A rare, hard-to-imitate culture can be a competitive advantage (Barney). Like water to a fish: invisible but shaping behaviour.</p>
<h4>Schein's three levels</h4>
<table class="rules"><tr><th>Level</th><th>What</th><th>Example</th></tr>
<tr><td>Artifacts (surface)</td><td>Visible, tangible aspects</td><td>Open-door policy, office layout, pool tables, company picnics</td></tr>
<tr><td>Values</td><td>Shared principles, standards, goals</td><td>Egalitarianism, having fun</td></tr>
<tr><td>Assumptions (deepest)</td><td>Taken for granted, below awareness</td><td>“Happy employees benefit the organization”</td></tr></table>
<h4>Dimensions of culture</h4>
<p>Innovative · aggressive (competitive) · outcome-oriented · stable (predictable, rule-based) · people-oriented (fair, supportive) · team-oriented · detail-oriented.</p>
<p><b>Strong culture</b>: most employees share the values. An asset or a liability; hard to change; can clash in mergers (Daimler-Chrysler). <b>Subcultures</b> form in departments or locations; a <b>counterculture</b> opposes the main culture.</p>
<h4>How culture is created and maintained</h4>
<p>Founder values · industry demands · attraction-selection-attrition · onboarding of new employees · leadership · reward systems.</p>
<h4>Signs of culture</h4>
<p>Mission statement · rituals · rules and policies · physical layout · stories and language.</p>
<h4>Diversity</h4>
<p>Broad meaning: also personality, cognitive style, education, social background. <b>Advantages</b>: enhances <b>creativity</b>, enhances <b>image</b>, improves <b>outreach</b> to new markets, improves <b>morale</b>. BCG: diversity builds resilience and adaptiveness.</p>
<p><b>Gender</b>: women earn more degrees but face the <b>glass ceiling</b> (invisible barrier based on prejudice), the pay gap and sexual harassment (quid pro quo, hostile environment; “Me too”).</p>
<p><b>Sexual orientation and gender identity</b>: sexual minorities have higher education levels on average but still face hiring and treatment discrimination.</p>
<div class="trap"><b>Exam traps</b><br>The office layout is an <b>artifact</b> (and a sign of culture), not a value.<br>“Most employees agree on the values” = strong culture. A department opposing the company's values = counterculture.</div>`,
 terms:[["Organizational culture","Shared assumptions, values and beliefs that show what behaviour is appropriate."],["Artifacts","Visible, tangible aspects of culture."],["Assumptions","Taken-for-granted beliefs at the deepest level of culture."],["Strong culture","Most employees agree on the company's values."],["Subculture","Culture within a department, branch or location."],["Counterculture","Group whose values oppose the overall culture."],["Rituals","Repetitive activities that teach values and build identification."],["Onboarding","How new employees learn the attitudes, knowledge and behaviours they need."],["Glass ceiling","Invisible barrier based on prejudice that stops women advancing."]]
},
/* ---------------- Chapter 9 ---------------- */
{id:"c9a", ch:9, pts:4, t:"Hofstede & GLOBE",
 notes:`
<p>Hofstede (Dutch social psychologist): culture is “the <b>collective programming of the mind</b> which distinguishes the members of one group or category of people from another”. Survey of 88,000+ IBM employees in 72 countries, four dimensions:</p>
<table class="rules"><tr><th>Dimension</th><th>Meaning</th><th>High / low examples</th></tr>
<tr><td><b>Power distance</b></td><td>Degree to which members accept differences in power and authority</td><td>High: Mexico, India, Brazil, China · Low: US, UK, Denmark</td></tr>
<tr><td><b>Individualism / collectivism</b></td><td>Focus on the individual vs on the group as a whole</td><td>Individualist: US, UK, Canada · More collectivist: Asia, Latin America</td></tr>
<tr><td><b>Uncertainty avoidance</b></td><td>Degree to which people are comfortable with risk, uncertainty and unpredictable situations (high = want clear rules)</td><td>High: France, Greece, Japan · Low: Denmark, US, UK</td></tr>
<tr><td><b>Masculinity</b></td><td>Emphasis on traditional masculine qualities: achievement, advancement, earnings; clear gender roles</td><td>High: Japan, Mexico, Germany · Low: Denmark, Finland</td></tr></table>
<p>High power distance → leaders show authority, subordinates expect clear directions. Collectivist → group-based hiring and decisions, consensus.</p>
<h4>GLOBE framework (1990s)</h4>
<p>Global Leadership and Organizational Behavior Effectiveness: 170 researchers, 17,000 managers, 62 countries. Nine dimensions; most overlap with Hofstede (uncertainty avoidance, power distance, future orientation, assertiveness, gender egalitarianism, institutional and societal collectivism). Unique to GLOBE: <b>performance orientation</b> (emphasis on performance and achievement) and <b>humane orientation</b> (fairness, altruism, caring).</p>
<p>Countries grouped in <b>clusters</b> (Anglo, Confucian Asia, Germanic Europe, Nordic Europe, Latin America, Middle East, Sub-Saharan Africa) with preferred leadership styles (charismatic, team-oriented, participative, humane-oriented, autonomous, self-protective).</p>
<p><b>Psychic distance</b>: differences between countries in language, culture, institutions and business practices.</p>
<div class="trap"><b>Exam traps</b><br>Uncertainty avoidance = comfort with risk and ambiguity, not long-term planning (mock Q21).<br>Power distance = acceptance of power and authority differences (mock Q22).<br>Hofstede = 1960s, four dimensions. GLOBE = 1990s, adds performance and humane orientation.</div>`,
 terms:[["Culture (Hofstede)","The collective programming of the mind that distinguishes one group from another."],["Power distance","Degree to which a society accepts differences in power and authority."],["Individualism","Focus on the individual's relationship to the group."],["Collectivism","Focus on the group as a whole."],["Uncertainty avoidance","Degree to which people are comfortable with risk, uncertainty and unpredictability."],["Masculinity","Emphasis on traditional masculine qualities such as achievement and earnings."],["GLOBE","1990s cultural framework of 62 countries with nine dimensions."],["Performance orientation","GLOBE: emphasis on performance and achievement."],["Humane orientation","GLOBE: importance of fairness, altruism and caring."],["Psychic distance","Differences between countries in language, culture, institutions and business practice."]]
},
{id:"c9b", ch:9, pts:4, t:"Globalization & expanding globally",
 notes:`
<p><b>Globalization</b>: countries becoming more interconnected while trade barriers disappear. That's why international leadership matters.</p>
<h4>Three globalization factors</h4>
<table class="rules"><tr><th>Factor</th><th>Meaning</th></tr>
<tr><td>Lowering trade barriers</td><td>Trade agreements and policies remove cross-border barriers such as <b>tariffs</b> (taxes on imports)</td></tr>
<tr><td>Foreign direct investment (FDI)</td><td>A company invests in another country through ownership positions there (global FDI 2017: $1.52 trillion)</td></tr>
<tr><td>The Internet</td><td>Any company can sell to anyone in the world; social media builds relationships worldwide</td></tr></table>
<h4>Strategies for expanding globally</h4>
<table class="rules"><tr><th>Strategy</th><th>Meaning</th></tr>
<tr><td><b>Global</b></td><td>Assumes the world is interconnected and consumption is fairly homogeneous: the same product everywhere</td></tr>
<tr><td><b>Regional</b></td><td>Organizes activities (marketing, finance) around key geographic regions (Toyota)</td></tr>
<tr><td><b>Local</b></td><td>Adapts products to the local market's needs and values</td></tr></table>
<h4>How to go international</h4>
<table class="rules"><tr><th>Entry mode</th><th>Meaning</th></tr>
<tr><td><b>Exporting</b></td><td>Selling products made at home abroad. Easiest; exporters are about 17% more profitable.</td></tr>
<tr><td>Licensing</td><td>For a royalty or fee, another company may use your trademark, know-how or technology</td></tr>
<tr><td>Franchising</td><td>Licensing the whole business model (trademark, structure, training)</td></tr>
<tr><td><b>Strategic alliance</b></td><td>Two or more companies from different countries agree to do business together; a <b>joint venture</b> creates a new business they own together. Preferred in emerging markets.</td></tr>
<tr><td><b>FDI</b></td><td>Fully investing in the host country by building facilities there (e.g. a wholly owned subsidiary)</td></tr></table>
<div class="trap"><b>Exam trap</b><br>“Creates a new business that it owns together with a local company” = <b>joint venture</b> (strategic alliance), not a wholly owned subsidiary (mock Q20).</div>`,
 terms:[["Globalization","Countries becoming more interconnected as trade barriers disappear."],["Tariffs","Taxes added to the price of imported products."],["FDI","Investing in another country through ownership positions in companies there."],["Global strategy","Same approach worldwide, assuming homogeneous consumption."],["Regional strategy","Organizing activities around key geographic regions."],["Local strategy","Adapting products to each local market."],["Exporting","Sending products made at home to other countries."],["Licensing","Giving another company the right to use your trademark or technology for a fee."],["Strategic alliance","Agreement between companies from different countries to do business together."],["Joint venture","A new business jointly owned by two or more companies."]]
},
/* ---------------- Chapter 10 ---------------- */
{id:"c10a", ch:10, pts:3, t:"Teams: Tuckman & team diversity",
 notes:`
<p>Teamwork has never been more important, in manufacturing (self-directed teams) and in the knowledge economy. A <b>group</b> is a collection of individuals; a <b>team</b> is a cohesive coalition working toward a shared agenda.</p>
<h4>Tuckman's stages of team development</h4>
<table class="rules"><tr><th>Stage</th><th>What happens</th></tr>
<tr><td><b>Forming</b></td><td>Polite stage: introductions, enthusiasm, team looks to the leader for structure</td></tr>
<tr><td><b>Storming</b></td><td>Win-lose stage: members compete for control, clash, take sides; frustration about goals and roles</td></tr>
<tr><td><b>Norming</b></td><td>Team works well together; ground rules and shared responsibility; respect</td></tr>
<tr><td><b>Performing</b></td><td>Self-directed, confident, getting results; little direction needed</td></tr>
<tr><td>Adjourning (added 1977)</td><td>The team disbands at the end of the project</td></tr></table>
<p>The stages are <b>not linear</b>. Adding a new member or a confusing new task can send the team back to an earlier stage (it may re-storm and re-form).</p>
<p>Katzenbach & Smith's team performance curve: from working group to high-performing team.</p>
<h4>Team diversity</h4>
<p>Diverse teams are better at decision making and problem solving: they focus more on facts, re-examine them, and avoid groupthink. They are also more innovative. McKinsey: top quartile for ethnic diversity in management 35% more likely to beat industry returns; gender diversity 15%.</p>
<div class="trap"><b>Exam trap</b><br>A team that was performing gets new members and uncertainty appears about roles = it slides back to <b>storming</b>; agreeing shared working rules = <b>norming</b> (mock Q29).</div>`,
 terms:[["Team","A cohesive coalition of people working together toward a shared agenda."],["Forming","Polite first stage; team relies on the leader."],["Storming","Members compete for control and clash."],["Norming","Ground rules, shared responsibility and respect develop."],["Performing","Self-directed team gets results."],["Adjourning","The team disbands at the end of a project."]]
},
{id:"c10b", ch:10, pts:3, t:"Social networks",
 notes:`
<p><b>Social network</b>: a patterned set of relationships between two or more people (<b>actors</b>), drawn as a <b>sociogram</b>. Networks are “the invisible organization”: how communication and resources really flow.</p>
<p><b>Three advantages</b> for leaders: access to information and knowledge · access to diverse skill sets · power.</p>
<h4>Lexicon</h4>
<table class="rules"><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Actors / nodes</td><td>The people or groups in the network</td></tr>
<tr><td>Ties</td><td>Connections. Direct (one link) or indirect (through others)</td></tr>
<tr><td>Strong ties</td><td>Know each other well; frequent exchanges</td></tr>
<tr><td>Weak ties</td><td>Know each other at least by reputation; no regular exchange. Granovetter: people find jobs mostly through weak ties.</td></tr>
<tr><td>Bridging tie</td><td>Gives non-redundant information and resources</td></tr>
<tr><td>Centrality / density</td><td>How central an actor is / how many in the network are connected</td></tr></table>
<h4>Three principles (Kilduff & Tsai)</h4>
<table class="rules"><tr><th>Principle</th><th>Meaning</th></tr>
<tr><td><b>Reciprocity</b></td><td>Trading favours of roughly equal value</td></tr>
<tr><td><b>Exchange</b></td><td>Trading favours with people who are <b>different</b> from you: more value from complementary resources</td></tr>
<tr><td><b>Similarity</b></td><td>Ties form spontaneously between people with common backgrounds, values, interests (risk: echo chamber)</td></tr></table>
<h4>Ibarra's three types of networks</h4>
<table class="rules"><tr><th>Network</th><th>Purpose</th></tr>
<tr><td><b>Operational</b></td><td>Get your current work done efficiently (people who can block or support a project)</td></tr>
<tr><td><b>Personal</b></td><td>Personal and professional development: referrals, outside information, coaching, mentoring (alumni groups, clubs, associations)</td></tr>
<tr><td><b>Strategic</b></td><td>Figure out future priorities and challenges and get stakeholder support for them</td></tr></table>
<p>Example from the slides: Barack Obama's 2008 campaign used social networking principles.</p>
<div class="trap"><b>Exam traps</b><br>Contacts outside your firm for coaching and career advice = personal. Contacts that help you see future trends and opportunities = strategic (mock Q30). Colleagues you need for today's tasks = operational.</div>`,
 terms:[["Social network","A patterned set of relationships between two or more actors."],["Strong ties","Actors who know each other well and exchange often."],["Weak ties","Actors who know each other but don't exchange regularly."],["Bridging tie","A tie providing non-redundant information and resources."],["Principle of reciprocity","Trading favours of relatively equal value."],["Principle of exchange","Trading favours with people different from you, for complementary resources."],["Principle of similarity","Ties develop between people with common backgrounds and interests."],["Operational network","Contacts that help you get your current work done."],["Personal network","Contacts for development, referrals, coaching and mentoring."],["Strategic network","Contacts that help you see future priorities and gain support."]]
},
/* ---------------- Chapter 11 (long case) ---------------- */
{id:"c11a", ch:11, pts:3, t:"Innovative culture & failure to innovate",
 notes:`
<p><b>Innovative culture</b>: a work environment that fosters and rewards employee creativity instead of focusing on deadlines and revenue. Five traits: <b>unique strategy, autonomy, trust, accepting failures, leadership</b>.</p>
<p><b>Benefits</b> (Swisher): sets a course for improvement · develops new ideas · company growth · competitive advantage · team efficiency · adaptive nature · attracts talent · improves the brand.</p>
<h4>How leaders nurture innovation</h4>
<table class="rules"><tr><th>Method</th><th>Example</th></tr>
<tr><td>Internal collaboration</td><td>Cross-departmental teams; R&D spends ~10% of its time in marketing and sales</td></tr>
<tr><td>Innovation labs & intrapreneurship</td><td>Employee ideas become spin-offs (LEGO's Future Lab)</td></tr>
<tr><td>Innovation time</td><td>Google and 3M: 15–20% of the week for side projects (Gmail)</td></tr>
<tr><td>Partnerships & acquisitions</td><td>Share the risk, or buy small innovative firms (Cisco)</td></tr>
<tr><td>Open labs for co-creation</td><td>Customers co-create (BMW, Co-Create IKEA, LEGO Ideas)</td></tr></table>
<p><b>Innovation portfolio</b>: invest 70% core, 20% adjacent, 10% transformational; long-term returns are the reverse (10 / 20 / 70).</p>
<h4>Seven reasons for failure to innovate</h4>
<p>Fear of taking risks · lack of market orientation (no real customer value) · failure to scale · poor organizational structure and processes · wrong decisions · lack of internal communication · low priority for innovation. Usually failure comes from <b>implementation</b>, not the idea.</p>
<div class="trap"><b>Exam trap</b><br>A product nobody needs because it isn't different from what exists = lack of market orientation, not fear of risk.</div>`,
 terms:[["Innovative culture","Work environment that fosters and rewards creativity rather than focusing on deadlines and revenue."],["Intrapreneurship","An employee's idea becomes a spin-off or subsidiary led by that employee."],["Innovation time","Free time for employees to work on innovative side projects."],["Open lab / co-creation","Developing ideas together with customers, suppliers or partners."],["Innovation portfolio","70% core, 20% adjacent, 10% transformational investment."],["Lack of market orientation","Not understanding customer needs, so the product offers no real value."]]
},
{id:"c11b", ch:11, pts:3, t:"Innovation networks & why organizations change",
 notes:`
<h4>The innovation network (McKinsey)</h4>
<p>Connections and networks matter more for innovation than individual creativity. Four steps:</p>
<table class="rules"><tr><th>Step</th><th>What</th></tr>
<tr><td>1. Connect</td><td>Identify people with an innovation mind-set from different backgrounds</td></tr>
<tr><td>2. Set boundaries and engage</td><td>Define goals and how they link to strategy, mission and vision; time frames</td></tr>
<tr><td>3. Support and govern</td><td>Leadership structure, protocols, resources, sponsorship from top leaders</td></tr>
<tr><td>4. Manage and track</td><td>Rewards for members, tracking progress, joining and leaving</td></tr></table>
<p>Archetypes in the network: idea generators, researchers, experts, producers.</p>
<h4>Organizational change</h4>
<p><b>Organizational change</b>: the movement of an organization from one state of affairs to another. Often required by a change in the environment. It can affect structure, strategy, policies, technology or culture; radical or incremental.</p>
<table class="rules"><tr><th>Driver</th><th>Example</th></tr>
<tr><td>Workplace demographics</td><td>Ageing workforce, too few young workers</td></tr>
<tr><td>Technology</td><td>Moore's law; music industry vs Napster</td></tr>
<tr><td>Globalization</td><td>Outsourcing and offshoring</td></tr>
<tr><td>Market conditions</td><td>Airlines after 9/11 and fuel price rises</td></tr>
<tr><td>Growth</td><td>Widmer Brothers: garage to 11th largest US brewery</td></tr>
<tr><td>Poor performance</td><td>Poor performers change more easily; success breeds overconfidence and inertia: “nothing fails like success” (Polaroid). New CEOs also trigger change.</td></tr></table>`,
 terms:[["Innovation network","Network of innovators built in four steps: connect, set boundaries and engage, support and govern, manage and track."],["Organizational change","Movement of an organization from one state of affairs to another."],["Nothing fails like success","Successful firms resist change through overconfidence and inertia."]]
},
{id:"c11c", ch:11, pts:3, t:"Reactions & resistance to change",
 notes:`
<h4>Four reactions to change</h4>
<table class="rules"><tr><th>Reaction</th><th>Behaviour</th></tr>
<tr><td><b>Active resistance</b></td><td>Most negative: sabotages, objects openly, encourages others to resist</td></tr>
<tr><td><b>Passive resistance</b></td><td>Disturbed but silent: dislikes it quietly, stressed, may look for another job without telling anyone</td></tr>
<tr><td><b>Compliance</b></td><td>Goes along with little enthusiasm</td></tr>
<tr><td><b>Enthusiastic support</b></td><td>Defends the new way and encourages others to support it (the exception)</td></tr></table>
<h4>Seven reasons people resist</h4>
<table class="rules"><tr><th>Reason</th><th>Example</th></tr>
<tr><td>Disrupted habits</td><td>Automatic routines broken (automatic → stick shift)</td></tr>
<tr><td>Personality</td><td>Low openness, low self-esteem, risk avoidance</td></tr>
<tr><td>Feelings of uncertainty</td><td>A merger: nobody knows what happens to their job</td></tr>
<tr><td>Fear of failure</td><td>Experts doubt they'll perform well in the new system</td></tr>
<tr><td>Personal impact of change</td><td>People welcome changes that help them and resist ones that hurt them</td></tr>
<tr><td>Prevalence of change</td><td>Too many changes; fatigue and skepticism</td></tr>
<tr><td>Perceived loss of power</td><td>Supervisors lose authority when teams take over</td></tr></table>
<p>Resistance is not always bad: it is <b>valuable feedback</b>, and the most loyal employees may be the loudest critics. Example: the faster Dvorak keyboard never replaced QWERTY because of resistance.</p>
<div class="trap"><b>Exam trap</b><br>The difference between active and passive is <b>voice</b>: loud objecting or sabotage is active, silent unhappiness is passive.</div>`,
 terms:[["Active resistance","Sabotaging or openly objecting and encouraging others to resist."],["Passive resistance","Disliking the change quietly without voicing it."],["Compliance","Going along with the change with little enthusiasm."],["Enthusiastic support","Defending the change and encouraging others to support it."],["Prevalence of change","Resistance because there have been too many changes."],["Perceived loss of power","Resistance because the change reduces your authority or status."]]
},
{id:"c11d", ch:11, pts:3, t:"Lewin's three stages & Kotter's eight steps",
 notes:`
<h4>Lewin's three-stage model (1940s–50s)</h4>
<table class="rules"><tr><th>Stage</th><th>Actions</th></tr>
<tr><td><b>1. Unfreeze</b></td><td>Prepare people: communicate a plan and a vision, develop a sense of urgency, build a coalition of opinion leaders, give emotional and instrumental support (training), let employees participate</td></tr>
<tr><td><b>2. Change (move)</b></td><td>Execute: continue to support, create small wins, eliminate obstacles</td></tr>
<tr><td><b>3. Refreeze</b></td><td>Make it permanent: publicize success, reward change adoption</td></tr></table>
<p>Contrast: the <b>learning organization</b> sees change as continuous rather than one episode.</p>
<h4>Kotter's eight steps (1990s), mapped on Lewin</h4>
<table class="rules"><tr><th>Lewin</th><th>Kotter step</th><th>Case clue</th></tr>
<tr><td rowspan="4">Unfreeze</td><td>1. Create urgency</td><td>Showing data, complaints, crisis, competitors, consequences of doing nothing</td></tr>
<tr><td>2. Build a guiding coalition</td><td>A small, influential group that <b>leads</b> the change</td></tr>
<tr><td>3. Form a strategic vision & initiatives</td><td>A short statement of the desired future</td></tr>
<tr><td>4. Enlist a volunteer army</td><td>A <b>large</b> group of people who sign up to help</td></tr>
<tr><td rowspan="3">Change</td><td>5. Enable action by removing barriers</td><td>Old procedures or forms scrapped; staff empowered</td></tr>
<tr><td>6. Generate short-term wins</td><td>A pilot with a visible, measurable result</td></tr>
<tr><td>7. Sustain acceleration</td><td>Using early success to roll out further</td></tr>
<tr><td>Refreeze</td><td>8. Institute change</td><td>Written into hiring, training, job descriptions, reviews</td></tr></table>
<p class="muted">Memory hook: “Ugly Cats Vote Very Badly When Angry Indoors.”</p>
<div class="trap"><b>Exam traps</b><br>Small leading group = guiding coalition; a big crowd of volunteers = volunteer army.<br>Presenting waiting times and complaints = create urgency (mock Q34). A measurable pilot result = short-term win (mock Q35).</div>`,
 terms:[["Unfreeze","Preparing people so they are ready for and open to change."],["Refreeze","Making the change permanent so new habits become the norm."],["Guiding coalition","Kotter 2: a group with enough power and credibility to lead the change."],["Volunteer army","Kotter 4: a large base of people who act on the vision."],["Short-term wins","Kotter 6: visible early results that are rewarded."],["Institute change","Kotter 8: anchoring new behaviours in the culture."],["Learning organization","Embraces continuous change instead of one-off episodes."]]
},
{id:"c11e", ch:11, pts:3, t:"Schein's culture change & comparing the models",
 notes:`
<h4>Schein's culture change process (six steps)</h4>
<table class="rules"><tr><th>Step</th><th>Book example</th></tr>
<tr><td>1. Create a sense of urgency</td><td>Lou Gerstner used IBM's crisis to get buy-in</td></tr>
<tr><td>2. Change leaders and other key players</td><td>Disney's new CEO Iger removed the planning unit close to the old CEO</td></tr>
<tr><td>3. Role modeling</td><td>Iger joined game creation himself; bad example: HP executives' spying scandal</td></tr>
<tr><td>4. Training</td><td>NASA safety training after Columbia; Midas customer training</td></tr>
<tr><td>5. Change the reward system</td><td>Commission → salary for customer focus; team bonuses for a team culture</td></tr>
<tr><td>6. Create new symbols and stories</td><td>Continental Airlines burned its 800-page manual (new one: 80 pages)</td></tr></table>
<p class="muted">Memory hook: “Ugly Lions Rarely Take Rainy Showers.”</p>
<h4>Comparing the three models</h4>
<table class="rules"><tr><th>Model</th><th>When</th><th>Focus</th></tr>
<tr><td>Lewin</td><td>1940s–50s</td><td>3 stages; general framework for any change; overcoming resistance</td></tr>
<tr><td>Schein</td><td>1980s–90</td><td>6 steps; changing <b>culture</b>: values, role models, symbols</td></tr>
<tr><td>Kotter</td><td>1990s</td><td>8 steps; roadmap for <b>large-scale</b> transformation</td></tr></table>
<div class="trap"><b>Exam trap</b><br>All three start with urgency. Read which model the question names and answer inside that model.</div>`,
 terms:[["Role modeling","Employees change their beliefs and behaviour to reflect the leader's."],["New symbols and stories","Visible acts and stories that show the new culture (Continental's manual)."],["Changing key players","Replacing leaders who block the change."],["Schein's model","Six steps for culture change."]]
}
];
const UNIT = Object.fromEntries(UNITS.map(u=>[u.id,u]));
/* ================= QUESTION BANK (o[0] is the correct option; shuffled when shown) ================= */
const BANK = []; let _sn = 0;
function S_(u,d,q,o,x){ BANK.push({id:u+"-"+(++_sn), u, d, q, o, x}); }

/* ---- c1a Management & POLC ---- */
S_("c1a",1,"Management is best described as:",["The art of getting things done through the efforts of other people","Doing the most important tasks yourself","Owning and financing a business","Controlling employees' personalities and emotions"],"The course definition: getting things done through others.");
S_("c1a",1,"Which four functions make up the P-O-L-C framework?",["Planning, organizing, leading, controlling","Planning, operating, listening, checking","Producing, organizing, leading, coordinating","Planning, ordering, leading, communicating"],"P-O-L-C = planning, organizing, leading, controlling.");
S_("c1a",1,"Setting objectives and determining a course of action to achieve them is:",["Planning","Organizing","Leading","Controlling"],"That is the definition of planning.");
S_("c1a",1,"Developing an organizational structure and allocating human resources to reach objectives is:",["Organizing","Planning","Leading","Controlling"],"Organizing = structure + allocating people (and job design).");
S_("c1a",1,"Strategic planning typically:",["Covers three years or more and is done by top management","Covers one to three years and is done by middle managers","Covers less than a year with specific action steps","Is done weekly by supervisors"],"Strategic = 3+ years, top management, whole organization.");
S_("c1a",1,"Which are the three steps of controlling?",["Set performance standards, compare actual performance with them, take corrective action","Plan, do, check","Hire, train, reward","Scan the environment, forecast, budget"],"Controlling: standards → compare → correct.");
S_("c1a",1,"The triple bottom line measures performance on:",["Economic, social and environmental dimensions","Revenue, costs and profit","Planning, organizing and leading","Customers, employees and shareholders"],"People, planet, profit.");
S_("c1a",2,"A store manager sees that monthly sales are 12% below target and schedules extra sales training. Which function is this?",["Controlling","Planning","Organizing","Leading"],"Comparing actual results with a standard and correcting = controlling.");
S_("c1a",2,"A regional manager writes a two-year plan to roll out the company's new national strategy in her 40 stores. Which type of planning?",["Tactical planning","Strategic planning","Operational planning","Environmental scanning"],"1–3 years, middle management, implementing the strategy = tactical.");
S_("c1a",2,"A team leader writes next week's shift schedule so the store can reach its monthly target. Which type of planning?",["Operational planning","Tactical planning","Strategic planning","Controlling"],"Short-term, specific action steps = operational.");
S_("c1a",2,"A manager tells her team an inspiring story about why their work matters, and the team works with new enthusiasm. Which function?",["Leading","Organizing","Controlling","Planning"],"Leading = informal influence that inspires action.");
S_("c1a",2,"An employee stays late to help a new colleague learn the system, although this isn't in her job description. This is:",["Organizational citizenship behaviour","In-role performance","Process loss","Empowerment"],"Voluntary, extra-role help = OCB.");
S_("c1a",2,"A manager redesigns jobs so each employee does a wider variety of tasks with more autonomy. Which function?",["Organizing","Controlling","Planning","Leading"],"Job design is part of organizing.");
S_("c1a",3,"Which pairing of concept and definition is correct?",["Entrepreneurship: recognizing opportunities and using or creating resources to implement innovative ideas for new ventures","Strategy: the informal influence used to inspire others","Leadership: the integrated, externally oriented concept of how an organization reaches its objectives","Organizing: ensuring performance does not deviate from standards"],"The other three swap definitions: the strategy and leadership definitions are switched, and the organizing one is controlling.");
S_("c1a",3,"In the contemporary (upside-down pyramid) view of management:",["Top managers support and serve other managers and employees, who serve the customers","Top managers give orders that flow down a strict hierarchy","Employees exist to serve their managers","Customers sit at the bottom and are served last"],"Contemporary view: empowerment, top supports the front line, which serves customers.");
S_("c1a",3,"A group of five produces less than its members could together because time is lost arguing about who does what. In the book's terms this is:",["Process loss","Organizational citizenship behaviour","Tactical planning","Empowerment"],"Group performance = inputs minus process loss.");

/* ---- c1b Managers: Mintzberg & Katz ---- */
S_("c1b",1,"Mintzberg's ten managerial roles are divided into which three groups?",["Interpersonal, informational, decisional","Planning, organizing, controlling","Technical, interpersonal, conceptual","Strategic, tactical, operational"],"Interpersonal, informational, decisional. Technical/interpersonal/conceptual is Katz.");
S_("c1b",1,"Katz's three critical skill sets are:",["Technical, interpersonal (human) and conceptual","Interpersonal, informational and decisional","Planning, leading and controlling","Financial, marketing and operational"],"Katz: technical, human, conceptual.");
S_("c1b",1,"A line manager:",["Leads a function that contributes directly to the products or services the organization creates","Leads a supporting function such as finance or accounting","Manages one project from planning to closing","Represents the company at ceremonies"],"Line = direct contribution (P&G's Tide product manager). Finance is a staff function.");
S_("c1b",1,"A general manager is responsible for:",["A clearly identifiable revenue-producing unit, such as a store or product line","Only the HR department","Coordinating one small team inside a function","Writing the vision of the whole organization"],"General manager = a revenue-producing unit, decisions across functions.");
S_("c1b",1,"According to Katz, which skill becomes MORE important the higher a manager rises?",["Conceptual skills","Technical skills","Software skills","None: all three stay equally important"],"Higher up: more conceptual, fewer technical skills.");
S_("c1b",1,"In which Mintzberg role does a manager receive and collect information?",["Monitor","Disseminator","Spokesperson","Liaison"],"Monitor = receiving and collecting information.");
S_("c1b",2,"A manager studies customer complaints and industry reports to spot developments that may affect the organization. Which Mintzberg role?",["Monitor","Resource allocator","Negotiator","Leader"],"Collecting information = monitor.");
S_("c1b",2,"The CEO cuts the ribbon at the opening of a new factory. Which Mintzberg role?",["Figurehead","Liaison","Spokesperson","Entrepreneur"],"Ceremonial, formal representation = figurehead.");
S_("c1b",2,"A manager decides how next year's budget is divided across three departments. Which role?",["Resource allocator","Disturbance handler","Negotiator","Monitor"],"Choosing where effort and money go = resource allocator.");
S_("c1b",2,"A supplier strike threatens production, and the manager quickly arranges an emergency alternative. Which role?",["Disturbance handler","Entrepreneur","Resource allocator","Liaison"],"Dealing with threats and crises = disturbance handler.");
S_("c1b",2,"After a board meeting, a manager shares the key decisions with her own team. Which role?",["Disseminator","Spokesperson","Monitor","Figurehead"],"Passing information INTO the organization = disseminator.");
S_("c1b",2,"A manager gives a press interview about the company's new sustainability results. Which role?",["Spokesperson","Disseminator","Figurehead","Liaison"],"Passing information OUT to the environment = spokesperson.");
S_("c1b",2,"A manager starts a project to launch a home-delivery service. Which role?",["Entrepreneur","Resource allocator","Leader","Monitor"],"Initiating change = entrepreneur.");
S_("c1b",2,"A workshop supervisor shows apprentices how to diagnose an engine fault with the scanner. Which Katz skill is she mainly using?",["Technical skills","Conceptual skills","Interpersonal skills","Decisional skills"],"Field-specific know-how = technical.");
S_("c1b",3,"Which statement about Mintzberg's roles is correct?",["The leader role is important at every level of management","Supervisors spend more time as figurehead than top managers do","The negotiator role belongs to the informational group","The disseminator sends the organization's information to the press"],"Leadership runs through all levels. Supervisors do less figurehead work; negotiator is decisional; disseminator is internal.");
S_("c1b",3,"A CEO spends most of her week on long-term strategy and policies; a team leader spends his week fixing machines with his team. According to Katz:",["The CEO relies most on conceptual skills, the team leader on technical skills","Both rely mainly on technical skills","The CEO relies most on technical skills, the team leader on conceptual skills","Neither needs interpersonal skills"],"Top = conceptual; lower level = technical; interpersonal matters for both.");
S_("c1b",3,"Which statement correctly separates two Mintzberg roles?",["The disseminator passes information into the organization; the spokesperson passes it out to the environment","The disseminator passes information to the press; the spokesperson passes it to the team","Both are decisional roles","Both are interpersonal roles"],"Both are informational: disseminator = inside, spokesperson = outside.");
S_("c1b",3,"A manager meets managers of other companies at an industry event to build contacts that can help her unit later. Which role and group?",["Liaison, interpersonal","Spokesperson, informational","Negotiator, decisional","Figurehead, interpersonal"],"Interacting with people outside the unit = liaison, an interpersonal role.");

/* ---- c2a Personality & values ---- */
S_("c2a",1,"Personality is defined as:",["A person's relatively stable feelings, thoughts and behavioural patterns","A person's opinions about their job","The emotional attachment to an employer","The skills a person learned at school"],"Personality = relatively stable feelings, thoughts and behaviour.");
S_("c2a",1,"Which list contains exactly the Big Five personality traits?",["Openness, conscientiousness, extraversion, agreeableness, neuroticism","Openness, commitment, extraversion, ambition, neuroticism","Optimism, conscientiousness, empathy, agreeableness, narcissism","Openness, conscientiousness, self-esteem, self-efficacy, neuroticism"],"OCEAN.");
S_("c2a",1,"Which Big Five trait predicts job performance across nearly all occupations?",["Conscientiousness","Extraversion","Openness","Agreeableness"],"Conscientiousness is the one trait that uniformly predicts performance.");
S_("c2a",1,"For which Big Five trait is scoring high generally undesirable?",["Neuroticism","Openness","Agreeableness","Extraversion"],"Neuroticism: anxious, irritable, moody.");
S_("c2a",1,"Self-efficacy is:",["The belief that you can perform a specific task successfully","Overall positive feelings about yourself","The ability to adjust behaviour to each social situation","The inclination to fix what is wrong without being asked"],"Self-efficacy is task-specific. The others are self-esteem, self-monitoring and proactive personality.");
S_("c2a",1,"Values are best defined as:",["People's stable life goals, reflecting what is most important to them","Short-term moods at work","The rules written in a company handbook","The skills required for a job"],"Values = stable life goals.");
S_("c2a",2,"Lena is curious, creative and loves learning new tools. Which Big Five trait does she score high on?",["Openness","Conscientiousness","Agreeableness","Extraversion"],"Curious, creative, open to new ideas = openness.");
S_("c2a",2,"An employee consistently prepares carefully, meets deadlines and follows through on commitments. Which characteristic is predominant?",["Conscientiousness","Organizational commitment","Openness to experience","Extraversion"],"Organized and dependable = conscientiousness. Commitment is an attitude toward the company.");
S_("c2a",2,"Tom is often anxious, irritable and moody at work. Which trait does he score high on?",["Neuroticism","Agreeableness","Openness","Conscientiousness"],"Anxious, irritable, moody = neuroticism.");
S_("c2a",2,"A salesperson is outgoing, talkative and loves meeting new clients. Which trait?",["Extraversion","Conscientiousness","Openness","Neuroticism"],"Outgoing and sociable = extraversion (good in sales).");
S_("c2a",2,"Without being asked, an employee notices a broken process and fixes it. Which personality dimension?",["Proactive personality","Self-monitoring","Neuroticism","Agreeableness"],"Taking initiative to fix what is wrong = proactive personality.");
S_("c2a",2,"Sara is confident she can master Excel quickly but doubts she could give a good presentation. This illustrates:",["Self-efficacy","Self-esteem","Self-monitoring","Agreeableness"],"Self-efficacy differs per task.");
S_("c2a",2,"Mark acts like a 'social chameleon', reading each situation and adjusting how he comes across. He is high in:",["Self-monitoring","Neuroticism","Self-efficacy","Agreeableness"],"High self-monitors adjust their behaviour to the situation.");
S_("c2a",3,"Which statement about personality testing in selection is correct?",["Personality explains only about 10–15% of job performance; cognitive ability predicts performance better","Personality tests cannot be faked","Personality is the strongest predictor of job performance","Personality tests are never controversial"],"Book: modest correlations, faking is possible, cognitive ability predicts better.");
S_("c2a",3,"A team avoids challenging the status quo because members dislike conflict. Which trait, despite its benefits, is linked to this drawback?",["Agreeableness","Conscientiousness","Openness","Extraversion"],"Agreeable people are less likely to engage in constructive, change-oriented communication.");
S_("c2a",3,"Which statement about personality is correct?",["It is relatively stable but can change over long periods of time","It never changes after childhood","It is the same as values","It always determines behaviour regardless of the job"],"Stable but changes slowly; job demands also shape behaviour.");

/* ---- c2b Work attitudes & fit ---- */
S_("c2b",1,"What is organizational commitment?",["The emotional attachment people have to the company they work for","The pay level of an employee","Compliance with organizational rules and policies","A list of job tasks"],"Emotional attachment: believes in the values, puts in effort, wants to stay.");
S_("c2b",1,"Job satisfaction refers to:",["The feelings people have toward their job","How long someone stays with a company","The match between skills and job demands","The fairness of pay"],"Job satisfaction = feelings toward the job.");
S_("c2b",1,"An attitude is:",["Our opinions, beliefs and feelings about aspects of our environment","A stable personality trait","A formal job description","A company's written policy"],"Book definition.");
S_("c2b",1,"The psychological contract is:",["The unspoken, informal understanding of what employee and organization will give each other","The signed employment contract","A personality test used in hiring","The company's code of conduct"],"Unspoken expectations: effort and loyalty for pay, raises, security.");
S_("c2b",1,"Person-organization fit is:",["The match between a person's values, personality and goals and those of the organization","The match between a person's skills and the job's demands","The number of years someone works for a company","A person's fit with their manager's personality"],"P-O fit = values with the organization. Skills with the job = P-J fit.");
S_("c2b",1,"Which job characteristic is linked to higher satisfaction and commitment?",["Autonomy at work","Organizational justice","Personality","Stress"],"The job characteristics are skill variety, autonomy, feedback and significance. Justice and stress are separate factors.");
S_("c2b",2,"Employees learn that promotions were decided by drawing names from a hat. Which type of justice is violated?",["Procedural justice","Distributive justice","Interactional justice","Equity sensitivity"],"An unfair decision-making process = procedural justice.");
S_("c2b",2,"A manager gives an employee a raise but tells her, 'Even you deserve something sometimes.' Which justice suffers?",["Interactional justice","Distributive justice","Procedural justice","Psychological contract"],"Lack of respect and dignity = interactional justice.");
S_("c2b",2,"Workers doing the same job feel their pay is unfair compared with colleagues. Which type of justice?",["Distributive justice","Procedural justice","Interactional justice","Role conflict"],"Fairness of outcomes such as pay = distributive.");
S_("c2b",2,"Yara isn't sure what her responsibilities are since the reorganization. This stressor is:",["Role ambiguity","Role conflict","Interactional justice","Person-job fit"],"Uncertainty about responsibilities = role ambiguity.");
S_("c2b",2,"Tim's manager wants him to work late, but his role as a parent requires him home by six. This is:",["Role conflict","Role ambiguity","Procedural justice","Low self-efficacy"],"Contradictory demands between roles = role conflict.");
S_("c2b",2,"HR meets every employee who resigns to learn why they're leaving. This tool is:",["An exit interview","An attitude survey","Onboarding","A performance appraisal"],"Exit interviews are with departing employees.");
S_("c2b",2,"A creative risk-taker joins a nuclear power plant where routine and predictability are key. The most likely problem is:",["Poor person-organization fit","Too much organizational commitment","High interactional justice","Strong self-efficacy"],"His traits don't match the organization's values.");
S_("c2b",3,"Which statement about the attitude-behaviour link is correct?",["Attitudes predict intentions better than actual behaviour, because the situation also matters","Dissatisfied employees always quit","Attitudes have no relation to behaviour","Attitude surveys work best when answers are shared with the direct manager"],"A dissatisfied employee intends to leave; leaving depends on alternatives. Surveys work best when confidential.");
S_("c2b",3,"According to the interactionist perspective:",["Behaviour is a function of the person and the situation interacting","Behaviour depends only on personality","Behaviour depends only on the job","Fit between person and organization doesn't affect attitudes"],"Person × situation; fit increases satisfaction and commitment.");
S_("c2b",3,"An employee says 'we have great benefits here' and stays despite a better offer elsewhere. This mainly shows:",["High organizational commitment","High neuroticism","Role ambiguity","A violated psychological contract"],"Using 'we' and wanting to stay are signs of commitment.");

/* ---- c3a Leadership, power & influence ---- */
S_("c3a",1,"Leadership is defined in the course as:",["The act of influencing others to work toward a goal","Holding the highest position in an organization","Controlling the budget","Following the rules"],"Influence toward a goal.");
S_("c3a",1,"Which five sources of power did French and Raven identify?",["Reward, coercive, referent, expert, legitimate","Reward, charismatic, technical, financial, legal","Formal, informal, personal, social, expert","Position, money, knowledge, network, time"],"French & Raven: reward, coercive, referent, expert, legitimate.");
S_("c3a",1,"An informal leader:",["Has no formal position of authority but influences others through personal power","Is appointed by top management","Only uses coercive power","Is the official leader recognized outside the group"],"Informal leaders are acknowledged by the group, not appointed.");
S_("c3a",1,"Coercive power is:",["The ability to punish or take away something people value","The ability to give rewards","Power from expertise","Power from being admired"],"Coercive = punishment.");
S_("c3a",2,"A sales manager can assign desirable territories and performance bonuses to employees who achieve agreed targets. Which source of power?",["Reward power","Expert power","Referent power","Informational power"],"Giving rewards others want = reward power.");
S_("c3a",2,"A cybersecurity specialist influences the executive team because of her knowledge, although she holds no managerial position. Which power?",["Expert power","Legitimate power","Reward power","Coercive power"],"Knowledge others need = expert power.");
S_("c3a",2,"Colleagues follow Ahmed's lead because they admire him and want to be like him. Which power?",["Referent power","Legitimate power","Coercive power","Reward power"],"Admiration and identification = referent power.");
S_("c3a",2,"Employees follow the new director's instructions mainly because she is 'the boss' by title. Which power?",["Legitimate power","Referent power","Expert power","Reward power"],"The right to influence from a formal position = legitimate.");
S_("c3a",2,"A team member without any title becomes the person everyone turns to during a crisis project. She is best described as:",["An emergent, informal leader","A designated, formal leader","A Theory X leader","A figurehead"],"She arises from the group's dynamics and has no formal position.");
S_("c3a",2,"A manager assumes employees dislike work and need tight control, so he checks everything. This reflects:",["Theory X","Theory Y","Servant leadership","Referent power"],"McGregor's Theory X.");
S_("c3a",3,"Which statement about the effects of power is correct?",["Coercive power tends to alienate followers, while referent and expert power lead to better satisfaction and performance","Coercive power is the most effective way to build commitment","Legitimate power alone is enough for a leader to succeed","Reward power always creates deep commitment to the leader's goals"],"Book: coercion alienates; referent and expert power work best; legitimate alone is rarely enough.");
S_("c3a",3,"A project manager can't give bonuses or punish anyone, but the team follows her because she knows the software best and they like her. Which combination?",["Expert and referent power","Reward and coercive power","Legitimate and reward power","Coercive and legitimate power"],"Knowledge = expert; being liked = referent.");
S_("c3a",3,"Which statement best describes the leadership process (Hollander & Julian)?",["A dynamic exchange relationship built over time between leader and followers who depend on each other for a shared goal","A one-way order from leader to follower","A fixed set of traits a leader is born with","A formal title given by the organization"],"Leadership is a two-way, dynamic relationship built over time.");
S_("c3a",3,"Theory Y leaders typically:",["Give employees discretion and involve them in decisions, because they believe people are self-directed and creative","Closely supervise because people avoid work","Rely mainly on coercive power","Avoid any participation of employees"],"Theory Y: involvement-oriented leadership.");

/* ---- c3b Traits & behaviours ---- */
S_("c3b",1,"The trait approach to leadership asks:",["Which personal characteristics make someone a (successful) leader?","What do leaders do?","Which situation calls for which style?","How do followers judge fairness?"],"Traits: who is a leader. Behavioural: what leaders do.");
S_("c3b",1,"Task-oriented leader behaviours involve:",["Structuring subordinates' roles, giving instructions and pushing group performance","Showing concern for employees' feelings","Leaving decisions entirely to the team","Serving employees' personal needs first"],"Task-oriented = initiating structure.");
S_("c3b",1,"People-oriented leader behaviours involve:",["Showing concern for employee feelings and treating employees with respect","Setting deadlines and assigning tasks","Deciding alone","Punishing poor performance"],"People-oriented = consideration.");
S_("c3b",1,"Laissez-faire decision-making means:",["Employees decide with minimal guidance and involvement from the leader","The leader decides alone","Employees participate but the leader decides","The leader votes with the team"],"Laissez-faire = leave it to them.");
S_("c3b",1,"Which Big Five trait has the strongest relationship with leader emergence and effectiveness?",["Extraversion","Agreeableness","Neuroticism","Openness"],"Extraversion has the strongest link.");
S_("c3b",2,"A manager sets clear weekly targets, assigns each person's tasks and checks progress every Friday. Which behaviour?",["Task-oriented","People-oriented","Laissez-faire","Servant"],"Structuring roles and checking performance = task-oriented.");
S_("c3b",2,"A supervisor regularly asks how her staff are doing, listens to personal worries and treats everyone with respect. Which behaviour?",["People-oriented","Task-oriented","Authoritarian","Transactional"],"Concern for feelings = people-oriented.");
S_("c3b",2,"The head chef decides the new menu alone and announces it to the kitchen. Which decision-making style?",["Authoritarian","Democratic","Laissez-faire","Participative"],"Deciding alone without involving employees = authoritarian.");
S_("c3b",2,"A team leader holds a vote with the team on which supplier to choose and follows the outcome. Which style?",["Democratic","Authoritarian","Laissez-faire","Task-oriented"],"Employees participate in the decision = democratic.");
S_("c3b",2,"A manager tells the team 'decide among yourselves how to run the project' and gives no further input. Which style?",["Laissez-faire","Democratic","Authoritarian","People-oriented"],"Minimal guidance = laissez-faire.");
S_("c3b",3,"Which statement about the behavioural approach is correct?",["People-oriented behaviour tends to raise satisfaction, task-oriented behaviour slightly raises productivity, and neither works in every situation","Task-oriented behaviour always leads to the highest satisfaction","Showing both behaviours guarantees effective leadership","Laissez-faire has the best track record of the three decision styles"],"Both help for different purposes; the approach ignored context; laissez-faire has the worst record.");
S_("c3b",3,"According to Kirkpatrick and Locke, which set lists core leadership traits?",["Drive, leadership motivation, honesty and integrity, self-confidence, cognitive ability, knowledge of the business","Height, age, wealth, gender","Agreeableness, modesty, conflict avoidance","Charm, luck, family background"],"Locke's core traits give leadership potential.");
S_("c3b",3,"What was the main limitation of both the trait and the behavioural approaches?",["They ignored the situation (context) in which leaders operate","They focused too much on followers","They were based only on women leaders","They only studied military leaders"],"Neither specified the conditions under which traits or behaviours work.");
S_("c3b",3,"Goleman argues about intelligence and leadership that:",["IQ is a threshold to enter management, but emotional intelligence separates effective leaders from ineffective ones","IQ is the only trait that matters","Emotional intelligence is irrelevant for leaders","High IQ guarantees leadership success"],"IQ is a threshold; EQ differentiates.");

/* ---- c4a Contemporary approaches ---- */
S_("c4a",1,"Transformational leaders:",["Align employee goals with the leader's and company's goals, so employees focus on the company's well-being","Give rewards in exchange for the right behaviour","Wait until something goes wrong before acting","Leave employees to decide everything"],"Transformational = alignment, inspiration. Exchange = transactional.");
S_("c4a",1,"Which are the four tools of transformational leaders?",["Charisma, inspirational motivation, intellectual stimulation, individualized consideration","Contingent rewards, active and passive management by exception, punishment","Planning, organizing, leading, controlling","Reward, coercive, expert and referent power"],"The four I's (charisma = idealized influence).");
S_("c4a",1,"The key advice of authentic leadership is:",["Be yourself","Serve others first","Reward good behaviour","Challenge the status quo"],"Authentic = self-aware and true to your values.");
S_("c4a",1,"Servant leadership defines the leader's role as:",["Serving the needs of others and helping employees develop and reach their goals","Controlling performance closely","Inspiring with a magnetic personality","Exchanging rewards for results"],"Servant leaders put employees first.");
S_("c4a",1,"Passive management by exception means the leader:",["Leaves employees alone and waits until something goes wrong before stepping in","Rewards employees for accomplishments","Predicts problems and prevents them","Shows personal concern for each follower"],"Passive MBE is the only transactional method that isn't effective.");
S_("c4a",2,"A leader asks employees to challenge established assumptions and develop original solutions instead of following procedures. Which kind of leadership?",["Transformational leadership","Transactional leadership","Ethical leadership","Leadership by walking around"],"Intellectual stimulation is a transformational tool.");
S_("c4a",2,"A sales director pays a bonus to every rep who exceeds the quarterly target. Which approach?",["Transactional (contingent rewards)","Transformational (inspirational motivation)","Servant leadership","Authentic leadership"],"Rewards for accomplishments = contingent rewards, transactional.");
S_("c4a",2,"A manager leaves her team to work but keeps scanning for risks and steps in before small issues become problems. This is:",["Active management by exception","Passive management by exception","Laissez-faire","Individualized consideration"],"Proactively preventing problems = active MBE.");
S_("c4a",2,"A CEO who grew up watching his father struggle without health insurance gives every part-time worker full benefits, true to that experience. Which approach?",["Authentic leadership","Transactional leadership","Passive management by exception","Theory X"],"Howard Schultz: leading from your own life experience and values.");
S_("c4a",2,"A hospital manager spends hours coaching each nurse on their career goals and sometimes sacrifices her own time to help them succeed. Which approach?",["Servant leadership","Transactional leadership","Authoritarian leadership","Active management by exception"],"Putting employees' development first = servant.");
S_("c4a",2,"A manager has a close, trust-based relationship with three team members who go beyond their job descriptions, and a purely formal one with the others. Which theory explains this?",["Leader-member exchange (LMX)","Herzberg's two-factor theory","Theory X and Theory Y","The trait approach"],"High- and low-quality LMX relationships (in-group vs out-group).");
S_("c4a",3,"Why is transformational leadership often more effective than transactional leadership?",["Followers trust transformational leaders more, because they show care and appeal to values","Transformational leaders use more punishment","Transactional leadership never works","Transformational leaders don't set goals"],"Trust is the key factor; transactional (except passive MBE) also works.");
S_("c4a",3,"Which statement about charisma is correct?",["Charisma can be trained, is not required for effectiveness, and has a dark side","Charisma is purely genetic","Charismatic CEOs always improve future company performance","Charisma is the same as transactional leadership"],"Book: trainable, not necessary, and harmful leaders can be charismatic too.");
S_("c4a",3,"A leader combines a bonus system for targets with an inspiring vision and personal coaching. The book's advice on this mix is:",["Good: leaders should show both transformational and transactional behaviour, avoiding passive management by exception","Bad: the two styles cancel each other out","Only acceptable in the public sector","Bad: transactional behaviour always harms trust"],"Maximize effectiveness by using both.");

/* ---- c4b Values-based & ethics, trends, inclusion ---- */
S_("c4b",1,"Which three values-based leadership styles did Copeland find most effective?",["Authentic, ethical and transformational","Transactional, autocratic and servant","Charismatic, laissez-faire and democratic","Task-oriented, people-oriented and participative"],"Copeland (2016): authentic, ethical, transformational.");
S_("c4b",1,"Ethical leadership is defined as:",["Demonstrating normatively appropriate conduct and promoting it to followers through two-way communication, reinforcement and decision making","Maximizing shareholder value within the law","Being yourself regardless of the context","Rewarding people for hitting targets"],"Brown et al. (2005).");
S_("c4b",1,"Which trends are among the book's top five CHALLENGE trends?",["Increasing concern for the environment and increasing competition for talent","Becoming more connected and becoming more mobile","Rise of the creative class and increasing collaboration","Becoming more global and more connected"],"Challenges: environment, personalization, pace of innovation, complexity, competition for talent.");
S_("c4b",1,"Which is one of Dillon and Bourke's six characteristics of inclusive leaders?",["Cognizance of bias","Coercive power","Contingent rewards","Conformity"],"The six Cs: commitment, courage, cognizance of bias, curiosity, cultural intelligence, collaborative.");
S_("c4b",1,"In the SCQA framework for ethical decisions, SCQA stands for:",["Situation, Complication, Question, Answer","Strategy, Culture, Quality, Action","Stakeholders, Costs, Quality, Alternatives","Scan, Check, Question, Act"],"Situation, complication, question, answer.");
S_("c4b",1,"Ethnocentrism is:",["The belief that your own culture's language and norms are superior to all others","Respect for all cultures","A type of matrix structure","A GLOBE dimension"],"Book key term.");
S_("c4b",2,"A multinational can legally use a low-cost production process in one country, but it seriously harms local communities. What makes this an ethical dilemma?",["The decision involves competing economic and stakeholder responsibilities","The local culture automatically determines the right decision","The company lacks authority to choose a production method","It can be solved simply by choosing the cheapest option"],"Ethical dilemma = legitimate interests clash.");
S_("c4b",2,"A CEO openly admits in a town hall that she doesn't have all the answers and shares her own mistakes. This shows:",["Vulnerability","Coercive power","Passive management by exception","Ethnocentrism"],"Taking emotional risks by sharing weaknesses = vulnerability.");
S_("c4b",2,"An inclusive leader introduces anonymous CV screening because she knows personal and organizational biases affect hiring. Which C is this?",["Cognizance of bias","Curiosity","Courage","Collaborative"],"Awareness of bias + structures to prevent it.");
S_("c4b",2,"A leader learns about her team members' cultural norms and adjusts her style to them. Which inclusive-leadership characteristic?",["Cultural intelligence","Commitment","Cognizance of bias","Courage"],"Understanding other cultures and adapting = cultural intelligence.");
S_("c4b",2,"Before deciding whether to close a factory, a manager first lists all stakeholders and considers the situation from each one's point of view. Which part of the ethical decision process is this?",["Identifying the stakeholders (complication)","Monitoring outcomes (answer)","Making the decision (answer)","Assessing your own feelings (question)"],"Step two: identify stakeholders and see it from their view.");
S_("c4b",3,"A company leads a movement for plastic-free oceans. Its leaders rely mostly on charisma instead of formal authority. This illustrates:",["A corporation as a social movement","Transactional leadership","A mechanistic structure","Passive management by exception"],"Social movements depend on charisma rather than authority.");
S_("c4b",3,"Which pair correctly classifies two of the book's global trends?",["Faster pace of innovation: challenge · Rise of the creative class: solution","Increasing collaboration: challenge · Increasing complexity: solution","Becoming more mobile: challenge · Greater personalization: solution","Increasing competition for talent: solution · Becoming more global: challenge"],"Check both halves: innovation pace is a challenge, the creative class a solution.");
S_("c4b",3,"Which description fits transformational leadership in Copeland's values-based view (Bass & Riggio)?",["Motivating others through a common mission or challenge that empowers followers to develop as leaders","Being aware of one's thoughts and behaviour within the context","Demonstrating appropriate conduct through two-way communication","Rewarding employees for meeting targets"],"The others are authentic, ethical and transactional.");

/* ---- c5a Communication ---- */
S_("c5a",1,"Which are the components of the communication process?",["Sender, message, channel, receiver, noise (and feedback)","Planning, organizing, leading, controlling","Strategy, structure, systems, staff","Input, output, referent"],"Sender encodes → message → channel → receiver decodes; noise distorts.");
S_("c5a",1,"Which are the three main functions of communication in an organization?",["Transmitting information, coordinating effort, sharing emotions and feelings","Hiring, firing, promoting","Planning, budgeting, reporting","Selling, buying, negotiating"],"Book: three functions.");
S_("c5a",1,"Noise in the communication process is:",["Anything that interferes with or distorts the message","Only loud sounds in the office","The feedback from the receiver","The channel used"],"Noise can be in the environment, the receiver or the sender.");
S_("c5a",1,"Information overload is:",["Receiving more information than you can take in","Deliberately withholding information","Using words that mean different things to different people","Gossip on the grapevine"],"Too much information.");
S_("c5a",1,"About what share of in-person communication comes from nonverbal cues, according to the slides?",["55%","7%","25%","90%"],"55% nonverbal; only 7% from the words themselves.");
S_("c5a",2,"Before presenting a proposal, a manager turns his ideas into words, diagrams and tables. Which part of the communication process is this?",["Encoding","Decoding","Feedback","Filtering"],"The sender translates ideas into symbols = encoding.");
S_("c5a",2,"Two employees hear the same announcement. One sees an opportunity, the other a threat because of previous experiences. Which barrier explains the difference?",["Selective perception","Information overload","Filtering","Semantics"],"Interpreting to fit your own beliefs and experiences = selective perception.");
S_("c5a",2,"Which of these is a nonverbal communication cue?",["Facial expressions","A text message","A phone call","A memo"],"Text and memo are written; a phone call is verbal.");
S_("c5a",2,"A department head tells her boss only the good news about a project so he won't get upset. Which barrier?",["Filtering","Selective perception","Information overload","Emotional disconnect"],"Distorting or withholding to manage a reaction = filtering.");
S_("c5a",2,"A furious customer service agent ignores most of what her manager says during feedback. Which barrier?",["Emotional disconnect","Semantics","Information overload","Lack of source familiarity"],"An upset receiver distorts or ignores the message.");
S_("c5a",2,"A manager must tell an employee he didn't get the promotion. Which channel is most appropriate?",["A face-to-face conversation","A formal written memo","A spreadsheet","A group e-mail"],"Emotional messages need rich, verbal channels.");
S_("c5a",2,"A customer service representative sends a suggestion directly to the head of the manufacturing department. Which direction of communication?",["Diagonal","Downward","Horizontal between peers","Upward to own manager"],"Across levels AND departments = diagonal.");
S_("c5a",3,"Which channel has the LOWEST information richness?",["A spreadsheet with the division's budget","A video call","A face-to-face meeting","A phone call"],"Formal documents and spreadsheets are the leanest.");
S_("c5a",3,"A young employee uses slang that his older colleagues interpret differently. Which pair describes the barrier and the stage where it hits?",["Differences in meaning (semantics), at the receiver's decoding","Filtering, at the sender's encoding","Information overload, in the channel","Selective perception, in the feedback"],"Different meanings for words → wrong decoding by the receiver.");
S_("c5a",3,"According to the book, when should you choose written over verbal communication?",["When you mainly want to convey facts; verbal is better for feelings","When the message is emotional","When you want maximum nonverbal information","Never: verbal is always better"],"Facts → written; feelings → verbal.");

/* ---- c5b Decision making ---- */
S_("c5b",1,"Decision making refers to:",["Making choices among alternative courses of action, which may include inaction","Following a manager's order","Collecting information without choosing","Only long-term strategic planning"],"Book definition.");
S_("c5b",1,"Programmed decisions are:",["Decisions that occur often enough that we develop an automated response","Unique and important decisions needing careful analysis","Decisions made only by computers","Long-term strategic decisions"],"Recurring + decision rule = programmed.");
S_("c5b",1,"To satisfice means to:",["Accept the first alternative that meets your minimum criteria","Search all alternatives to find the best one","Decide by gut feeling","Let the group vote"],"Part of bounded rationality.");
S_("c5b",1,"Groupthink is:",["The tendency to avoid critically evaluating ideas the group favours","Some members putting in less effort in a group","Generating as many ideas as possible","Voting by majority"],"Groupthink ≠ social loafing.");
S_("c5b",1,"In the creative decision-making model, which step follows immersion?",["Incubation","Illumination","Verification and application","Problem identification"],"Problem identification → immersion → incubation → illumination → verification.");
S_("c5b",1,"Decisions that employees make every day to run the organization are:",["Operational decisions","Strategic decisions","Tactical decisions","Nonprogrammed decisions"],"Strategic sets the course, tactical = how, operational = daily.");
S_("c5b",2,"A restaurant automatically reorders a standard quantity of ingredients whenever inventory reaches a set level. What type of decision is this?",["Programmed decision","Nonprogrammed decision","Creative decision","Strategic decision"],"Recurring with an automated rule = programmed.");
S_("c5b",2,"During a management meeting, members with doubts stay silent because they want to keep agreement with the majority. Which problem?",["Groupthink","Social loafing","Escalation of commitment","Anchoring"],"Silence to preserve agreement = groupthink.");
S_("c5b",2,"A company keeps investing in a failing IT project because it has already spent €2 million on it. This is:",["Escalation of commitment","Hindsight bias","Framing bias","Satisficing"],"Continuing a failing course because of past investment.");
S_("c5b",2,"An experienced ER doctor decides in seconds which patient to treat first, based on pattern recognition. Which model?",["Intuitive","Rational","Bounded rationality","Creative"],"Gut feeling and experience under time pressure = intuitive.");
S_("c5b",2,"A team first writes ideas down individually and silently, then shares them, discusses them and votes. Which technique?",["Nominal Group Technique","Delphi Technique","Brainstorming","Majority rule"],"NGT: write alone → share → discuss → vote.");
S_("c5b",2,"Experts in different countries answer a series of written questionnaires until they reach consensus, without ever meeting. Which technique?",["Delphi Technique","Nominal Group Technique","Brainstorming","GDSS"],"Delphi = written rounds, no meeting.");
S_("c5b",2,"A buyer judges every supplier's offer against the first price she heard, even though it was unusually high. Which bias?",["Anchoring","Overconfidence","Hindsight","Escalation of commitment"],"Relying too heavily on one piece of information.");
S_("c5b",3,"When should you use the rational decision-making model?",["When information can be quantified, the decision is important and you want to maximize the outcome","When there is extreme time pressure and goals are unclear","When minimum criteria are clear and you have little time","When no solution exists yet and new ideas are needed"],"Others describe intuitive, bounded rationality and creative.");
S_("c5b",3,"Which pair correctly matches a group problem with its description?",["Social loafing: some members put in less effort · Groupthink: avoiding critical evaluation of favoured ideas","Social loafing: avoiding critical evaluation · Groupthink: putting in less effort","Social loafing: too many ideas · Groupthink: too few ideas","Social loafing: a decision rule · Groupthink: a creative technique"],"Check both halves.");
S_("c5b",3,"Which is a real advantage of group decision making over individual decision making?",["Implementation is easier because members are invested in the decision","Groups are always faster","Groups always outperform their best member","Groups never suffer from process losses"],"Groups are slower, rarely beat their best member and do suffer process losses.");
S_("c5b",3,"A manager reasons after a failed launch: 'It was obvious this would fail.' Which bias?",["Hindsight bias","Anchoring","Framing bias","Overconfidence bias"],"Mistakes seem obvious only afterwards.");
/* ---- c6a Mission, vision, stakeholders, process ---- */
S_("c6a",1,"A mission statement communicates:",["The organization's reason for being and how it serves its key stakeholders","What the organization wants to become in the future","The organization's core beliefs and principles","The budget for the next three years"],"Mission = why we exist now. The future one is vision; beliefs are values.");
S_("c6a",1,"A vision statement is:",["A future-oriented declaration of the organization's purpose and aspirations","A list of the company's products","The reason for being and how stakeholders are served","An analysis of strengths and weaknesses"],"Vision = what we want to become.");
S_("c6a",1,"Stakeholders are best defined as:",["Individuals or groups with an interest in the organization's ability to deliver its intended results","Only the shareholders who own the company","The top management team","Competitors in the same industry"],"Customers, employees, investors, suppliers, government, communities.");
S_("c6a",1,"What is the correct order of the strategic management process?",["Objectives & analysis → formulation → implementation → evaluation & control","Implementation → formulation → analysis → control","Formulation → analysis → control → implementation","Control → analysis → implementation → formulation"],"Analyse, decide, do, check.");
S_("c6a",1,"Stakeholder analysis refers to:",["Techniques to identify and understand the needs and expectations of major interests inside and outside the organization","Measuring the share price","Ranking employees by performance","Calculating market share"],"Book definition.");
S_("c6a",2,"“To be Europe's leading zero-waste packaging company by 2035.” This is a:",["Vision statement","Mission statement","Values statement","Functional strategy"],"Future aspiration = vision.");
S_("c6a",2,"“We make short city trips clean and affordable for residents.” This is a:",["Mission statement","Vision statement","Values statement","SWOT analysis"],"Current purpose and who it serves = mission.");
S_("c6a",2,"“Integrity, curiosity and respect guide everything we do.” This is a:",["Values statement","Vision statement","Mission statement","KPI"],"Core beliefs = values.");
S_("c6a",2,"The new plan is approved. Managers now train staff and allocate budgets to departments to carry it out. Which step?",["Strategy implementation","Strategy formulation","Strategic objectives & analysis","Evaluation & control"],"Training and allocating resources = implementation (doing).");
S_("c6a",2,"Six months after launch, management compares the results with the targets and adjusts the plan. Which step?",["Evaluation & control","Formulation","Implementation","Objectives & analysis"],"Checking and correcting.");
S_("c6a",3,"Which statement about mission and vision is correct?",["The mission lays out the purpose for being; the vision says what the organization wants to become based on that purpose","The vision describes the present; the mission the future","They are the same thing","Only for-profit companies need them"],"Mission = purpose now; vision builds on it toward the future.");
S_("c6a",3,"Why is the strategic management process described as formulation AND implementation?",["Because deciding what to do (formulation) is useless without putting it into action (implementation)","Because formulation and implementation are the same activity","Because implementation always comes first","Because only top managers implement"],"Carpenter & Sanders: managing both.");
S_("c6a",3,"A municipal service hears from residents, its staff, the national government and local businesses before redesigning its permit process. Which tool is it applying?",["Stakeholder analysis","BCG matrix","Value chain","VRIO"],"Identifying and understanding the needs of interest groups.");

/* ---- c6b Levels & competing ---- */
S_("c6b",1,"Corporate strategy answers which question?",["Which business(es) should we be in?","How do we compete in this market?","How does marketing support the plan?","What is our daily schedule?"],"Corporate = which businesses.");
S_("c6b",1,"Business strategy answers which question?",["How do we compete effectively in this market?","Which businesses should we own?","How does HR recruit?","What are our values?"],"Business = how to compete.");
