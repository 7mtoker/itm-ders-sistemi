ase most clearly represents Kotter’s guiding coalition?", "o": ["The measured reduction in processing time produced by the pilot in one district; this interpretation identifies the group responsible for coordinating influence, expertise, and support during change.", "The online portal used by residents to submit documents and monitor permit progress; this interpretation identifies the group responsible for coordinating influence, expertise, and support during change.", "The group of employees, specialists, residents, and IT staff are owners of the change; this interpretation identifies the group responsible for coordinating influence, expertise, and support during change", "The waiting-time information and citizen complaints presented by the department head; this interpretation identifies the group responsible for coordinating influence, expertise, and support during change.", "The national accessibility standards that will become mandatory for municipal digital services; this interpretation identifies the group responsible for coordinating influence, expertise, and support during change.", "The vision describing accessible permit services with continuing human support when required; this interpretation identifies the group responsible for coordinating influence, expertise, and support during change."], "a": 2, "x": "The mixed group of employees, specialists, residents and IT staff that owns and steers the change = the guiding coalition.", "skip": 0}, {"n": 36, "sec": "Long case · GreenCity Permits (Ch 11)", "cs": 4, "q": "Which case result should be classified as a short-term win supporting the change?", "o": ["The guiding group's inclusion of residents, specialists, employees, and information-technology staff; this classification connects visible early progress with stronger credibility and continued support for implementation.", "Employees' concern that their administrative experience may become less valuable after digitization; this classification connects visible early progress with stronger credibility and continued support for implementation.", "The pilot's measurable 30 percent reduction in processing time within one district; this classification connects visible early progress with stronger credibility and continued support for implementation.", "The future legal requirement to meet national standards for accessible digital public services; this classification connects visible early progress with stronger credibility and continued support for implementation.", "The long-term vision of accessible permits with continuing human assistance when residents need it; this classification connects visible early progress with stronger credibility and continued support for implementation.", "The department's history of using paper files and offering appointments at municipal offices; this classification connects visible early progress with stronger credibility and continued support for implementation."], "a": 2, "x": "A measurable, visible early result (30% faster in one district) = a short-term win.", "skip": 0}]}, {"name": "Mock set 4", "qs": [{"n": 1, "sec": "Multiple choice", "cs": -1, "q": "Which function of management focuses on defining goals and determining how to achieve them?", "o": ["Organizing", "Planning", "Leading", "Controlling"], "a": 1, "x": "Planning = setting goals and deciding how to reach them.", "skip": 0}, {"n": 2, "sec": "Multiple choice", "cs": -1, "q": "Which contemporary trends are most shaping management nowadays?", "o": ["Elimination of technology", "Decline of globalization", "Decrease in innovation", "Focus on diversity and sustainability"], "a": 3, "x": "The course names diversity (DEI) and sustainability as the trends shaping management today.", "skip": 0}, {"n": 3, "sec": "Multiple choice", "cs": -1, "q": "A manager redesigns the department by grouping related tasks and assigning responsibility for each group to a team leader. Which management function does this best illustrate?", "o": ["Forecasting", "Leading", "Controlling", "Organizing"], "a": 3, "x": "Grouping tasks and assigning responsibility = designing structure, so organizing.", "skip": 0}, {"n": 4, "sec": "Multiple choice", "cs": -1, "q": "Which statement best reflects the view that management is “the art of getting things done through the efforts of other people”?", "o": ["Managers achieve objectives by coordinating and supporting the work of others.", "Managers contribute mainly by creating formal rules and procedures.", "Managers should personally complete the organization's most important tasks.", "Managers are responsible only for measuring employee performance."], "a": 0, "x": "Management = reaching goals through other people, so coordinating and supporting their work.", "skip": 0}, {"n": 5, "sec": "Multiple choice", "cs": -1, "q": "What are the three critical skills identified by Robert Katz for successful leaders?", "o": ["Management, Communication, and Organizational skills", "Technical, Interpersonal, and Conceptual skills", "Strategic, Tactical, and Operational skills", "Analytical, Emotional, and Practical skills"], "a": 1, "x": "Katz: technical, interpersonal (human) and conceptual skills.", "skip": 0}, {"n": 6, "sec": "Multiple choice", "cs": -1, "q": "An employee who has positive feelings towards their job, is exhibiting:", "o": ["Introversion", "Conscientiousness", "Agreeableness", "Job satisfaction"], "a": 3, "x": "Positive feelings toward your job = job satisfaction (a work attitude).", "skip": 0}, {"n": 7, "sec": "Multiple choice", "cs": -1, "q": "Which is a key job attitude at work?", "o": ["Personality", "Job satisfaction", "Charisma", "Job characteristics"], "a": 1, "x": "The two key work attitudes are job satisfaction and organizational commitment. Personality and charisma are traits; job characteristics are causes of attitudes.", "skip": 0}, {"n": 8, "sec": "Multiple choice", "cs": -1, "q": "What does an attitude refer to?", "o": ["A learned ability to perform a task", "Our pay and benefits", "Our opinions, beliefs, and feelings about our environment", "A plan we make"], "a": 2, "x": "An attitude = our opinions, beliefs and feelings about aspects of our environment.", "skip": 0}, {"n": 9, "sec": "Multiple choice", "cs": -1, "q": "What is organizational commitment?", "o": ["Our pay level", "A job task list", "Emotional attachment to the company", "Compliance with organizational rules and policies"], "a": 2, "x": "Organizational commitment = the emotional attachment people have to the company they work for.", "skip": 0}, {"n": 10, "sec": "Multiple choice", "cs": -1, "q": "Which decision type sets the organization’s course?", "o": ["Strategic", "Tactical", "Programmed", "Operational"], "a": 0, "x": "Strategic decisions set the organization's long-term course; tactical and operational decisions implement it.", "skip": 0}, {"n": 11, "sec": "Multiple choice", "cs": -1, "q": "A restaurant automatically reorders a standard quantity of ingredients whenever inventory reaches a predetermined level. What type of decision is this?", "o": ["Creative decision", "Programmed decision", "Nonprogrammed decision", "Strategic decision"], "a": 1, "x": "A routine, recurring decision handled by a fixed rule = programmed decision.", "skip": 0}, {"n": 12, "sec": "Multiple choice", "cs": -1, "q": "Which is a barrier to effective communication?", "o": ["Lack of attention", "Information overload", "Noise in the environment", "Receiver"], "a": 1, "x": "Information overload is a communication barrier. Noise and the receiver are components of the process model.", "skip": 0}, {"n": 13, "sec": "Multiple choice", "cs": -1, "q": "Which decision-making model aims for a “satisfactory” outcome?", "o": ["Rational", "Creative", "Intuitive", "Bounded rationality"], "a": 3, "x": "Bounded rationality leads to satisficing: choosing the first alternative that meets your minimum criteria.", "skip": 0}, {"n": 14, "sec": "Multiple choice", "cs": -1, "q": "Which is a nonverbal communication cue?", "o": ["Text", "Phone call", "Memo", "Facial expressions"], "a": 3, "x": "Facial expressions are nonverbal. Memos, texts and phone calls use words (verbal or written).", "skip": 0}, {"n": 15, "sec": "Multiple choice", "cs": -1, "q": "During a management meeting, members with doubts remain silent because they want to preserve agreement with the dominant majority. Which problem is the group experiencing?", "o": ["Groupthink", "Social facilitation", "Brainstorming", "Cognitive diversity"], "a": 0, "x": "Staying silent to keep group harmony = groupthink.", "skip": 0}, {"n": 16, "sec": "Multiple choice", "cs": -1, "q": "Two employees heard the same announcement. One interprets it as an opportunity, while the other interprets it as a threat because of previous experiences. Which communication barrier best explains the difference?", "o": ["Upward communication", "Formalization", "Channel expansion", "Selective perception"], "a": 3, "x": "Interpreting the same message differently because of your own experiences and expectations = selective perception.", "skip": 0}, {"n": 17, "sec": "Multiple choice", "cs": -1, "q": "What is a goal?", "o": ["A time-based measurable action", "An outcome statement of what to accomplish", "A company's mission statement", "A detailed strategy plan"], "a": 1, "x": "A goal is an outcome statement of what you want to accomplish. An objective is the precise, time-based, measurable action.", "skip": 0}, {"n": 18, "sec": "Multiple choice", "cs": -1, "q": "Which goal best satisfies the SMART criteria?", "o": ["Become the industry's most respected company.", "Reduce average customer waiting time from eight to five minutes by 30 June.", "Improve customer service significantly.", "Encourage employees to respond to customers more quickly."], "a": 1, "x": "Only this goal is specific, measurable (8 → 5 minutes) and time-bound (by 30 June).", "skip": 0}, {"n": 19, "sec": "Multiple choice", "cs": -1, "q": "What is an objective?", "o": ["A long-term goal that defines direction of the organization", "A general outcome statement", "A broad vision of success", "A precise, time-based, measurable action"], "a": 3, "x": "An objective is precise, time-based and measurable. The broad outcome statement is a goal.", "skip": 0}, {"n": 20, "sec": "Multiple choice", "cs": -1, "q": "What does Management by Objectives (MBO) aim to do?", "o": ["Align subordinate objectives with overall goals", "Translate mission into measures", "Define the company mission and vision", "Report on social and environmental results"], "a": 0, "x": "MBO (Drucker) aligns employees' objectives with the organization's overall goals.", "skip": 0}, {"n": 21, "sec": "Multiple choice", "cs": -1, "q": "What is a goal?", "o": ["An outcome statement of what to accomplish", "A time-based measurable action", "A detailed strategy plan", "A company's mission statement"], "a": 0, "x": "A goal is an outcome statement of what you want to accomplish. An objective is the precise, time-based, measurable action.", "skip": 0}, {"n": 22, "sec": "Multiple choice", "cs": -1, "q": "According to Herzberg’s two-factor theory, which action is most likely to increase motivation by providing a motivator rather than merely improving a hygiene factor?", "o": ["Improving the office temperature", "Clarifying the company's administrative policies", "Giving employees meaningful responsibility for complete projects", "Increasing job security"], "a": 2, "x": "Meaningful responsibility is a motivator. Policies, office temperature and job security are hygiene factors.", "skip": 0}, {"n": 23, "sec": "Multiple choice", "cs": -1, "q": "In a strongly collectivist culture, which managerial practice is most likely to be effective?", "o": ["Assigning work without considering group membership", "Emphasizing only individual competition and personal recognition", "Connecting rewards and goals to the performance of the group", "Avoiding long-term relationships among team members"], "a": 2, "x": "Collectivist cultures put the group first, so tie rewards and goals to group performance.", "skip": 0}, {"n": 24, "sec": "Multiple choice", "cs": -1, "q": "What is “power distance” in Hofstede’s model?", "o": ["Acceptance of power and authority differences", "Focus on risk and uncertainty", "Value of work and earnings", "Preference for collective interests over individual ones"], "a": 0, "x": "Power distance = how much people accept unequal distribution of power and authority.", "skip": 0}, {"n": 25, "sec": "Multiple choice", "cs": -1, "q": "A culture emphasizes persistence, future rewards, and future investment rather than immediate results. Which Hofstede dimension does this describe?", "o": ["Masculinity", "Power distance", "Long-term orientation", "Individualism"], "a": 2, "x": "Persistence and future rewards over immediate results = long-term orientation.", "skip": 0}, {"n": 26, "sec": "Multiple choice", "cs": -1, "q": "A national culture strongly values cooperation, quality of life, and concern for others rather than competition and visible achievement. In Hofstede’s framework, this culture is relatively:", "o": ["Masculine", "Feminine", "High in power distance", "High in uncertainty avoidance"], "a": 1, "x": "Valuing cooperation and quality of life over competition and achievement = a feminine culture (low masculinity).", "skip": 0}, {"n": 27, "sec": "Mini cases", "cs": -1, "q": "A financial-services company faces new regulations concerning artificial intelligence and growing customer concern about automated decisions. A manager with extensive AI knowledge explains the technical risks to senior leaders and consults employees who will use the systems before recommending procedural changes. Which pair of leadership concepts is demonstrated by the manager?", "o": ["Expert power and people-oriented leadership based on knowledge and consultation", "Legitimate power and task-oriented leadership based on position and deadlines", "Reward power and laissez-faire leadership based on incentives and employee independence", "Referent power and democratic leadership based on admiration and formal voting"], "a": 0, "x": "Influence from AI knowledge = expert power. Consulting the employees who will use the systems = people-oriented.", "skip": 0}, {"n": 28, "sec": "Mini cases", "cs": -1, "q": "Severe flooding interrupts a company’s main supply route. The logistics director has formal authority to activate an emergency sourcing plan. She also relies on a climate-risk specialist whose knowledge helps the company evaluate more resilient and sustainable suppliers. Which pair correctly identifies the sources of power in the case?", "o": ["Reward power from the director and referent power from the specialist", "Referent power from the director and coercive power from the specialist", "Expert power from the director and legitimate power from the specialist", "Legitimate power from the director and expert power from the specialist"], "a": 3, "x": "Formal authority = legitimate power (director). Specialist knowledge = expert power (specialist).", "skip": 0}, {"n": 29, "sec": "Mini cases", "cs": -1, "q": "A manufacturer is replacing a polluting production process with cleaner technology. The operations director defines conversion targets, assigns responsibilities, and monitors deadlines. She also invites employees from different backgrounds and job levels to discuss how the change may affect them and adapt the training accordingly. Which description best summarizes the director’s leadership behavior?", "o": ["Task-oriented and autocratic leadership emphasizing targets and centralized managerial control", "People-oriented and democratic leadership emphasizing consultation without formal performance targets", "Laissez-faire and people-oriented leadership allowing employees to direct implementation independently", "Task-oriented and people-oriented leadership balancing targets with employee inclusion"], "a": 3, "x": "Targets, responsibilities and deadlines = task-oriented. Inviting employees and adapting training = people-oriented. She does both.", "skip": 0}, {"n": 30, "sec": "Mini cases", "cs": -1, "q": "A cybersecurity specialist influences an executive team because of her knowledge and experience, although she has no formal managerial position. Which source of power explains her influence?", "o": ["Coercive power", "Expert power", "Reward power", "Legitimate power"], "a": 1, "x": "Influence from knowledge and experience without a formal position = expert power.", "skip": 0}, {"n": 31, "sec": "Mini cases", "cs": -1, "q": "A nonprofit director learns that employees performing comparable work are paid differently across gender and ethnic groups. She openly acknowledges the problem, publishes the review method, corrects the pay gaps, and asks employees what support they need for future development. She accepts personal responsibility for maintaining fair practices. Which description best explains the director’s leadership styles?", "o": ["Charismatic and transformational leadership connecting personal influence with an inspiring vision", "Authentic and servant leadership combining transparency for employees", "Values-based and autocratic leadership combining organizational principles with centralized decisions", "Transactional and ethical leadership linking fair treatment mainly to performance rewards"], "a": 1, "x": "Openly acknowledging the problem and taking responsibility = authentic. Asking what employees need to develop = servant leadership.", "skip": 0}, {"n": 32, "sec": "Mini cases", "cs": -1, "q": "New international regulations require companies to explain automated hiring decisions. Public concern about discrimination is also increasing. A technology leader commissions independent bias audits, publishes the results, and sets a strategic goal to develop transparent and inclusive AI products. Which interpretation best explains the company’s leadership response?", "o": ["Servant leadership develops employees while leaving the automated system strategically unchanged", "Authentic and charismatic leadership emphasizes personal identity and persuasive public communication", "Ethical and transformational leadership connects transparency with inclusive strategic innovation", "Transactional leadership maintains existing products through rewards linked to regulatory compliance"], "a": 2, "x": "Independent audits and publishing results = ethical. A strategic goal for transparent, inclusive innovation = transformational.", "skip": 0}, {"n": 33, "sec": "Mini cases", "cs": -1, "q": "A fashion retailer discovers that a low-cost supplier has unsafe working conditions and causes serious environmental damage. The CEO ends the contract despite the short-term cost. She communicates a vision of a fair, low-carbon supply chain and invites employees to redesign sourcing practices. Which description best explains the CEO’s leadership response?", "o": ["Transactional and servant leadership linking supplier decisions to rewards and employee development", "Authentic and laissez-faire leadership expressing personal values while limiting organizational direction", "Charismatic and transactional leadership using personal influence and performance-based exchanges", "Ethical and transformational leadership protecting stakeholders while communicating a new vision"], "a": 3, "x": "Ending the contract to protect workers and the environment = ethical. A new vision plus involving employees = transformational.", "skip": 0}, {"n": 34, "sec": "Mini cases", "cs": -1, "q": "New equality legislation strengthens protection for gender identity and sexual orientation. At the same time, qualified applicants increasingly expect remote and flexible work. A consulting company revises its inclusion policies, trains managers, and creates virtual teams that recruit talent from a wider geographic area. Which interpretation best explains the company’s organizational response?", "o": ["Economic pressures encourage divisional structures and standardized recruitment across all locations", "Legal and sociocultural pressures encourage inclusive policies and geographically flexible virtual structures", "Technological pressures encourage matrix structures and specialist recruitment within one location", "Internal workforce pressures encourage functional structures and locally restricted recruitment practices"], "a": 1, "x": "New law = legal pressure; applicants expecting remote work = sociocultural. The response: inclusive policies and virtual teams.", "skip": 0}, {"n": 35, "sec": "Mini cases", "cs": -1, "q": "Growing demand for reusable products leads a furniture company to collaborate with repair businesses, recycling firms, and design startups. Teams from these organizations share knowledge and coordinate activities without being placed inside one traditional hierarchy. Which interpretation best describes the company’s strategic response?", "o": ["A geographic structure supports regional independence in response to changing national regulations", "A networked structure supports external collaboration in response to the circular-economy trend", "A divisional structure supports product independence in response to changing customer segments", "A functional structure supports internal specialization in response to changing professional standards"], "a": 1, "x": "Collaborating with outside firms without one hierarchy = network (virtual) structure, responding to the circular-economy trend.", "skip": 0}, {"n": 36, "sec": "Mini cases", "cs": -1, "q": "A company displays diversity statements throughout its offices and lists inclusion as a core value. However, managers repeatedly promote employees who share the same background and dismiss reports of biased behavior. Employees conclude that the organization’s actual priorities differ from its public message. Which cultural levels are represented by the statements and promotion patterns?", "o": ["External environmental forces in the statements, with espoused values in repeated decisions", "Underlying assumptions in the statements, with visible artifacts in repeated decisions", "Artifacts and espoused values in the statements, with underlying assumptions in repeated decisions", "Organizational structures in the statements, with external pressures in repeated decisions"], "a": 2, "x": "Displayed statements are artifacts and espoused values. What managers repeatedly do reveals the real underlying assumptions.", "skip": 0}, {"n": 37, "sec": "Mini cases", "cs": -1, "q": "A newly diverse project team initially experiences disagreement about priorities and communication styles. Instead of removing members who disagree, the leader helps the team establish decision rules, clarify roles, and develop norms that ensure every member can contribute. Trust and cohesion begin to increase. Which two team-development stages are represented in sequence?", "o": ["Performing followed by adjourning as initial conflict gives way to role clarification", "Norming followed by performing as shared expectations give way to initial conflict", "Forming followed by storming as members first meet and then avoid disagreement", "Storming followed by norming as disagreement gives way to shared expectations"], "a": 3, "x": "Disagreement about priorities = storming. Agreeing on rules, roles and norms = norming.", "skip": 0}, {"n": 38, "sec": "Mini cases", "cs": -1, "q": "A shift toward hybrid work leads a company to add remote specialists from several countries to an established product team. The team leader notices uncertainty about roles, technology, and meeting expectations. She schedules orientation sessions and helps members rebuild shared working agreements. Which two team-development stages best match the change described?", "o": ["Forming after adding members, followed by norming as shared agreements develop", "Performing after adding members, followed by storming as role expectations become clear", "Norming after adding members, followed by adjourning after agreements are established", "Storming after adding members, followed by performing after the first orientation session"], "a": 0, "x": "New members restart the team at forming (uncertainty about roles); rebuilding shared working agreements = norming.", "skip": 0}, {"n": 39, "sec": "Mini cases", "cs": -1, "q": "A travel company plans sustainable services for a rapidly growing international market. Its project team includes members with different cultural backgrounds and professional expertise. The team also consults local community leaders, environmental experts, and industry partners to understand emerging expectations and opportunities. Which interpretation best explains the factors strengthening the response?", "o": ["Centralized expertise broadens international insight, while closed networking identifies future partnership opportunities", "Cultural similarity broadens sustainability insight, while personal networking identifies future regulatory developments", "Professional similarity broadens customer insight, while operational networking identifies future market developments", "Team diversity broadens market insight, while strategic networking identifies future trends and opportunities"], "a": 3, "x": "Diverse members broaden insight; consulting outside leaders and experts about future trends = strategic networking.", "skip": 0}, {"n": 40, "sec": "Long case · UrbanStay Hotels (Ch 6)", "cs": 5, "q": "How should the regional managers’ successful monthly packages be classified relative to the original discount plan?", "o": ["A functional strategy because the packages concern only maintenance procedures within individual hotel buildings; this classification distinguishes management's original plan from the pattern produced through organizational learning.", "A mission statement because the packages redefine the organization's enduring purpose and stakeholders; this classification distinguishes management's original plan from the pattern produced through organizational learning.", "An intended strategy because the packages were the original approach approved before local testing; this classification distinguishes management's original plan from the pattern produced through organizational learning.", "A realized strategy because local experiments produced a different successful pattern of action; this classification distinguishes management's original plan from the pattern produced through organizational learning.", "A corporate strategy because the packages automatically move UrbanStay into an unrelated industry; this classification distinguishes management's original plan from the pattern produced through organizational learning.", "A stakeholder analysis because the packages classify remote professionals by power and organizational interest; this classification distinguishes management's original plan from the pattern produced through organizational learning"], "a": 3, "x": "The successful pattern that emerged locally and replaced the plan = realized strategy.", "skip": 0}, {"n": 41, "sec": "Long case · UrbanStay Hotels (Ch 6)", "cs": 5, "q": "In a SWOT analysis, growing demand for extended work-from-anywhere stays is classified as what?", "o": ["A weakness because it is an internal limitation reducing the efficiency of hotel operations; this interpretation separates an external growth possibility from internal capabilities and environmental risks.", "An opportunity because it is an external trend that UrbanStay can use for growth; this interpretation separates an external growth possibility from internal capabilities and environmental risks.", "A core competence because it is a coordinated organizational capability that competitors cannot copy; this interpretation separates an external growth possibility from internal capabilities and environmental risks", "A strength because it is an internal capability already controlled and protected by UrbanStay; this interpretation separates an external growth possibility from internal capabilities and environmental risks.", "A value-chain activity because it is a process performed directly within UrbanStay's operations; this interpretation separates an external growth possibility from internal capabilities and environmental risks.", "A threat because it is an external development that necessarily reduces demand for accommodation; this interpretation separates an external growth possibility from internal capabilities and environmental risks."], "a": 1, "x": "An external trend the company can use for growth = opportunity.", "skip": 0}, {"n": 42, "sec": "Long case · UrbanStay Hotels (Ch 6)", "cs": 5, "q": "Which revised vision best describes an aspirational future for UrbanStay?", "o": ["UrbanStay operates hotels in business districts and maintains relationships with corporate travel departments; this wording distinguishes a desired future position from present purpose, activities, and compliance responsibilities.", "UrbanStay aims to become Europe's leading home for flexible and sustainable mobile professionals; this wording distinguishes a desired future position from present purpose, activities, and compliance responsibilities.", "UrbanStay provides dependable rooms and workspaces to current business and leisure travelers; this wording distinguishes a desired future position from present purpose, activities, and compliance responsibilities.", "UrbanStay follows legal standards for safety, employment, data protection, and environmental reporting; this wording distinguishes a desired future position from present purpose, activities, and compliance responsibilities.", "UrbanStay renovates meeting rooms, monitors energy use, and develops monthly accommodation packages; this wording distinguishes a desired future position from present purpose, activities, and compliance responsibilities.", "UrbanStay serves guests who currently require accommodation, workspaces, and local community activities; this wording distinguishes a desired future position from present purpose, activities, and compliance responsibilities."], "a": 1, "x": "A vision is aspirational and about the future: 'aims to become Europe's leading home…'. The others describe present activities or compliance.", "skip": 0}, {"n": 43, "sec": "Long case · CareConnect Hospital (Ch 11)", "cs": 6, "q": "In Schein’s model, the belief that paper records are inherently safer is best classified as what?", "o": ["An espoused strategy because the belief is the hospital's formally published competitive plan; this interpretation locates the belief at the appropriate level of Schein's organizational culture model.", "An underlying assumption because the belief is deeply taken for granted by experienced staff; this interpretation locates the belief at the appropriate level of Schein's organizational culture model", "A visible artifact because the belief is a physical and directly observable feature of the hospital; this interpretation locates the belief at the appropriate level of Schein's organizational culture model.", "A short-term win because the belief provides measurable evidence that the change is succeeding; this interpretation locates the belief at the appropriate level of Schein's organizational culture model.", "A functional structure because the belief determines how specialist departments report to management; this interpretation locates the belief at the appropriate level of Schein's organizational culture model."], "a": 1, "x": "A deeply taken-for-granted belief = underlying assumption, the deepest level of culture.", "skip": 1}, {"n": 44, "sec": "Long case · CareConnect Hospital (Ch 11)", "cs": 6, "q": "Which action most clearly represents Lewin’s refreezing stage?", "o": ["Embedding electronic documentation in job descriptions, audits, and performance reviews; this classification identifies how new behavior becomes stabilized through formal systems, expectations, and routines", "Providing initial training while employees are still learning the unfamiliar electronic procedures; this classification identifies how new behavior becomes stabilized through formal systems, expectations, and routines.", "Explaining why fragmented paper records create safety risks and unnecessary duplicated medical tests; this classification identifies how new behavior becomes stabilized through formal systems, expectations, and routines.", "Comparing software suppliers before management selects the electronic system for the hospital; this classification identifies how new behavior becomes stabilized through formal systems, expectations, and routines.", "Asking employees to discuss concerns before the first electronic-record pilot begins; this classification identifies how new behavior becomes stabilized through formal systems, expectations, and routines.", "Testing the electronic system in one department and revising the workflow during implementation; this classification identifies how new behavior becomes stabilized through formal systems, expectations, and routines."], "a": 0, "x": "Embedding the behaviour in job descriptions, audits and reviews makes it permanent = refreezing.", "skip": 0}, {"n": 45, "sec": "Long case · CareConnect Hospital (Ch 11)", "cs": 6, "q": "How should employees who attend training but secretly continue using paper records be classified?", "o": ["Creative participation because they formally test alternatives and share results with the implementation team; this interpretation distinguishes concealed noncompliance from open opposition, acceptance, and active commitment.", "Active support because they openly encourage colleagues to use the electronic system consistently; this interpretation distinguishes concealed noncompliance from open opposition, acceptance, and active commitment.", "Passive resistance because they appear compliant but privately continue the previous behavior; this interpretation distinguishes concealed noncompliance from open opposition, acceptance, and active commitment", "Enthusiastic adoption because they use the system beyond the minimum expectations of their roles; this interpretation distinguishes concealed noncompliance from open opposition, acceptance, and active commitment.", "Commitment because they personally invest additional effort in making the new workflow successful; this interpretation distinguishes concealed noncompliance from open opposition, acceptance, and active commitment.", "Active resistance because they organize visible protests and publicly reject management's authority; this interpretation distinguishes concealed noncompliance from open opposition, acceptance, and active commitment."], "a": 2, "x": "Looking compliant while quietly keeping the old behaviour = passive resistance.", "skip": 0}]}, {"name": "Mock set 5", "qs": [{"n": 1, "sec": "Multiple choice", "cs": -1, "q": "A manager redesigns the department by grouping related tasks and assigning responsibility for each group to a team leader. Which management function does this best illustrate?", "o": ["Organizing", "Leading", "Forecasting", "Controlling"], "a": 0, "x": "Grouping tasks and assigning responsibility = designing structure, so organizing.", "skip": 0}, {"n": 2, "sec": "Multiple choice", "cs": -1, "q": "What are the three critical skills identified by Robert Katz for successful leaders?", "o": ["Strategic, Tactical, and Operational skills", "Technical, Interpersonal, and Conceptual skills", "Management, Communication, and Organizational skills", "Analytical, Emotional, and Practical skills"], "a": 1, "x": "Katz: technical, interpersonal (human) and conceptual skills.", "skip": 0}, {"n": 3, "sec": "Multiple choice", "cs": -1, "q": "Which statement best reflects the view that management is “the art of getting things done through the efforts of other people”?", "o": ["Managers contribute mainly by creating formal rules and procedures.", "Managers should personally complete the organization's most important tasks.", "Managers achieve objectives by coordinating and supporting the work of others.", "Managers are responsible only for measuring employee performance."], "a": 2, "x": "Management = reaching goals through other people, so coordinating and supporting their work.", "skip": 0}, {"n": 4, "sec": "Multiple choice", "cs": -1, "q": "Which contemporary trends are most shaping management nowadays?", "o": ["Decrease in innovation", "Focus on diversity and sustainability", "Decline of globalization", "Elimination of technology"], "a": 1, "x": "The course names diversity (DEI) and sustainability as the trends shaping management today.", "skip": 0}, {"n": 5, "sec": "Multiple choice", "cs": -1, "q": "According to Mintzberg, which role is part of the interpersonal category?", "o": ["Figurehead", "Monitor", "Disturbance handler", "Spokesperson"], "a": 0, "x": "Interpersonal roles: figurehead, leader, liaison. Monitor and spokesperson are informational; disturbance handler is decisional.", "skip": 0}, {"n": 6, "sec": "Multiple choice", "cs": -1, "q": "What is organizational commitment?", "o": ["A job task list", "Emotional attachment to the company", "Our pay level", "Compliance with organizational rules and policies"], "a": 1, "x": "Organizational commitment = the emotional attachment people have to the company they work for.", "skip": 0}, {"n": 7, "sec": "Multiple choice", "cs": -1, "q": "Which is a key job attitude at work?", "o": ["Personality", "Charisma", "Job characteristics", "Job satisfaction"], "a": 3, "x": "The two key work attitudes are job satisfaction and organizational commitment. Personality and charisma are traits; job characteristics are causes of attitudes.", "skip": 0}, {"n": 8, "sec": "Multiple choice", "cs": -1, "q": "What does an attitude refer to?", "o": ["Our pay and benefits", "Our opinions, beliefs, and feelings about our environment", "A learned ability to perform a task", "A plan we make"], "a": 1, "x": "An attitude = our opinions, beliefs and feelings about aspects of our environment.", "skip": 0}, {"n": 9, "sec": "Multiple choice", "cs": -1, "q": "Which job characteristic links to satisfaction?", "o": ["Personality", "Organizational justice", "Stress", "Autonomy at work"], "a": 3, "x": "Autonomy is a job characteristic (with skill variety, feedback and task significance). Justice and stress are other causes of attitudes, and personality is not a feature of the job.", "skip": 0}, {"n": 10, "sec": "Multiple choice", "cs": -1, "q": "Which decision type sets the organization’s course?", "o": ["Operational", "Strategic", "Programmed", "Tactical"], "a": 1, "x": "Strategic decisions set the organization's long-term course; tactical and operational decisions implement it.", "skip": 0}, {"n": 11, "sec": "Multiple choice", "cs": -1, "q": "Which is a component of the communication process?", "o": ["Filtering", "Message", "Strategic decision", "Creativity"], "a": 1, "x": "The message is part of the process (sender, message, channel, receiver, noise, feedback). Filtering is a barrier.", "skip": 0}, {"n": 12, "sec": "Multiple choice", "cs": -1, "q": "A manager must communicate a sensitive restructuring decision, answer employees’ questions, and observe their reactions immediately. Which communication channel is most appropriate?", "o": ["A face-to-face meeting", "A notice on the staff portal", "A prerecorded audio message", "A standard monthly report"], "a": 0, "x": "A sensitive message where you must answer questions and see reactions needs the richest channel: face to face.", "skip": 0}, {"n": 13, "sec": "Multiple choice", "cs": -1, "q": "Which decision-making model aims for a “satisfactory” outcome?", "o": ["Intuitive", "Rational", "Creative", "Bounded rationality"], "a": 3, "x": "Bounded rationality leads to satisficing: choosing the first alternative that meets your minimum criteria.", "skip": 0}, {"n": 14, "sec": "Multiple choice", "cs": -1, "q": "Which is a nonverbal communication cue?", "o": ["Text", "Phone call", "Facial expressions", "Memo"], "a": 2, "x": "Facial expressions are nonverbal. Memos, texts and phone calls use words (verbal or written).", "skip": 0}, {"n": 15, "sec": "Multiple choice", "cs": -1, "q": "During a management meeting, members with doubts remain silent because they want to preserve agreement with the dominant majority. Which problem is the group experiencing?", "o": ["Social facilitation", "Cognitive diversity", "Brainstorming", "Groupthink"], "a": 3, "x": "Staying silent to keep group harmony = groupthink.", "skip": 0}, {"n": 16, "sec": "Multiple choice", "cs": -1, "q": "Which is a barrier to effective communication?", "o": ["Lack of attention", "Information overload", "Receiver", "Noise in the environment"], "a": 1, "x": "Information overload is a communication barrier. Noise and the receiver are components of the process model.", "skip": 0}, {"n": 17, "sec": "Multiple choice", "cs": -1, "q": "What is an objective?", "o": ["A general outcome statement", "A long-term goal that defines direction of the organization", "A broad vision of success", "A precise, time-based, measurable action"], "a": 3, "x": "An objective is precise, time-based and measurable. The broad outcome statement is a goal.", "skip": 0}, {"n": 18, "sec": "Multiple choice", "cs": -1, "q": "What does the Balanced Scorecard do?", "o": ["Turns mission and strategy into measurable goals and tracks them", "Describes values for employee behavior", "Lists only financial targets for the year", "Sets individual pay levels"], "a": 0, "x": "It translates mission and strategy into measurable goals in four perspectives and tracks them.", "skip": 0}, {"n": 19, "sec": "Multiple choice", "cs": -1, "q": "What is a goal?", "o": ["An outcome statement of what to accomplish", "A time-based measurable action", "A company's mission statement", "A detailed strategy plan"], "a": 0, "x": "A goal is an outcome statement of what you want to accomplish. An objective is the precise, time-based, measurable action.", "skip": 0}, {"n": 20, "sec": "Multiple choice", "cs": -1, "q": "What is a goal?", "o": ["A detailed strategy plan", "A company's mission statement", "A time-based measurable action", "An outcome statement of what to accomplish"], "a": 3, "x": "A goal is an outcome statement of what you want to accomplish. An objective is the precise, time-based, measurable action.", "skip": 0}, {"n": 21, "sec": "Multiple choice", "cs": -1, "q": "According to Herzberg’s two-factor theory, which action is most likely to increase motivation by providing a motivator rather than merely improving a hygiene factor?", "o": ["Clarifying the company's administrative policies", "Increasing job security", "Giving employees meaningful responsibility for complete projects", "Improving the office temperature"], "a": 2, "x": "Meaningful responsibility is a motivator. Policies, office temperature and job security are hygiene factors.", "skip": 0}, {"n": 22, "sec": "Multiple choice", "cs": -1, "q": "Which goal best satisfies the SMART criteria?", "o": ["Improve customer service significantly.", "Become the industry's most respected company.", "Encourage employees to respond to customers more quickly.", "Reduce average customer waiting time from eight to five minutes by 30 June."], "a": 3, "x": "Only this goal is specific, measurable (8 → 5 minutes) and time-bound (by 30 June).", "skip": 0}, {"n": 23, "sec": "Multiple choice", "cs": -1, "q": "A company enters a foreign market by creating a new business that it owns together with a local company. Which global expansion strategy is this?", "o": ["Licensing", "Wholly owned subsidiary", "Exporting", "Joint venture"], "a": 3, "x": "A new business owned together with a local firm = joint venture.", "skip": 0}, {"n": 24, "sec": "Multiple choice", "cs": -1, "q": "What does GLOBE stand for?", "o": ["Global Leadership and Organizational Business Environment", "Global Leadership and Organizational Behavior Effectiveness", "Global Learning and Organizational Behavior Evaluation", "Global Leadership and Operations Benchmarking Exercise"], "a": 1, "x": "GLOBE = Global Leadership and Organizational Behavior Effectiveness.", "skip": 0}, {"n": 25, "sec": "Multiple choice", "cs": -1, "q": "What is “power distance” in Hofstede’s model?", "o": ["Preference for collective interests over individual ones", "Focus on risk and uncertainty", "Value of work and earnings", "Acceptance of power and authority differences"], "a": 3, "x": "Power distance = how much people accept unequal distribution of power and authority.", "skip": 0}, {"n": 26, "sec": "Multiple choice", "cs": -1, "q": "In a strongly collectivist culture, which managerial practice is most likely to be effective?", "o": ["Emphasizing only individual competition and personal recognition", "Avoiding long-term relationships among team members", "Assigning work without considering group membership", "Connecting rewards and goals to the performance of the group"], "a": 3, "x": "Collectivist cultures put the group first, so tie rewards and goals to group performance.", "skip": 0}, {"n": 27, "sec": "Mini cases", "cs": -1, "q": "Employees willingly support a team leader because they admire and identify with him. Which source of power is primarily illustrated?", "o": ["Legitimate power", "Reward power", "Referent power", "Coercive power"], "a": 2, "x": "Support based on admiration and identification = referent power.", "skip": 0}, {"n": 28, "sec": "Mini cases", "cs": -1, "q": "Severe flooding interrupts a company’s main supply route. The logistics director has formal authority to activate an emergency sourcing plan. She also relies on a climate-risk specialist whose knowledge helps the company evaluate more resilient and sustainable suppliers. Which pair correctly identifies the sources of power in the case?", "o": ["Referent power from the director and coercive power from the specialist", "Reward power from the director and referent power from the specialist", "Legitimate power from the director and expert power from the specialist", "Expert power from the director and legitimate power from the specialist"], "a": 2, "x": "Formal authority = legitimate power (director). Specialist knowledge = expert power (specialist).", "skip": 0}, {"n": 29, "sec": "Mini cases", "cs": -1, "q": "Competitors are rapidly introducing low-carbon products, and investors expect measurable emission reductions. A production manager sets departmental carbon targets and links part of the team bonus to achieving them. She also holds regular discussions about the skills and resources employees need to meet the new expectations. Which combination of leadership mechanisms appears in the case?", "o": ["Reward power with task-oriented targets and people-oriented employee support", "Referent power with autocratic targets and task-oriented employee support", "Legitimate power with laissez-faire targets and coercive employee support", "Coercive power with people-oriented targets and laissez-faire employee support"], "a": 0, "x": "Linking part of the bonus = reward power. Carbon targets = task-oriented. Discussing skills and resources employees need = people-oriented.", "skip": 0}, {"n": 30, "sec": "Mini cases", "cs": -1, "q": "A manufacturer is replacing a polluting production process with cleaner technology. The operations director defines conversion targets, assigns responsibilities, and monitors deadlines. She also invites employees from different backgrounds and job levels to discuss how the change may affect them and adapt the training accordingly. Which description best summarizes the director’s leadership behavior?", "o": ["Laissez-faire and people-oriented leadership allowing employees to direct implementation independently", "Task-oriented and people-oriented leadership balancing targets with employee inclusion", "People-oriented and democratic leadership emphasizing consultation without formal performance targets", "Task-oriented and autocratic leadership emphasizing targets and centralized managerial control"], "a": 1, "x": "Targets, responsibilities and deadlines = task-oriented. Inviting employees and adapting training = people-oriented. She does both.", "skip": 0}, {"n": 31, "sec": "Mini cases", "cs": -1, "q": "A fashion retailer discovers that a low-cost supplier has unsafe working conditions and causes serious environmental damage. The CEO ends the contract despite the short-term cost. She communicates a vision of a fair, low-carbon supply chain and invites employees to redesign sourcing practices. Which description best explains the CEO’s leadership response?", "o": ["Authentic and laissez-faire leadership expressing personal values while limiting organizational direction", "Transactional and servant leadership linking supplier decisions to rewards and employee development", "Ethical and transformational leadership protecting stakeholders while communicating a new vision", "Charismatic and transactional leadership using personal influence and performance-based exchanges"], "a": 2, "x": "Ending the contract to protect workers and the environment = ethical. A new vision plus involving employees = transformational.", "skip": 0}, {"n": 32, "sec": "Mini cases", "cs": -1, "q": "New international regulations require companies to explain automated hiring decisions. Public concern about discrimination is also increasing. A technology leader commissions independent bias audits, publishes the results, and sets a strategic goal to develop transparent and inclusive AI products. Which interpretation best explains the company’s leadership response?", "o": ["Servant leadership develops employees while leaving the automated system strategically unchanged", "Ethical and transformational leadership connects transparency with inclusive strategic innovation", "Authentic and charismatic leadership emphasizes personal identity and persuasive public communication", "Transactional leadership maintains existing products through rewards linked to regulatory compliance"], "a": 1, "x": "Independent audits and publishing results = ethical. A strategic goal for transparent, inclusive innovation = transformational.", "skip": 0}, {"n": 33, "sec": "Mini cases", "cs": -1, "q": "A nonprofit director learns that employees performing comparable work are paid differently across gender and ethnic groups. She openly acknowledges the problem, publishes the review method, corrects the pay gaps, and asks employees what support they need for future development. She accepts personal responsibility for maintaining fair practices. Which description best explains the director’s leadership styles?", "o": ["Charismatic and transformational leadership connecting personal influence with an inspiring vision", "Transactional and ethical leadership linking fair treatment mainly to performance rewards", "Authentic and servant leadership combining transparency for employees", "Values-based and autocratic leadership combining organizational principles with centralized decisions"], "a": 2, "x": "Openly acknowledging the problem and taking responsibility = authentic. Asking what employees need to develop = servant leadership.", "skip": 0}, {"n": 34, "sec": "Mini cases", "cs": -1, "q": "New equality legislation strengthens protection for gender identity and sexual orientation. At the same time, qualified applicants increasingly expect remote and flexible work. A consulting company revises its inclusion policies, trains managers, and creates virtual teams that recruit talent from a wider geographic area. Which interpretation best explains the company’s organizational response?", "o": ["Technological pressures encourage matrix structures and specialist recruitment within one location", "Internal workforce pressures encourage functional structures and locally restricted recruitment practices", "Economic pressures encourage divisional structures and standardized recruitment across all locations", "Legal and sociocultural pressures encourage inclusive policies and geographically flexible virtual structures"], "a": 3, "x": "New law = legal pressure; applicants expecting remote work = sociocultural. The response: inclusive policies and virtual teams.", "skip": 0}, {"n": 35, "sec": "Mini cases", "cs": -1, "q": "A food company operates in regions facing different climate risks and environmental rules. It reorganizes its operations into geographic divisions so that the managers can adapt sourcing, products, and sustainability practices to local conditions. Which interpretation best explains the organizational change?", "o": ["External natural and legal pressures encourage a geographic structure tailored to regional conditions", "External competitive pressures encourage a divisional structure tailored to separate product lines", "Internal cultural pressures encourage a functional structure tailored to specialist occupations", "Internal technological pressures encourage a matrix structure tailored to temporary projects"], "a": 0, "x": "Climate risks (natural) and environmental rules (legal) are external pressures; reorganizing by region = geographic structure.", "skip": 0}, {"n": 36, "sec": "Mini cases", "cs": -1, "q": "An electronics company creates teams to design energy-efficient products for customers with different physical abilities. Engineers remain members of specialist departments but also report to product managers. Each team includes employees with varied professional, cultural, and personal backgrounds. Which combination of organizational concepts appears in the case?", "o": ["Functional structure with specialization and a professionally uniform product team", "Geographic structure with regional authority and a culturally uniform product team", "Matrix structure with dual reporting and a professionally diverse product team", "Virtual structure with remote coordination and a geographically uniform product team"], "a": 2, "x": "Reporting to a specialist department and a product manager at once = matrix (dual reporting). Varied backgrounds = a diverse team.", "skip": 0}, {"n": 37, "sec": "Mini cases", "cs": -1, "q": "Rapid e-commerce growth and new carbon standards are changing logistics. A manager works with warehouse supervisors, suppliers, and transport providers to meet current targets. She also builds relationships with regulators, sustainability experts, and potential technology partners to anticipate future developments. Which two network types are represented in the case?", "o": ["A strategic network for current coordination and a personal network for future developments", "A personal network for current coordination and a closed network for future developments", "An operational network for current coordination and a strategic network for future developments", "A personal network for current coordination and an operational network for future developments"], "a": 2, "x": "Contacts for current targets = operational network. Contacts to anticipate the future = strategic network.", "skip": 0}, {"n": 38, "sec": "Mini cases", "cs": -1, "q": "A shift toward hybrid work leads a company to add remote specialists from several countries to an established product team. The team leader notices uncertainty about roles, technology, and meeting expectations. She schedules orientation sessions and helps members rebuild shared working agreements. Which two team-development stages best match the change described?", "o": ["Forming after adding members, followed by norming as shared agreements develop", "Performing after adding members, followed by storming as role expectations become clear", "Norming after adding members, followed by adjourning after agreements are established", "Storming after adding members, followed by performing after the first orientation session"], "a": 0, "x": "New members restart the team at forming (uncertainty about roles); rebuilding shared working agreements = norming.", "skip": 0}, {"n": 39, "sec": "Mini cases", "cs": -1, "q": "A newly diverse project team initially experiences disagreement about priorities and communication styles. Instead of removing members who disagree, the leader helps the team establish decision rules, clarify roles, and develop norms that ensure every member can contribute. Trust and cohesion begin to increase. Which two team-development stages are represented in sequence?", "o": ["Forming followed by storming as members first meet and then avoid disagreement", "Performing followed by adjourning as initial conflict gives way to role clarification", "Storming followed by norming as disagreement gives way to shared expectations", "Norming followed by performing as shared expectations give way to initial conflict"], "a": 2, "x": "Disagreement about priorities = storming. Agreeing on rules, roles and norms = norming.", "skip": 0}, {"n": 40, "sec": "Long case · NorthSea Foods (Ch 6)", "cs": 7, "q": "How should the high-share plant-based brand in a high-growth market be classified in the BCG Matrix?", "o": ["A question mark because it has low market share within a rapidly growing product category; this classification indicates the investment role the brand is expected to play within the portfolio.", "A cash cow because it has high market share within a mature, slow-growing product category; this classification indicates the investment role the brand is expected to play within the portfolio.", "A dog because it has low market share within a mature, slow-growing product category; this classification indicates the investment role the brand is expected to play within the portfolio", "A core competence because it represents a coordinated capability that competitors cannot easily imitate; this classification indicates the investment role the brand is expected to play within the portfolio.", "A support activity because it provides infrastructure used by several primary value-chain activities; this classification indicates the investment role the brand is expected to play within the portfolio.", "A star because it has high market share within a rapidly growing product category; this classification indicates the investment role the brand is expected to play within the portfolio"], "a": 5, "x": "High market share in a high-growth market = star.", "skip": 0}, {"n": 41, "sec": "Long case · NorthSea Foods (Ch 6)", "cs": 7, "q": "Study Exhibit 1A: BCG Matrix — NorthSea Foods Portfolio. NorthSea has limited investment resources and wants to allocate them according to each business unit’s market growth and relative market share.<br>The exhibit places:<br>the plant-based brand in Stars,<br>seaweed snacks in Question Marks,<br>traditional dairy in Cash Cows,<br>and the older dessert brand in Dogs.<br>Based on the positions shown in Exhibit 1A, which strategic resource-allocation decision BEST follows the logic of the BCG Matrix?", "o": ["Direct most available resources toward seaweed snacks because every Question Mark should automatically receive maximum investment.", "Reduce investment in the plant-based brand because Stars should mainly generate cash rather than require further investment.", "Give priority to the older dessert brand because low share in a low-growth market creates the greatest opportunity for expansion.", "Invest equally across all four businesses because portfolio position should not influence corporate resource allocation.", "Use cash generated by traditional dairy to support continued investment in the plant-based brand, selectively assess whether seaweed snacks can build market share, and limit major new investment in the older dessert brand.", "Invest most heavily in traditional dairy because high market share means it also has the strongest market-growth potential."], "a": 4, "x": "BCG logic: use the cash cow's money to fund the star, be selective with question marks, and limit investment in dogs.", "skip": 0}, {"n": 42, "sec": "Long case · NorthSea Foods (Ch 6)", "cs": 7, "q": "Investing across dairy, plant-based foods, snacks, and desserts is primarily a decision at which strategy level?", "o": ["Business level because one product brand selects how it will compete against direct rivals; this interpretation clarifies where responsibility for allocating resources across the organization's businesses should remain.", "Team level because employees divide assignments within one temporary product-development project; this interpretation clarifies where responsibility for allocating resources across the organization's businesses should remain.", "Corporate level because leaders allocate resources across multiple businesses and product categories; this interpretation clarifies where responsibility for allocating resources across the organization's businesses should remain.", "Operational level because supervisors schedule individual production tasks for the following working week; this interpretation clarifies where responsibility for allocating resources across the organization's businesses should remain.", "Functional level because one department decides how to perform its specialized daily responsibilities; this interpretation clarifies where responsibility for allocating resources across the organization's businesses should remain.", "Individual level because employees select personal objectives for their annual performance discussions; this interpretation clarifies where responsibility for allocating resources across the organization's businesses should remain."], "a": 2, "x": "Allocating resources across several businesses = corporate-level strategy.", "skip": 0}, {"n": 43, "sec": "Long case · NorthSea Foods (Ch 6)", "cs": 7, "q": "Study Exhibit 1B: PESTEL Analysis — Key External Developments. NorthSea Foods wants to understand which external development most directly explains the voluntary growth in demand for plant-based products.<br>The exhibit shows several external forces, including inflation, agricultural policy, improved production technology, climate pressures, environmental labeling requirements, and changing consumer values and lifestyles.<br>Based on the evidence shown in Exhibit 1B, which PESTEL factor BEST explains why consumers are increasingly choosing plant-based products even in markets where no new labeling law or subsidy has been introduced?", "o": ["Environmental factors, because any consumer concern related to sustainability must be classified as an environmental factor.", "Economic factors, because inflation and purchasing power explain the long-term shift toward plant-based consumption.", "Social factors, because changing lifestyles, health concerns, animal-welfare values, identity, and environmental awareness are influencing consumer preferences.", "Political factors, because government agricultural policies directly determine consumer food preferences.", "Legal factors, because environmental labeling requirements are the main reason consumers voluntarily change their diets.", "Technological factors, because improved production methods automatically create new consumer values and eating habits"], "a": 2, "x": "Voluntary demand driven by lifestyles, health, values and identity = social factors, even without laws or subsidies.", "skip": 0}, {"n": 44, "sec": "Long case · NorthSea Foods (Ch 6)", "cs": 7, "q": "Growing consumer interest in plant-based food is primarily due to which external trend?", "o": ["An environmental trend involving physical climate effects and the availability of natural resources; this classification helps managers distinguish changing consumer values from other external environmental forces.", "A legal trend involving mandatory regulations, formal standards, and enforceable labeling requirements; this classification helps managers distinguish changing consumer values from other external environmental forces.", "A technological trend involving production equipment, automation, and food-processing innovation; this classification helps managers distinguish changing consumer values from other external environmental forces.", "A social trend involving changing lifestyles, values, preferences, and consumption patterns; this classification helps managers distinguish changing consumer values from other external environmental forces.", "political trend involving changes in government stability and public administration priorities; this classification helps managers distinguish changing consumer values from other external environmental forces.", "An economic trend involving interest rates, inflation, and consumers' general purchasing power; this classification helps managers distinguish changing consumer values from other external environmental forces."], "a": 3, "x": "Changing lifestyles, values and consumption preferences = a social trend.", "skip": 0}, {"n": 45, "sec": "Long case · AeroLogistics (Ch 11)", "cs": 8, "q": "The pilot reduced delivery time from three hours to forty minutes while meeting safety requirements. Management communicates this result to employees and uses it to build support for expanding the drone-delivery initiative. According to Kotter’s 8-Step Change Model, what is management MOST clearly doing?", "o": ["Creating urgency by showing employees that the existing organizational culture must immediately be replaced.", "Anchoring the change in organizational culture because one successful pilot means the new working methods are already institutionalized.", "Creating the change vision because the pilot establishes the company's long-term strategic direction and future organizational structure.", "Generating a short-term win that demonstrates the value of the change and helps build momentum for further implementation.", "Forming a guiding coalition by demonstrating that drone technology is valuable and difficult for competitors to imitate.", "Removing barriers because faster delivery automatically eliminates employee concerns about skills, responsibilities, and safety."], "a": 3, "x": "Communicating a visible early result to build momentum = generating a short-term win (Kotter step 6).", "skip": 0}, {"n": 46, "sec": "Long case · AeroLogistics (Ch 11)", "cs": 8, "q": "Which combination best classifies the external developments affecting AeroLogistics?", "o": ["Organizational artifacts, underlying assumptions, leadership traits, and internal reporting relationships; this classification organizes the environmental developments that influence the organization's innovation choices and risks.", "Technological advances, legal uncertainty, competitive experiments, and changing community expectations; this classification organizes the environmental developments that influence the organization's innovation choices and risks", "Reward power, legitimate power, referent power, and expert power within the organization; this classification organizes the environmental developments that influence the organization's innovation choices and risks.", "Functional specialization, employee motivation, team development, and internal performance-management procedures; this classification organizes the environmental developments that influence the organization's innovation choices and risks.", "Forming, storming, norming, and performing stages within the project-development team; this classification organizes the environmental developments that influence the organization's innovation choices and risks.", "Mission statements, vision statements, corporate objectives, and departmental performance indicators; this classification organizes the environmental developments that influence the organization's innovation choices and risks."], "a": 1, "x": "Drone advances = technological; aviation rules = legal; competitor partnerships = competitive; community concerns = social.", "skip": 1}, {"n": 47, "sec": "Long case · AeroLogistics (Ch 11)", "cs": 8, "q": "The Value Chain exhibit shows that drone delivery will affect operations, technology, employees, partnerships, and customer service. Some employees support the innovation but others worry about new responsibilities, safety expectations, and whether they have the skills required. Which management response BEST addresses resistance while supporting implementation of the innovation?", "o": ["Reduce communication about the project until management has finalized every operational decision to prevent uncertainty.", "Allow each department to decide independently whether it wants to adopt drone delivery to minimize resistance.", "Introduce the new process immediately because the successful pilot demonstrates that employee concerns are no longer relevant.", "Reward employees who adopt the technology quickly and exclude resistant employees from further discussions about implementation.", "Focus primarily on purchasing additional drones because technological capability is the main requirement for successful organizational change.", "Involve affected employees in the change, provide training and clear communication, and use pilot feedback to improve the new processes before wider implementation."], "a": 5, "x": "Involving employees, training, clear communication and using pilot feedback is how you reduce resistance and support implementation.", "skip": 0}, {"n": 48, "sec": "Long case · AeroLogistics (Ch 11)", "cs": 8, "q": "Which option best explains a feature of AeroLogistics’ innovative culture?", "o": ["Preventing healthcare customers and community representatives from joining innovation discussions; this explanation connects the organization's response to failure with psychological safety and responsible experimentation.", "Treating responsible unsuccessful proposals as learning opportunities rather than automatic failures; this explanation connects the organization's response to failure with psychological safety and responsible experimentation.", "Evaluating employees only on immediate financial outcomes from every proposed drone route; this explanation connects the organization's response to failure with psychological safety and responsible experimentation.", "Requiring project teams to avoid experimentation whenever aviation regulations remain uncertain; this explanation connects the organization's response to failure with psychological safety and responsible experimentation.", "Waiting until every competitor succeeds before considering any experimental delivery technology; this explanation connects the organization's response to failure with psychological safety and responsible experimentation.", "Limiting new-route proposals to senior leaders who hold formal organizational authority; this explanation connects the organization's response to failure with psychological safety and responsible experimentation."], "a": 1, "x": "Innovative cultures treat responsible, well-designed failures as learning opportunities instead of punishing them.", "skip": 0}, {"n": 49, "sec": "Long case · AeroLogistics (Ch 11)", "cs": 8, "q": "Which case evidence should be classified as a short-term win for the drone initiative?", "o": ["Community concerns regarding possible noise, privacy, and disruption from future drone routes; this interpretation links measurable pilot evidence with credibility, learning, and continued support for innovation.", "Competitors' decisions to cooperate with technology startups on similar delivery experiments; this interpretation links measurable pilot evidence with credibility, learning, and continued support for innovation.", "Uncertainty regarding how aviation rules may apply when the service expands nationally; this interpretation links measurable pilot evidence with credibility, learning, and continued support for innovation.", "Management's promise to review unsuccessful proposals for learning instead of automatic punishment; this interpretation links measurable pilot evidence with credibility, learning, and continued support for innovation.", "Employees' opportunity to suggest possible routes for later testing by the project team; this interpretation links measurable pilot evidence with credibility, learning, and continued support for innovation.", "The pilot's verified reduction in delivery time while meeting all required safety standards; this interpretation links measurable pilot evidence with credibility, learning, and continued support for innovation."], "a": 5, "x": "The verified, measurable pilot result (3 h → 40 min, safely) = a short-term win.", "skip": 0}]}];
const RCASE = [{"title": "SolarNest Energy", "ch": "Ch 6", "text": ["SolarNest Energy was founded eight years ago with the mission of making household energy independence affordable and understandable. The company installs residential solar panels, home batteries, and digital energy-management systems in three European countries. Its customers are mainly homeowners who want to reduce electricity costs and become less dependent on traditional utilities. SolarNest has grown quickly by combining equipment installation with ongoing technical support rather than simply selling individual products.", "A central part of the service is SolarNest’s proprietary digital platform. The platform studies a household’s historical electricity use, weather forecasts, and changing energy prices. It then predicts future consumption and schedules battery charging or household energy use for lower-cost periods. The system has been improved using several years of customer data and is integrated with the company’s installation, maintenance, and customer-support processes. Competitors can buy similar panels and batteries, but they do not have access to SolarNest’s accumulated data, established algorithms, and integrated service routines.", "SolarNest also has a certified installer network and strong working relationships with local municipalities. These relationships help the company navigate permits and safety requirements. Its reputation for dependable installation has created customer trust, although maintaining the network is expensive. The company’s website, marketing campaigns, and standard panel designs are professional but similar to those used by many competitors.", "The external environment is becoming more challenging. A national government has announced that household solar subsidies will decline next year. Electricity prices remain volatile, and several large utility companies are entering the battery market. These utilities have strong brands and large customer bases. Customers are also asking more questions about data privacy, equipment origins, installation quality, and the environmental impact of battery production.", "Senior leaders are reviewing SolarNest’s competitive position. Some favor rapid expansion into new countries. Others want to license the digital platform to utility companies, while a third group believes SolarNest should strengthen its existing markets. Before choosing a direction, management wants to distinguish ordinary resources from resources capable of supporting a sustained competitive advantage. The strategy team therefore examines whether each resource is valuable, rare, difficult to imitate, and supported by the organization.", "The review must also separate temporary market benefits from internal strategic resources. Subsidies may increase demand, but competitors can receive them as well. Advertising can attract attention, but rival firms can imitate it quickly. Management therefore focuses on the combination of technology, accumulated information, organizational routines, and service integration that may be more difficult for competitors to reproduce.", "Stakeholder expectations further complicate the choice. Municipal regulators have formal authority over permits and installation safety. Customers want affordable systems and clear privacy safeguards, employees want stable growth and training, and investors expect expansion without excessive risk. The strategy team maps each stakeholder according to power and interest. It also uses PESTEL to distinguish the political effect of changing subsidies from economic energy-price volatility, technological battery improvements, legal privacy requirements, social expectations, and environmental pressures. These classifications will help management interpret the case evidence consistently before selecting a strategic direction."]}, {"title": "MedLink Connect", "ch": "Ch 6", "text": ["MedLink Connect provides a secure telehealth platform to hospitals, specialist clinics, and regional healthcare networks. Its mission is to improve access to medical expertise regardless of a patient’s location. The platform combines video consultations, appointment scheduling, secure messaging, and access to encrypted patient information. MedLink has built a reputation for reliable clinical support and has long-term partnerships with several teaching hospitals.", "Demand for telehealth is growing in rural regions where patients often travel long distances to see specialists. Hospitals value MedLink’s understanding of clinical workflows and its ability to integrate with existing hospital systems. However, the competitive environment is changing. Global technology companies now offer basic video-consultation services at lower prices. Large hospital groups are negotiating more aggressively, and new European privacy requirements demand stronger controls over patient information.", "The leadership team is considering expansion into two neighboring countries. This decision requires choices at several levels. The board and executive team must decide which countries MedLink should enter, how much capital to invest, and whether expansion should occur through partnerships or direct ownership. The telehealth business unit must determine how MedLink will compete against lower-cost platforms. It may emphasize clinical reliability, specialist integration, security, or price.", "Individual departments must translate these broader choices into concrete actions. The marketing department will adapt communication for local healthcare systems. Human resources will identify the skills needed for international support. The cybersecurity department must implement stronger authentication, update incident-response procedures, train employees, and monitor compliance with the new privacy requirements. These actions must support the business unit’s competitive approach and the organization’s overall expansion priorities.", "Some managers confuse these levels of strategy. They
