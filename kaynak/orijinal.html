S_("c6b",1,"Synergy exists when:",["Two or more activities together create a combined effect greater than the sum of their individual effects","A company sells all its businesses","A firm is in multiple unrelated businesses to spread risk","Costs are cut to the minimum"],"1 + 1 = 3.");
S_("c6b",1,"Diversification is:",["Participating in multiple businesses that are distinct from each other, to spread risk","Focusing on one product","Lowering prices","Combining two departments"],"YUM! Brands owning KFC, Pizza Hut, Taco Bell.");
S_("c6b",2,"A food group sells its pizza chain and keeps only its burger restaurants. At which level is this decision?",["Corporate","Business","Functional","Operational"],"Choosing which businesses to be in = corporate.");
S_("c6b",2,"The marketing department plans next quarter's social media campaigns to support the growth plan. Which level?",["Functional","Corporate","Business","Vision"],"One department supporting the plan = functional.");
S_("c6b",2,"An airline cuts every extra cost, flies one aircraft type and sells the cheapest tickets in its market. How does it compete?",["Cost leadership","Differentiation","Diversification","Synergy"],"Lowest cost, lowest price.");
S_("c6b",2,"A company has a patented container that keeps food fresher than any rival's and charges more for it. How does it compete?",["Differentiation","Cost leadership","Diversification","Synergy"],"Unique feature + higher price.");
S_("c6b",2,"A hotel group and its airline share one loyalty programme, and both sell more than they would alone. This illustrates:",["Synergy","Diversification","Differentiation","Stakeholder analysis"],"Combined effect greater than the parts.");
S_("c6b",3,"A watch brand makes very expensive watches only for serious collectors. Its approach is best described as:",["Focus (differentiation in a narrow segment)","Cost leadership across the whole market","Diversification","Corporate synergy"],"Narrow segment + unique product.");
S_("c6b",3,"Which statement about sustainable competitive advantage is correct?",["It exists when strengths can't easily be copied or made less valuable by changes in the environment","It is any advantage, even if competitors copy it next month","It only comes from low prices","It is the same as a vision statement"],"Hard to copy and robust to environmental change.");
S_("c6b",3,"Which pairing of level and decision is correct?",["Corporate: entering the hotel business · Business: competing on price in our current market","Corporate: next month's ad campaign · Functional: buying a competitor","Business: which industries to be in · Corporate: HR's recruitment plan","Functional: selling a division · Business: weekly shift schedule"],"Check both halves.");

/* ---- c6c Value chain, VRIO, BCG ---- */
S_("c6c",1,"Which are the five PRIMARY activities of Porter's value chain?",["Inbound logistics, operations, outbound logistics, marketing & sales, service","Procurement, HRM, technology development, firm infrastructure, service","Planning, organizing, leading, controlling, evaluating","Political, economic, social, technological, legal"],"The four support activities are procurement, HRM, technology development and firm infrastructure.");
S_("c6c",1,"VRIO stands for:",["Valuable, Rare, hard to Imitate, Organized to exploit","Vision, Resources, Innovation, Operations","Value, Risk, Investment, Output","Volume, Revenue, Income, Overhead"],"Four questions about a resource.");
S_("c6c",1,"In the BCG matrix, a product with high market growth and high market share is a:",["Star","Cash cow","Question mark","Dog"],"High-high = star.");
S_("c6c",1,"Which of these is a SUPPORT activity in the value chain?",["Procurement","Outbound logistics","Marketing & sales","Service"],"Procurement supports; the others are primary.");
S_("c6c",2,"A bike maker's greatest asset is its network of repair shops. Which value-chain activity is that?",["Service","Procurement","Firm infrastructure","Inbound logistics"],"After-sales repairs = service (primary).");
S_("c6c",2,"A design is valuable and rare, but competitors could copy it within a year. VRIO result?",["Temporary competitive advantage","Competitive parity","Unused competitive advantage","Sustained competitive advantage"],"V yes, R yes, I no.");
S_("c6c",2,"Customers love a company's app, but almost every competitor has a similar one. VRIO result?",["Competitive parity","Temporary competitive advantage","Sustained competitive advantage","Competitive disadvantage"],"Valuable but not rare → stop at R.");
S_("c6c",2,"A firm owns a unique, hard-to-copy patent but has no team or process to use it. VRIO result?",["Unused competitive advantage","Sustained competitive advantage","Competitive parity","Temporary competitive advantage"],"V, R, I yes; O no.");
S_("c6c",2,"A phone maker's tablet line has a small share in a market that is growing very fast. BCG?",["Question mark","Star","Cash cow","Dog"],"High growth + low share.");
S_("c6c",2,"A soft-drink brand dominates a market that barely grows, and its profits fund new products. BCG?",["Cash cow","Star","Question mark","Dog"],"Low growth + high share, generating cash.");
S_("c6c",2,"A team maintains the tracking software and improves a patented seal. Which value-chain activity?",["Technology development (support)","Operations (primary)","Procurement (support)","Service (primary)"],"R&D and IT = technology development.");
S_("c6c",3,"Which of these is an INTERNAL analysis tool?",["Value chain","PESTEL","Porter's five forces","An external stakeholder survey of trends"],"Internal: value chain, VRIO, BCG. External: PESTEL, Porter.");
S_("c6c",3,"A reusable-packaging company collects, cleans, inspects and redistributes returned containers. In the value chain this is best classified as:",["A primary activity, because it directly creates and delivers the reusable service to customers","A support activity, because cleaning is a background task","Firm infrastructure, because it involves planning","Procurement, because containers are bought"],"It is the core process the customer pays for.");
S_("c6c",3,"A product has low growth and low market share. According to the BCG logic, management will usually:",["Consider selling or closing it (dog)","Invest heavily to make it a star","Use it to fund the stars (cash cow)","Expect it to become the next market leader without investment"],"Dogs are candidates to divest.");

/* ---- c6d SWOT, PESTEL, Porter ---- */
S_("c6d",1,"In SWOT, strengths and weaknesses are ___; opportunities and threats are ___.",["internal; external","external; internal","both internal","both external"],"S and W inside; O and T outside.");
S_("c6d",1,"PESTEL stands for:",["Political, economic, sociocultural, technological, environmental, legal","Planning, execution, strategy, tactics, evaluation, leadership","Price, efficiency, sales, technology, employees, logistics","People, environment, society, trade, economy, labour"],"The macro environment.");
S_("c6d",1,"Which is NOT one of Porter's five forces?",["Bargaining power of employees","Threat of new entrants","Threat of substitutes","Bargaining power of suppliers"],"The five: rivalry, new entrants, substitutes, buyer power, supplier power.");
S_("c6d",1,"Which of these is an EXTERNAL analysis tool?",["Porter's five forces","VRIO","Value chain","BCG matrix"],"External: PESTEL and Porter.");
S_("c6d",2,"The EU introduces a law forcing all plastic packaging to be recyclable by 2030. Which tool and SWOT category?",["PESTEL, threat or opportunity","Value chain, weakness","VRIO, strength","BCG, threat"],"A law is external: never a strength or weakness.");
S_("c6d",2,"Many cheap new streaming services enter the market every year. Which force?",["Threat of new entrants","Threat of substitutes","Bargaining power of buyers","Rivalry among existing competitors"],"New firms entering.");
S_("c6d",2,"Only one company in the world makes the chip a phone maker needs, so it can raise prices freely. Which force?",["Bargaining power of suppliers","Bargaining power of buyers","Threat of substitutes","Threat of new entrants"],"A powerful supplier.");
S_("c6d",2,"More travellers take the train instead of flying for short trips. For airlines this is:",["Threat of substitutes","Threat of new entrants","Bargaining power of suppliers","Rivalry"],"A different product meeting the same need.");
S_("c6d",2,"A supermarket chain that sells 60% of a producer's goods demands a 15% price cut. Which force?",["Bargaining power of buyers","Bargaining power of suppliers","Threat of substitutes","Threat of new entrants"],"A powerful customer.");
S_("c6d",2,"An ageing population means more demand for home care. For a care provider this is a ___ factor and an ___.",["sociocultural; opportunity","economic; threat","legal; strength","technological; weakness"],"Demographics = sociocultural, and it's external and positive.");
S_("c6d",3,"Which combination is correct?",["A loyal customer base: strength · Rising interest rates: threat","A loyal customer base: opportunity · Rising interest rates: weakness","Outdated IT: threat · New subsidy: strength","Skilled staff: opportunity · New competitor: weakness"],"Internal → S/W; external → O/T. Check both halves.");
S_("c6d",3,"What is the main difference between PESTEL and Porter's five forces?",["PESTEL covers the broad macro environment; Porter covers the competitive environment of the industry","PESTEL is internal; Porter is internal too","Porter covers laws and politics; PESTEL covers competitors","They are identical tools"],"Macro vs industry.");
S_("c6d",3,"A government discusses a tax subsidy for people who commute by e-bike. For an e-bike sharing firm this is best classified as:",["An external political/economic opportunity (PESTEL)","An internal strength (VRIO)","Bargaining power of buyers (Porter)","A support activity in the value chain"],"Government policy outside the firm, and it helps.");

/* ---- c6e Intended vs realized ---- */
S_("c6e",1,"Intended strategy is:",["The strategy conceived by the top management team","The strategy that is actually implemented","Decisions that emerge from lower levels","The company's values"],"Intended = the plan from the top.");
S_("c6e",1,"Realized strategy is:",["The strategy that is actually implemented: deliberate plus emergent","Only what top management planned","A vision statement","A failed plan"],"What actually happened.");
S_("c6e",1,"According to Mintzberg, roughly how much of intended strategy is realized?",["10–30%","About 90%","50–70%","Almost 0%"],"Only 10–30%.");
S_("c6e",1,"Emergent strategy is:",["Decisions that emerge as leaders interpret the plan and adapt to changing circumstances","The plan made in board meetings","A strategy that never changes","The mission statement"],"Often bottom-up adaptation.");
S_("c6e",2,"A coffee chain's board plans growth through drive-throughs. Store managers notice customers want delivery and start partnering with delivery apps. Two years later most growth comes from delivery. The delivery strategy is:",["Emergent strategy that became part of the realized strategy","Intended strategy","Deliberate strategy carried out exactly as planned","A vision statement"],"Not planned, arose from adaptation, now what actually happened.");
S_("c6e",2,"A firm planned annual subscriptions for large retailers, but pilot results led it to switch to deposit-return points. How should the switch be classified?",["A realized strategy that emerged from experience and differed from the original plan","An intended strategy fully planned before the pilots","A corporate mission","A functional routine"],"The plan changed through experience.");
S_("c6e",2,"Part of the board's original plan, three new stores, was built exactly as intended. That part is:",["Deliberate strategy","Emergent strategy","Unrealized strategy","Vision"],"The planned part that is carried out.");
S_("c6e",3,"In which kind of environment does emergence play the BIGGEST role relative to design?",["A volatile, unpredictable environment","A very stable environment such as a national postal service","An environment with no competitors","An environment where top management decides everything"],"More volatility → more emergence.");
S_("c6e",3,"Which statement reflects the book's view on design versus emergence?",["The best strategies balance planning with the flexibility to benefit from emergence","Only the design school is right","Only the emergence school is right","Strategy should never be planned"],"Not 'which school is right' but how they complement each other.");
S_("c6e",3,"Intel's move from memory chips to microprocessors came from many decisions at divisional and plant level that top leaders later accepted. This illustrates:",["Emergent strategy","Intended strategy","Diversification","A mission statement"],"Bottom-up decisions later acknowledged as strategy.");

/* ---- c7a Goals, MBO, BSC, SMART, KPI, CSR ---- */
S_("c7a",1,"What is an objective?",["A precise, time-based, measurable action that supports a goal","A broad vision of success","A long-term goal that defines the direction of the organization","A general outcome statement"],"Objectives are precise and measurable.");
S_("c7a",1,"What is a goal?",["An outcome statement of what the organization is trying to accomplish","A time-based measurable action","A company's mission statement","A detailed strategy plan"],"Goal = outcome statement.");
S_("c7a",1,"What does the Balanced Scorecard do?",["Turns mission and strategy into measurable goals and tracks them","Sets individual pay levels","Lists only financial targets for the year","Describes values for employee behaviour"],"Kaplan & Norton.");
S_("c7a",1,"SMART stands for:",["Specific, measurable, achievable, realistic, time-bound","Simple, motivating, ambitious, relevant, tested","Strategic, monitored, aligned, reviewed, tracked","Specific, managed, accurate, rewarded, timely"],"Book version: achievable and realistic.");
S_("c7a",1,"A KPI is:",["A measurable value showing how effectively a company achieves key business objectives","A personality test","A type of organizational structure","A motivation theory"],"Key Performance Indicator.");
S_("c7a",1,"Management by Objectives (MBO) was first outlined by:",["Peter Drucker (1954)","Abraham Maslow","Henry Mintzberg","Geert Hofstede"],"Drucker, The Practice of Management.");
S_("c7a",2,"Which of these is a SMART objective?",["Reduce customer complaints by 20% before 31 December","Become the best company in the world","Improve customer happiness","Work harder next year"],"Specific, measurable and time-bound.");
S_("c7a",2,"A company's managers agree with each employee on personal objectives that support the department's goals, with deadlines. This is:",["Management by Objectives","Herzberg's two-factor theory","A BCG analysis","The triple bottom line"],"Aligning subordinate objectives with organizational goals.");
S_("c7a",2,"A firm reports its results on profit, its carbon footprint and its community programmes. This reflects:",["The triple bottom line","A matrix structure","Equity theory","Programmed decisions"],"People, planet, profit.");
S_("c7a",2,"A Balanced Scorecard measures performance in which four areas?",["Financial, customer, internal business processes, learning & growth","Political, economic, social, legal","Strengths, weaknesses, opportunities, threats","Planning, organizing, leading, controlling"],"The four perspectives.");
S_("c7a",3,"Which statement about CSR and the Balanced Scorecard is correct?",["The Balanced Scorecard is well positioned to help make CSR values and visions measurable","CSR can never be measured","The Balanced Scorecard only covers financial results","CSR means only complying with the law"],"Crawford & Scaletta.");
S_("c7a",3,"Which pairing is correct?",["Goal: “be the most sustainable retailer in the region” · Objective: “cut packaging waste 25% by 2027”","Goal: “cut waste 25% by 2027” · Objective: “be the most sustainable retailer”","Goal: a KPI · Objective: a mission statement","Goal: a hygiene factor · Objective: a motivator"],"Goal = outcome statement; objective = precise and measurable.");
S_("c7a",3,"CSR is best described as:",["How companies manage their business processes to produce an overall positive effect on society","Maximizing profit within the law only","A type of decision-making bias","A form of marketing only"],"Book definition.");

/* ---- c7b Motivation theories ---- */
S_("c7b",1,"Motivation is defined as:",["The intention of achieving a goal, leading to goal-directed behaviour","Being paid well","Being satisfied with one's job","Having the skills to do the job"],"Book definition.");
S_("c7b",1,"According to the motivation equation, performance depends on:",["Motivation, ability and environment","Pay, hours and title","Personality only","Goals and objectives only"],"Performance = motivation × ability × environment.");
S_("c7b",1,"What is the correct order of Maslow's hierarchy, from bottom to top?",["Physiological, safety, social, esteem, self-actualization","Safety, physiological, esteem, social, self-actualization","Social, safety, physiological, esteem, self-actualization","Esteem, social, safety, physiological, self-actualization"],"Bottom: physiological. Top: self-actualization.");
S_("c7b",1,"ERG theory groups needs into:",["Existence, relatedness, growth","Esteem, recognition, growth","Effort, reward, goals","Equity, relatedness, gain"],"Alderfer.");
S_("c7b",1,"In Herzberg's theory, which are hygiene factors?",["Company policies, supervision, working conditions, salary, job security","Achievement, recognition, interesting work","Responsibility, advancement, growth","Self-actualization and esteem"],"Hygiene = job context; motivators = the work itself.");
S_("c7b",1,"Equity theory says people are motivated by:",["A sense of fairness, comparing their input/output ratio with a referent","Satisfying needs in a fixed hierarchy","Specific, difficult goals","Rewards following every behaviour"],"Adams.");
S_("c7b",2,"According to Herzberg, which action is most likely to increase motivation, rather than just improve a hygiene factor?",["Giving employees meaningful responsibility for complete projects","Clarifying the company's administrative policies","Improving the office temperature","Increasing job security"],"Responsibility is a motivator.");
S_("c7b",2,"An employee believes she contributes more effort than a colleague but receives the same reward. She responds by reducing her effort. Which theory explains this?",["Equity theory","Maslow's hierarchy of needs","Goal-setting theory","Herzberg's two-factor theory"],"Inequity → reduce own input.");
S_("c7b",2,"An employee frustrated by the lack of growth opportunities starts spending more time socializing with coworkers. Which theory explains this best?",["ERG theory (frustration-regression)","Maslow's hierarchy","Equity theory","Goal-setting theory"],"Frustrated growth needs → regression to relatedness.");
S_("c7b",2,"A worker who just lost his home cares about nothing but finding safe housing. Which Maslow level drives him?",["Safety needs","Esteem needs","Self-actualization","Social needs"],"Lower needs dominate until satisfied.");
S_("c7b",2,"A manager sets each rep a specific, challenging target with a deadline, and performance improves. Which theory?",["Goal-setting theory","Equity theory","ERG theory","Herzberg's hygiene theory"],"Locke & Latham.");
S_("c7b",2,"Marie compares her pay with Spencer, a new hire in the same job. In equity theory, Spencer is Marie's:",["Referent","Hygiene factor","Valence","Motivator"],"The comparison person.");
S_("c7b",3,"Which statement about Herzberg is correct?",["Removing dissatisfiers (hygiene) prevents dissatisfaction, but only motivators truly motivate","Better pay always motivates more","Hygiene factors are intrinsic to the work","Motivators cause dissatisfaction when absent"],"Fixing hygiene → neutral, not motivated.");
S_("c7b",3,"How does ERG theory differ from Maslow?",["ERG allows several needs at once, has no fixed order and includes frustration-regression","ERG has more levels than Maslow","ERG says only one need operates at a time","ERG ignores growth needs"],"Alderfer relaxed Maslow's assumptions.");
S_("c7b",3,"Which is a downside of goal setting according to the book?",["People may focus only on measured activities and ignore other parts of performance","Goals never improve performance","Goals remove all direction","SMART goals discourage creative thinking"],"Tunnel vision, quality suffering, even unethical behaviour.");
S_("c7b",3,"Which pairing of theory and category is correct?",["Maslow: need-based · Equity theory: process-based","Maslow: process-based · Equity theory: need-based","Herzberg: process-based · Goal-setting: need-based","ERG: process-based · Equity: need-based"],"Need-based: Maslow, ERG, Herzberg, McClelland. Process-based: equity, expectancy, goal setting, reinforcement.");

/* ---- c8a Environments & structures ---- */
S_("c8a",1,"The macro (general) environment of an organization consists of:",["Political, economic, social, technological, legal and environmental factors it has little control over","Its own departments and employees","Its value chain activities","Its mission and vision"],"The big-picture world outside.");
S_("c8a",1,"A functional structure is organized by:",["Departments and areas of expertise, such as R&D, production and finance","Geographic regions","Products, each with its own functions","Temporary project teams only"],"Expertise-based departments.");
S_("c8a",1,"In a matrix structure, employees:",["Report to a functional manager and a project or product manager at the same time","Work entirely online","Report only to a regional head","Have no manager"],"Dual reporting.");
S_("c8a",1,"Which internal analysis tools does the lecture link to the internal environment?",["VRIO and value chain","PESTEL and Porter's five forces","SWOT opportunities and threats","GLOBE and Hofstede"],"Internal: VRIO, value chain. External: PESTEL, Porter.");
S_("c8a",1,"Mechanistic structures fit best in:",["Stable, simple environments","Rapidly changing, complex environments","Start-ups in high tech","Virtual organizations"],"Organic fits unstable environments.");
S_("c8a",2,"An electronics company designs energy-efficient products. Engineers stay in their specialist departments but also report to product managers. Which structure is visible?",["Matrix structure","Functional structure only","Geographic structure","Virtual structure"],"Dual reporting = matrix.");
S_("c8a",2,"A food company has separate divisions for snacks, drinks and frozen food, each with its own marketing, sales and finance. Which structure?",["Divisional","Functional","Matrix","Virtual"],"Functions grouped under division heads.");
S_("c8a",2,"A clothing brand has Europe, Asia and Americas units, each adapting products to local tastes. Which structure?",["Geographic","Functional","Matrix","Networked team"],"Organized by customer location.");
S_("c8a",2,"A start-up has no office: designers, coders and support staff in eight countries work online, and production is outsourced. Which structure?",["Virtual","Functional","Divisional","Mechanistic"],"Boundaryless and ICT-dependent.");
S_("c8a",2,"Departments in a functional company barely talk to each other and protect their own budgets. This is the typical disadvantage called:",["Silos","Synergy","Dual reporting","Psychic distance"],"Functional silos.");
S_("c8a",3,"Which pairing of structure and disadvantage is correct?",["Matrix: confusion and conflict from two bosses · Divisional: duplication and isolated divisions","Matrix: silos · Divisional: two bosses","Functional: too much local autonomy · Geographic: silos","Virtual: rigid hierarchy · Functional: social isolation"],"Check both halves.");
S_("c8a",3,"New import tariffs raise the cost of components, and a firm reorganizes its purchasing department in response. This shows:",["An external (macro) force changing internal structures","An internal strength","A matrix structure","A counterculture"],"The slide example: external environments impact internal structures.");
S_("c8a",3,"Which statement about organic structures is correct?",["They are flatter, more participative and have fewer rules, fitting unstable environments","They are rule-based and centralized","They have a very narrow span of control","They suit only stable, simple environments"],"Opposite of mechanistic.");

/* ---- c8b Culture & diversity ---- */
S_("c8b",1,"Organizational culture is:",["A system of shared assumptions, values and beliefs that show people what is appropriate behaviour","The company's organization chart","The total salary budget","The products a company sells"],"Book definition.");
S_("c8b",1,"Schein's three levels of culture, from surface to deepest, are:",["Artifacts, values, assumptions","Values, artifacts, assumptions","Assumptions, values, artifacts","Rituals, rules, stories"],"Artifacts visible; assumptions below awareness.");
S_("c8b",1,"A strong culture is one in which:",["Most employees show consensus about the company's values","The CEO is very strict","There are many subcultures","Employees rarely agree"],"Shared values.");
S_("c8b",1,"Which is one of the four advantages of employee diversity named in the lecture?",["Diversity enhances creativity","Diversity reduces the need for communication","Diversity removes all conflict","Diversity lowers wages"],"Creativity, image, outreach, morale.");
S_("c8b",1,"The glass ceiling is:",["An invisible barrier based on prejudice that keeps women from moving beyond certain levels","A rule about office design","A type of matrix structure","A pay-for-performance system"],"Book definition.");
S_("c8b",2,"A tech company has open spaces, pool tables and an open-door policy for executives. At which level of Schein's model are these?",["Artifacts","Values","Basic assumptions","Counterculture"],"Visible, tangible = artifacts.");
S_("c8b",2,"In one bureaucratic bank, the digital team openly rejects the bank's values and works by its own rules. This is a:",["Counterculture","Subculture that shares the main values","Strong culture","Mechanistic structure"],"Values opposed to the main culture.");
S_("c8b",2,"A company has a weekly celebration where top performers ring a bell. This is a sign of culture called a:",["Ritual","Physical layout","Mission statement","Rule"],"Repetitive activity teaching values.");
S_("c8b",2,"A consulting firm hires staff from many backgrounds and wins new clients in communities it couldn't reach before. Which diversity advantage?",["Improves outreach","Enhances image only","Reduces morale","Removes the glass ceiling"],"Reaching new markets.");
S_("c8b",2,"A culture that values competitiveness and outperforming rivals is a(n):",["Aggressive culture","People-oriented culture","Stable culture","Detail-oriented culture"],"Book's dimensions of culture.");
S_("c8b",3,"Why can a strong culture be a liability?",["It is very hard to change and can clash with another strong culture in a merger","It always lowers performance","It has no effect on behaviour","It means employees disagree on values"],"Home Depot, Daimler-Chrysler.");
S_("c8b",3,"New equality laws protect gender identity and sexual orientation, and applicants expect remote work. A consulting firm revises its inclusion policies and builds virtual teams. Which interpretation fits best?",["Legal and sociocultural pressures encourage inclusive policies and geographically flexible virtual structures","Economic pressures encourage divisional structures and standardized hiring","Technological pressure removes the need for inclusion","Political pressure requires a functional structure"],"External forces (legal, sociocultural) → internal response (policy + structure).");
S_("c8b",3,"Which statement about sexual minorities at work is correct according to the course?",["They have higher education levels on average but still face hiring and treatment discrimination","They face no discrimination today","They have lower education levels on average","The topic is unrelated to organizational culture"],"Black et al.; Ragins et al.");
S_("c8b",3,"Which pairing of culture concept and example is correct?",["Founder values: a culture shaped by the beliefs of the company's founder · Onboarding: teaching new hires the norms","Founder values: a new office layout · Onboarding: firing poor performers","Artifact: a deep assumption · Ritual: a written policy","Subculture: the whole company's culture · Strong culture: many disagreeing groups"],"Check both halves.");

/* ---- c9a Hofstede & GLOBE ---- */
S_("c9a",1,"According to Hofstede's framework, what is meant by uncertainty avoidance?",["The degree to which people in a society are comfortable with risk and ambiguity","The preference for long-term planning over short-term outcomes","Trade between regions","The preference for local markets"],"Comfort (or discomfort) with uncertainty.");
S_("c9a",1,"What is power distance in Hofstede's model?",["Acceptance of differences in power and authority","The value of work and earnings","Preference for collective interests over individual ones","Focus on risk and uncertainty"],"Acceptance of inequality.");
S_("c9a",1,"Hofstede defined culture as:",["The collective programming of the mind that distinguishes one group from another","A company's written rules","The language of a country","A country's GDP"],"Hofstede's definition.");
S_("c9a",1,"Which two dimensions are unique to the GLOBE project (not in Hofstede)?",["Performance orientation and humane orientation","Power distance and uncertainty avoidance","Individualism and masculinity","Collectivism and assertiveness"],"GLOBE adds performance and humane orientation.");
S_("c9a",1,"Masculinity in Hofstede's model refers to:",["The degree to which a society emphasizes traditional masculine qualities such as achievement and earnings","The share of men in the workforce","Physical strength in jobs","Respect for authority"],"Work-focused, clear gender roles.");
S_("c9a",2,"In a strongly collectivist culture, which managerial practice is most likely to be effective?",["Connecting rewards and goals to the performance of the group","Emphasizing only individual competition and recognition","Assigning work without considering group membership","Avoiding long-term relationships among team members"],"Collectivism = focus on the group.");
S_("c9a",2,"Employees in a country rarely question their supervisor and expect clear instructions from the top. This country likely scores high on:",["Power distance","Individualism","Masculinity (low)","Indulgence"],"High power distance.");
S_("c9a",2,"A company wants detailed rules, contracts and procedures for everything before acting. Its home culture likely scores high on:",["Uncertainty avoidance","Power distance (low)","Individualism","Humane orientation (low)"],"High UA → stability and clear rules.");
S_("c9a",2,"A society places great importance on fairness, altruism and caring for others. Which GLOBE dimension?",["Humane orientation","Performance orientation","Power distance","Assertiveness"],"Humane orientation.");
S_("c9a",2,"In a highly masculine society, you would expect:",["Work to take priority over family and leisure, with clear gender roles","Equal priority for work and leisure","Very low interest in earnings","No interest in advancement"],"High masculinity: advancement and earnings matter.");
S_("c9a",3,"Which pairing is correct?",["Hofstede: developed in the 1960s, four original dimensions · GLOBE: 1990s, 62 countries, nine dimensions","Hofstede: 1990s · GLOBE: 1960s","Hofstede: nine dimensions · GLOBE: four dimensions","Both were developed in the same study"],"Check both halves.");
S_("c9a",3,"Psychic distance refers to:",["Differences between countries in language, culture, social institutions and business practices","The physical distance between two capitals","The emotional distance between a manager and employee","A Hofstede dimension"],"Book key term.");
S_("c9a",3,"An American manager sent to Mexico (high power distance) should most likely:",["Show authority and give clear direction, as subordinates expect it","Ask subordinates to challenge every decision openly","Remove all hierarchy immediately","Avoid giving any instructions"],"Adapt to high power distance expectations.");

/* ---- c9b Globalization & expanding globally ---- */
S_("c9b",1,"Which are the three globalization factors named in the lecture?",["Lowering trade barriers, foreign direct investment, the Internet","Tariffs, wars, inflation","Exporting, licensing, franchising","Power distance, individualism, masculinity"],"Book: three factors.");
S_("c9b",1,"Foreign direct investment (FDI) is:",["A country or company investing in another country through ownership positions in companies there","Selling products abroad from your home country","Paying a royalty to use a trademark","A tax on imports"],"Ownership abroad.");
S_("c9b",1,"Tariffs are:",["Taxes added to the price of imported products","Subsidies for exporters","Royalty fees for licences","Shares in a foreign company"],"Tariffs protect local industries.");
S_("c9b",1,"Which is the easiest way to go international?",["Exporting","Foreign direct investment","A wholly owned subsidiary","A strategic alliance"],"Exporting is easiest and cost-effective.");
S_("c9b",1,"A global strategy assumes that:",["The world is highly interconnected and consumption patterns are fairly similar worldwide","Every market needs its own product","Only regions matter","International trade is impossible"],"Same approach everywhere.");
S_("c9b",2,"A company enters a foreign market by creating a new business that it owns together with a local company. Which global expansion strategy is this?",["Joint venture","Wholly owned subsidiary","Exporting","Licensing"],"Jointly owned new business = joint venture (strategic alliance).");
S_("c9b",2,"Toyota organizes its marketing and finance around key geographic regions. Which strategy?",["Regional strategy","Global strategy","Local strategy","Exporting"],"Book example of a regional strategy.");
S_("c9b",2,"A fast-food chain offers rice dishes in Asia and different breakfasts in Europe to fit local tastes. Which strategy?",["Local strategy","Global strategy","Regional strategy","Licensing"],"Adapting products to local markets.");
S_("c9b",2,"For a royalty, a magazine allows a foreign publisher to use its name and content. This is:",["Licensing","FDI","Exporting","A joint venture"],"Use of trademark or know-how for a fee.");
S_("c9b",2,"A Dutch firm builds its own factory in Mexico, fully owned by the Dutch parent. This is:",["Foreign direct investment","Exporting","Licensing","A strategic alliance"],"Wholly invested in the host country.");
S_("c9b",3,"Why are strategic alliances often preferred for entering emerging markets?",["They make it easier to do business in the country, with a local partner who knows the market","They require no cooperation","They give full control without any partner","They avoid all risks"],"Book: preferred means of entry in emerging markets.");
S_("c9b",3,"Which statement about exporting is supported by the book?",["Companies that export tend to be about 17% more profitable than those that don't","Exporting is always too risky for small firms","Exporting requires building factories abroad","Exporting gives full control over foreign marketing"],"Research cited in the lecture.");
S_("c9b",3,"Which pairing of entry mode and involvement is correct (from least to most involved)?",["Exporting → licensing/franchising → strategic alliance → FDI","FDI → exporting → alliance → licensing","Alliance → FDI → exporting → licensing","Licensing → FDI → exporting → alliance"],"Increasing involvement and control.");

/* ---- c10a Teams ---- */
S_("c10a",1,"What are Tuckman's original four stages of team development, in order?",["Forming, storming, norming, performing","Storming, forming, norming, performing","Forming, norming, storming, performing","Norming, forming, performing, storming"],"Adjourning was added in 1977.");
S_("c10a",1,"In which stage do members compete for control and clash ('win-lose')?",["Storming","Forming","Norming","Performing"],"Storming.");
S_("c10a",1,"Which stage did Tuckman add in 1977?",["Adjourning","Reforming","Transforming","Conforming"],"The team disbands at the end of a project.");
S_("c10a",1,"In the forming stage, the team:",["Is polite and looks to the leader for structure and direction","Is fully self-directed","Clashes about leadership","Agrees on ground rules"],"The polite stage.");
S_("c10a",2,"A project team has agreed on ground rules, shares responsibility and members respect each other's contributions. Which stage?",["Norming","Storming","Forming","Adjourning"],"Norming.");
S_("c10a",2,"A team works confidently with little direction from its manager and delivers great results. Which stage?",["Performing","Norming","Forming","Storming"],"Self-directed = performing.");
S_("c10a",2,"A performing team gets three new members and a new task, and arguments about roles return. What happened?",["The team slid back to an earlier stage, because the stages are not linear","The team reached adjourning","The team skipped norming forever","Nothing: Tuckman's stages can't repeat"],"New members or tasks can cause regression.");
S_("c10a",2,"A shift toward hybrid work leads a company to add remote specialists to a team. The leader notices uncertainty about roles and expectations, then schedules sessions that help members rebuild shared working agreements. Which two stages best match?",["Storming after adding members, followed by norming as shared agreements develop","Performing after adding members, followed by storming as expectations become clear","Norming after adding members, followed by adjourning","Forming after adding members, followed by norming as expectations become clear"],"Role uncertainty = storming; rebuilding agreements = norming.");
S_("c10a",3,"According to the course, why are diverse teams often better at decision making?",["They focus more on facts, re-examine them and are less prone to groupthink","They agree faster","They avoid all conflict","They need no leader"],"Rock & Grant (2016).");
S_("c10a",3,"The project ends, the team celebrates and members return to their departments. Which stage?",["Adjourning","Performing","Forming","Norming"],"Disbanding.");
S_("c10a",3,"Which statement about team diversity is supported by the McKinsey data in the book?",["Companies in the top quartile for ethnic diversity in management were 35% more likely to beat their industry's financial returns","Diverse teams always perform worse","Gender diversity has no link with returns","Diversity matters only in the public sector"],"35% (ethnic) and 15% (gender).");

/* ---- c10b Social networks ---- */
S_("c10b",1,"A social network is:",["A patterned set of relationships between two or more people (actors)","Only an online platform like LinkedIn","An organization chart","A formal team"],"Drawn as a sociogram.");
S_("c10b",1,"Which three advantages do networks give leaders?",["Access to information and knowledge, access to diverse skill sets, and power","Higher pay, more holidays, a bigger office","Less work, fewer meetings, no conflict","Formal authority, coercion, rewards"],"Course slide.");
S_("c10b",1,"Ibarra recommends building which three types of networks?",["Operational, personal, strategic","Formal, informal, virtual","Strong, weak, bridging","Local, regional, global"],"Ibarra (2007).");
S_("c10b",1,"The principle of similarity states that:",["Ties develop spontaneously between people with common backgrounds, values and interests","You trade favours of equal value","Different people give more value","Networks are always formal"],"Like attracts like.");
S_("c10b",1,"Weak ties are:",["Ties between people who know each other, at least by reputation, but don't exchange resources regularly","Ties between close friends","Ties that never give information","Formal reporting lines"],"Granovetter: weak ties help you find jobs.");
S_("c10b",2,"Two colleagues regularly trade favours of about equal value: 'I helped you with the report, you help me with the slides.' Which principle?",["Reciprocity","Exchange","Similarity","Centrality"],"Equal trading = reciprocity.");
S_("c10b",2,"An engineer partners with a marketer because their very different skills complement each other. Which principle is at work?",["Exchange","Similarity","Reciprocity","Density"],"Value from difference = exchange.");

 {u:"c6c",q:"Using VRIO, what do Brickly's design skills give the company today?",o:["Competitive parity, because competitors now have similar designers"+T6,"Sustained competitive advantage, because the designs win awards"+T6,"Unused competitive advantage, because Brickly isn't organized"+T6,"Temporary competitive advantage that will last many years"+T6,"Competitive disadvantage, because the designs are not valuable"+T6,"Synergy, because design and sales work together"+T6],x:"Valuable, but no longer rare: competitors hired similar designers and sell look-alike sets → parity."},

{id:"k11a", ch:11, title:"Rijnstad Hospital", text:[
 "Rijnstad Hospital still records patient information on paper. Nurses spend about 40 minutes per shift searching for files, and last year two medication errors were traced back to missing paperwork. A new national regulation requires all hospitals to use digital patient records by 2028.",
 "The new director, Dr. Hendriks, opens the yearly staff meeting by showing the error reports, the time lost per shift, and a comparison with three hospitals that already went digital. She explains that the hospital could lose its accreditation if nothing changes.",
 "She then asks a respected senior nurse, the head of IT, two doctors and a patient representative to lead the project together. This group writes a short statement: “Every patient's full story, safe and available in seconds.” They invite all departments to send volunteers, and more than 120 staff sign up as ‘digital champions’.",
 "During the rollout, some doctors keep using paper and complain loudly in meetings, encouraging colleagues to do the same. Several older nurses say nothing but feel stressed, and two quietly apply for jobs elsewhere. Most administrative staff use the system as required, without much enthusiasm.",
 "The hospital removes the old paper order forms and gives each ward two extra training days. After three months, the pilot ward reports that search time has fallen from 40 to 5 minutes, which is shared in the hospital newsletter. Finally, digital record-keeping is added to every job description and to the yearly performance review."],
 qs:[
 {u:"c11d",q:"Which Kotter step is represented by Dr. Hendriks presenting the error reports, lost time, other hospitals' results and the accreditation risk?",o:["Create urgency"+T11,"Form a strategic vision and initiatives"+T11,"Build a guiding coalition"+T11,"Generate short-term wins"+T11,"Institute change"+T11,"Enable action by removing barriers"+T11],x:"Showing the problem and the consequences of doing nothing = create urgency."},
 {u:"c11d",q:"Which part of the case most clearly represents Kotter's guiding coalition?",o:["The senior nurse, head of IT, two doctors and patient representative who lead the project","The 120 ‘digital champions’ who signed up from all departments","The statement “Every patient's full story, safe and available in seconds”","The pilot ward's drop in search time from 40 to 5 minutes","The national regulation requiring digital records by 2028","Adding digital record-keeping to job descriptions and reviews"],x:"Small, influential group LEADING the change. The 120 champions are the volunteer army, the statement is the vision, the pilot a short-term win, job descriptions = institute change."},
 {u:"c11c",q:"Which combination correctly classifies the reactions of the doctors and of the older nurses?",o:["Doctors: active resistance · Nurses: passive resistance","Doctors: passive resistance · Nurses: active resistance","Doctors: active resistance · Nurses: compliance","Doctors: compliance · Nurses: passive resistance","Doctors: enthusiastic support · Nurses: compliance","Doctors: active resistance · Nurses: enthusiastic support"],x:"Loud and recruiting others = active; silent, stressed, quietly leaving = passive."},
 {u:"c11d",q:"Adding digital record-keeping to every job description and review belongs to which Lewin stage and Kotter step?",o:["Refreeze · Institute change","Unfreeze · Create urgency","Change · Generate short-term wins","Refreeze · Enable action by removing barriers","Change · Sustain acceleration","Unfreeze · Enlist a volunteer army"],x:"Making the new behaviour permanent = refreeze and Kotter 8."}
 ]},
{id:"k11b", ch:11, title:"Vesta Insurance", text:[
 "Vesta Insurance is known for slow, rule-heavy service. Customer complaints have doubled in two years while digital competitors win young customers. The board replaces the CEO with Sara Okafor, who previously led a fintech start-up.",
 "In a town-hall meeting, Okafor tells all staff that at current trends Vesta will lose a third of its customers within three years. She replaces two senior directors who openly blocked earlier reforms. She personally spends one day a month answering customer calls and asks every manager to do the same.",
 "All employees follow a customer-empathy training. Sales staff move from commission per policy sold to a fixed salary plus a bonus based on customer satisfaction. In front of all staff, Okafor shreds the 600-page claims manual and replaces it with a 40-page guide; the story spreads quickly through the company.",
 "Some long-serving managers, who used to approve every claim personally, resist the new guide because front-line staff can now approve small claims themselves."],
 qs:[
 {u:"c11e",q:"Okafor personally answering customer calls every month best represents which step of Schein's culture change process?",o:["Role modeling"+T11,"Training"+T11,"Changing the reward system"+T11,"Creating a sense of urgency"+T11,"Creating new symbols and stories"+T11,"Changing leaders and other key players"+T11],x:"The leader shows the behaviour she expects."},
 {u:"c11e",q:"Shredding the 600-page manual in front of all staff best represents:",o:["Creating new symbols and stories","Changing the reward system","Training","Changing leaders and other key players","Enable action by removing barriers (Kotter)","Compliance"],x:"A dramatic, visible act that becomes a story. The question is about Schein, so stay in that model."},
 {u:"c11e",q:"Which combination correctly classifies (1) the town-hall warning and (2) replacing the two directors?",o:["(1) Creating a sense of urgency · (2) Changing leaders and other key players","(1) Role modeling · (2) Changing leaders and other key players","(1) Creating a sense of urgency · (2) Changing the reward system","(1) Training · (2) Creating new symbols and stories","(1) Creating new symbols and stories · (2) Role modeling","(1) Changing the reward system · (2) Creating a sense of urgency"],x:"Warning about losing customers = urgency; removing blockers = changing key players."},
 {u:"c11c",q:"Why do the long-serving managers most likely resist the new guide?",o:["Perceived loss of power","Disrupted habits","Fear of failure","Personality","Prevalence of change","Feelings of uncertainty"],x:"They used to approve every claim; now front-line staff can. Their authority shrinks."}
 ]},
{id:"k11c", ch:11, title:"GreenGrid Energy", text:[
 "GreenGrid is a Dutch energy supplier. Its customer service runs on a 20-year-old system, and in the last two years the company has reorganized its structure three times. When management announces a new customer platform, many employees sigh: “Here we go again.”",
 "Management first explains why the change is needed: complaints have tripled and a new competitor offers instant online service. Team leaders who are respected by their colleagues are trained first so they can answer questions. Employees join workshops to help design the new screens, and everyone gets two days of hands-on training.",
 "During the rollout, the project is split into four phases, and after each phase the time to solve a customer question is shown on screens in the office. A department that kept using the old workaround forms has them removed.",
 "When the platform is fully running, management shares that customer satisfaction rose 18%, and the employees who helped colleagues most are thanked by name at the annual meeting.",
 "Senior call agents, who know every trick of the old system, worry they will no longer be the experts people turn to."],
 qs:[
 {u:"c11c",q:"Employees sighing “Here we go again” after three reorganizations in two years best reflects which reason for resistance?",o:["Prevalence of change","Disrupted habits","Personality","Perceived loss of power","Personal impact of change","Feelings of uncertainty"],x:"Too many changes in a short time → fatigue and skepticism."},
 {u:"c11d",q:"Training respected team leaders first, workshops where employees help design the screens and two days of training all belong to which Lewin stage?",o:["Unfreeze"+T11,"Change (move)"+T11,"Refreeze"+T11,"Institute change (Kotter 8)"+T11,"Sustain acceleration (Kotter 7)"+T11,"Learning organization"+T11],x:"Coalition of opinion leaders, participation and support before the change = unfreeze."},
 {u:"c11d",q:"Which combination correctly classifies (1) sharing the 18% satisfaction rise and (2) thanking helpful employees by name?",o:["(1) Publicize success · (2) Reward change adoption, both refreezing","(1) Create small wins · (2) Eliminate obstacles, both changing","(1) Develop urgency · (2) Build a coalition, both unfreezing","(1) Publicize success · (2) Provide emotional support, both unfreezing","(1) Reward change adoption · (2) Publicize success, both changing","(1) Communicate a vision · (2) Allow participation, both refreezing"],x:"After implementation: share results and reward adoption = refreeze."},
 {u:"c11c",q:"Why do the senior call agents most likely worry about the change?",o:["Fear of failure, because they doubt their expertise will still count in the new system","Prevalence of change, because of the earlier reorganizations","Personal impact, because they get nicer offices","Disrupted habits only, because they drive to work differently","Enthusiastic support, because they like new tools","Compliance, because they go along without enthusiasm"],x:"Experts unsure whether their success will last under the new system = fear of failure."}
 ]},
{id:"k11d", ch:11, title:"Polder Print", text:[
 "Polder Print is a large printing company that wants to become more innovative. Ideas from employees currently need approval from five management layers, and most ideas never get past the second layer. Each department competes for its own budget and rarely shares information with others.",
 "The new innovation director first identifies twenty employees from different departments who are curious, comfortable with uncertainty and full of ideas. She then defines what the group should achieve and how its goals fit Polder Print's mission and five-year strategy, with clear deadlines.",
 "Next, top management agrees to sponsor the group, gives it a budget, and sets rules for how ideas are shared and decided on. Finally, the group agrees how members will be recognized for their contributions and how progress will be tracked.",
 "Polder Print also lets employees spend 10% of their week on their own projects and invites customers to an annual co-design day."],
 qs:[
 {u:"c11a",q:"The five approval layers and departments competing for their own budgets mainly illustrate which two reasons for failure to innovate?",o:["Poor organizational structure and processes, and lack of internal communication","Fear of taking risks, and failure to scale","Lack of market orientation, and wrong decisions","Low priority for innovation, and lack of market orientation","Failure to scale, and poor structure and processes","Wrong decisions, and fear of taking risks"],x:"Slow, layered processes = poor structure and processes; isolated, competing departments = lack of internal communication."},
 {u:"c11b",q:"Defining what the group should achieve and how its goals fit the mission and strategy, with deadlines, is which innovation network step?",o:["Set boundaries and engage"+T11,"Connect"+T11,"Support and govern"+T11,"Manage and track"+T11,"Create urgency (Kotter)"+T11,"Unfreeze (Lewin)"+T11],x:"Step 2: goals, link to strategy, mission and vision, time frames."},
 {u:"c11a",q:"Which combination correctly classifies the two practices in the last paragraph?",o:["10% own-project time: innovation time · Customer co-design day: open lab for co-creation","10% own-project time: internal collaboration · Customer co-design day: acquisition","10% own-project time: intrapreneurship spin-off · Customer co-design day: internal collaboration","10% own-project time: innovation time · Customer co-design day: failure to scale","10% own-project time: open lab · Customer co-design day: innovation time","10% own-project time: partnership · Customer co-design day: market orientation failure"],x:"Free time for own projects = innovation time; customers helping design = co-creation."}
 ]}
];

 part of normal operations; this interpretation identifies the stage concerned with creating readiness before new behavior is introduced.", "Installing robots across every production line after the pilot has demonstrated stable results; this interpretation identifies the stage concerned with creating readiness before new behavior is introduced.", "Rewarding employees who consistently use the finalized robotic assembly procedures correctly; this interpretation identifies the stage concerned with creating readiness before new behavior is introduced."], "a": 1, "x": "Unfreezing creates readiness: showing the competitive threat and why the current way can't continue.", "skip": 0}, {"n": 20, "sec": "Long case · HarborTech Manufacturing (Ch 11)", "cs": 2, "q": "Employees who openly organize protests against the robots are demonstrating which reaction to change?", "o": ["Enthusiastic support because they publicly promote the new technology and encourage participation; this classification explains the visibility and intensity of employees' response to the proposed organizational change.", "Compliance because they follow instructions despite having personal doubts about the technology; this classification explains the visibility and intensity of employees' response to the proposed organizational change.", "Passive acceptance because they privately support the change without becoming actively involved; this classification explains the visibility and intensity of employees' response to the proposed organizational change.", "Passive resistance because they quietly delay work while avoiding any visible opposition; this classification explains the visibility and intensity of employees' response to the proposed organizational change.", "Commitment because they personally invest effort in ensuring the change succeeds over time; this classification explains the visibility and intensity of employees' response to the proposed organizational change.", "Active resistance because they openly challenge and organize opposition to the planned change; this classification explains the visibility and intensity of employees' response to the proposed organizational change."], "a": 5, "x": "Open, visible and organized opposition = active resistance.", "skip": 0}, {"n": 21, "sec": "Long case · HarborTech Manufacturing (Ch 11)", "cs": 2, "q": "Which option best explains a practice associated with an innovative culture at HarborTech?", "o": ["Restricting improvement ideas to senior managers with formal authority over manufacturing decisions; this interpretation shows how leadership practices can encourage responsible experimentation and organizational learning.", "Punishing unsuccessful experiments even when teams follow agreed learning and safety procedures; this interpretation shows how leadership practices can encourage responsible experimentation and organizational learning.", "Evaluating employees only on short-term output and excluding learning from performance discussions; this interpretation shows how leadership practices can encourage responsible experimentation and organizational learning.", "Preventing cross-functional communication so departments can protect their specialized operational knowledge; this interpretation shows how leadership practices can encourage responsible experimentation and organizational learning.", "Requiring teams to preserve existing methods until competitors have proven every new technology; this interpretation shows how leadership practices can encourage responsible experimentation and organizational learning.", "Supporting safe experiments, sharing lessons, and recognizing employees who propose responsible improvements; this interpretation shows how leadership practices can encourage responsible experimentation and organizational learning"], "a": 5, "x": "Innovative cultures support safe experiments, share lessons and reward responsible ideas instead of punishing failure.", "skip": 0}]}, {"name": "Mock set 3", "qs": [{"n": 1, "sec": "Multiple choice", "cs": -1, "q": "Which statement best reflects the view that management is “the art of getting things done through the efforts of other people”?", "o": ["Managers contribute mainly by creating formal rules and procedures.", "Managers should personally complete the organization's most important tasks.", "Managers are responsible only for measuring employee performance.", "Managers achieve objectives by coordinating and supporting the work of others."], "a": 3, "x": "Management = reaching goals through other people, so coordinating and supporting their work.", "skip": 0}, {"n": 2, "sec": "Multiple choice", "cs": -1, "q": "Which function of management focuses on defining goals and determining how to achieve them?", "o": ["Planning", "Organizing", "Controlling", "Leading"], "a": 0, "x": "Planning = setting goals and deciding how to reach them.", "skip": 0}, {"n": 3, "sec": "Multiple choice", "cs": -1, "q": "A manager redesigns the department by grouping related tasks and assigning responsibility for each group to a team leader. Which management function does this best illustrate?", "o": ["Leading", "Organizing", "Controlling", "Forecasting"], "a": 1, "x": "Grouping tasks and assigning responsibility = designing structure, so organizing.", "skip": 0}, {"n": 4, "sec": "Multiple choice", "cs": -1, "q": "A manager studies customer complaints and industry reports to identify developments that may affect the organization. Which Mintzberg managerial role is illustrated?", "o": ["Negotiator", "Monitor", "Leader", "Resource allocator"], "a": 1, "x": "Studying complaints, reports and trends = collecting information, so the monitor role (informational).", "skip": 0}, {"n": 5, "sec": "Multiple choice", "cs": -1, "q": "What is organizational commitment?", "o": ["Our pay level", "A job task list", "Compliance with organizational rules and policies", "Emotional attachment to the company"], "a": 3, "x": "Organizational commitment = the emotional attachment people have to the company they work for.", "skip": 0}, {"n": 6, "sec": "Multiple choice", "cs": -1, "q": "Which is a key job attitude at work?", "o": ["Job satisfaction", "Charisma", "Personality", "Job characteristics"], "a": 0, "x": "The two key work attitudes are job satisfaction and organizational commitment. Personality and charisma are traits; job characteristics are causes of attitudes.", "skip": 0}, {"n": 7, "sec": "Multiple choice", "cs": -1, "q": "What does an attitude refer to?", "o": ["Our pay and benefits", "A plan we make", "A learned ability to perform a task", "Our opinions, beliefs, and feelings about our environment"], "a": 3, "x": "An attitude = our opinions, beliefs and feelings about aspects of our environment.", "skip": 0}, {"n": 8, "sec": "Multiple choice", "cs": -1, "q": "An employee consistently prepares carefully, meets deadlines, and follows through on commitments. What work attitude is predominant?", "o": ["Organizational Commitment", "Extraversion", "Openness to experience", "Agreeableness"], "a": 0, "x": "Careful, punctual and reliable is the trait conscientiousness, which is not an option here. The question asks for a work attitude, and organizational commitment is the only work attitude listed; the other three are Big Five traits. Read 'attitude' versus 'trait' carefully.", "skip": 0}, {"n": 9, "sec": "Multiple choice", "cs": -1, "q": "Two employees heard the same announcement. One interprets it as an opportunity, while the other interprets it as a threat because of previous experiences. Which communication barrier best explains the difference?", "o": ["Formalization", "Channel expansion", "Upward communication", "Selective perception"], "a": 3, "x": "Interpreting the same message differently because of your own experiences and expectations = selective perception.", "skip": 0}, {"n": 10, "sec": "Multiple choice", "cs": -1, "q": "Which decision-making model aims for a “satisfactory” outcome?", "o": ["Intuitive", "Creative", "Rational", "Bounded rationality"], "a": 3, "x": "Bounded rationality leads to satisficing: choosing the first alternative that meets your minimum criteria.", "skip": 0}, {"n": 11, "sec": "Multiple choice", "cs": -1, "q": "Which is a nonverbal communication cue?", "o": ["Text", "Phone call", "Facial expressions", "Memo"], "a": 2, "x": "Facial expressions are nonverbal. Memos, texts and phone calls use words (verbal or written).", "skip": 0}, {"n": 12, "sec": "Multiple choice", "cs": -1, "q": "Which is a component of the communication process?", "o": ["Filtering", "Strategic decision", "Message", "Creativity"], "a": 2, "x": "The message is part of the process (sender, message, channel, receiver, noise, feedback). Filtering is a barrier.", "skip": 0}, {"n": 13, "sec": "Multiple choice", "cs": -1, "q": "A restaurant automatically reorders a standard quantity of ingredients whenever inventory reaches a predetermined level. What type of decision is this?", "o": ["Creative decision", "Strategic decision", "Nonprogrammed decision", "Programmed decision"], "a": 3, "x": "A routine, recurring decision handled by a fixed rule = programmed decision.", "skip": 0}, {"n": 14, "sec": "Multiple choice", "cs": -1, "q": "What is a goal?", "o": ["A time-based measurable action", "A company's mission statement", "An outcome statement of what to accomplish", "A detailed strategy plan"], "a": 2, "x": "A goal is an outcome statement of what you want to accomplish. An objective is the precise, time-based, measurable action.", "skip": 0}, {"n": 15, "sec": "Multiple choice", "cs": -1, "q": "What does Management by Objectives (MBO) aim to do?", "o": ["Define the company mission and vision", "Align subordinate objectives with overall goals", "Translate mission into measures", "Report on social and environmental results"], "a": 1, "x": "MBO (Drucker) aligns employees' objectives with the organization's overall goals.", "skip": 0}, {"n": 16, "sec": "Multiple choice", "cs": -1, "q": "What does the Balanced Scorecard do?", "o": ["Lists only financial targets for the year", "Sets individual pay levels", "Turns mission and strategy into measurable goals and tracks them", "Describes values for employee behavior"], "a": 2, "x": "It translates mission and strategy into measurable goals in four perspectives and tracks them.", "skip": 0}, {"n": 17, "sec": "Multiple choice", "cs": -1, "q": "An employee believes that she contributes more effort than a colleague but receives the same reward. She responds by reducing her effort. Which motivation theory best explains her response?", "o": ["Reinforcement theory", "ERG theory", "Equity theory", "Maslow's hierarchy of needs"], "a": 2, "x": "Comparing your effort/reward ratio with a colleague and restoring fairness by working less = equity theory.", "skip": 0}, {"n": 18, "sec": "Multiple choice", "cs": -1, "q": "What is an objective?", "o": ["A precise, time-based, measurable action", "A broad vision of success", "A long-term goal that defines direction of the organization", "A general outcome statement"], "a": 0, "x": "An objective is precise, time-based and measurable. The broad outcome statement is a goal.", "skip": 0}, {"n": 19, "sec": "Multiple choice", "cs": -1, "q": "A national culture strongly values cooperation, quality of life, and concern for others rather than competition and visible achievement. In Hofstede’s framework, this culture is relatively:", "o": ["Feminine", "High in uncertainty avoidance", "Masculine", "High in power distance"], "a": 0, "x": "Valuing cooperation and quality of life over competition and achievement = a feminine culture (low masculinity).", "skip": 0}, {"n": 20, "sec": "Multiple choice", "cs": -1, "q": "According to Hofstede’s Cultural Framework, what is meant by “uncertainty avoidance”?", "o": ["The preference for long-term planning and perseverance over short-term outcomes.", "Trade between regions.", "The preference for local markets.", "The degree to which people in a society feel comfortable with risk and ambiguity."], "a": 3, "x": "Uncertainty avoidance = how comfortable people in a society are with risk and ambiguity.", "skip": 0}, {"n": 21, "sec": "Multiple choice", "cs": -1, "q": "What is “power distance” in Hofstede’s model?", "o": ["Acceptance of power and authority differences", "Preference for collective interests over individual ones", "Focus on risk and uncertainty", "Value of work and earnings"], "a": 0, "x": "Power distance = how much people accept unequal distribution of power and authority.", "skip": 0}, {"n": 22, "sec": "Multiple choice", "cs": -1, "q": "A culture emphasizes persistence, future rewards, and future investment rather than immediate results. Which Hofstede dimension does this describe?", "o": ["Long-term orientation", "Power distance", "Masculinity", "Individualism"], "a": 0, "x": "Persistence and future rewards over immediate results = long-term orientation.", "skip": 0}, {"n": 23, "sec": "Mini cases", "cs": -1, "q": "Employees accept a newly appointed director’s instructions because the director has formal authority over the department. Which source of power is being used?", "o": ["Legitimate power", "Coercive power", "Expert power", "Referent power"], "a": 0, "x": "Following instructions because of formal authority = legitimate power.", "skip": 0}, {"n": 24, "sec": "Mini cases", "cs": -1, "q": "A design manager notices that senior employees dominate meetings while younger colleagues and employees with disabilities rarely contribute. She introduces structured speaking turns, asks quieter members for input, and uses their suggestions to improve product accessibility. Team members increasingly respect her commitment to inclusion. Which description best explains the manager’s approach and influence?", "o": ["Task-oriented leadership and coercive power based on targets and possible sanctions", "Laissez-faire leadership and legitimate power based on independence and formal position", "People-oriented leadership and referent power based on inclusion and earned respect", "Autocratic leadership and reward power based on centralized decisions and incentives"], "a": 2, "x": "Drawing out quieter members and including them = people-oriented. The respect she earns from that = referent power.", "skip": 0}, {"n": 25, "sec": "Mini cases", "cs": -1, "q": "A company enters a country where unofficial payments are commonly used to speed up permits. Although competitors follow this practice, the regional director refuses to authorize such payments. She openly explains that the company’s anti-corruption principles apply in every market, even if expansion becomes slower. Which pair of leadership approaches is demonstrated by the director?", "o": ["Servant and transformational leadership emphasizing employee development and organizational vision", "Transactional and charismatic leadership emphasizing exchange and personal influence", "Laissez-faire and autocratic leadership emphasizing independence and centralized authority", "Ethical and authentic leadership emphasizing integrity and consistency with stated principles"], "a": 3, "x": "Refusing bribes even at a cost = ethical leadership. Openly acting consistently with stated principles in every market = authentic leadership.", "skip": 0}, {"n": 26, "sec": "Mini cases", "cs": -1, "q": "A manager discovers that a highly profitable supplier uses unsafe working conditions. She ends the contract despite the short-term financial cost because the supplier’s conduct conflicts with the organization’s stated principles. What most clearly guides her decision?", "o": ["Coercive leadership", "Laissez-faire leadership", "Values-based leadership", "Management by exception"], "a": 2, "x": "Ending the contract because it conflicts with the organization's stated principles = values-based leadership.", "skip": 0}, {"n": 27, "sec": "Mini cases", "cs": -1, "q": "An electronics company creates teams to design energy-efficient products for customers with different physical abilities. Engineers remain members of specialist departments but also report to product managers. Each team includes employees with varied professional, cultural, and personal backgrounds. Which combination of organizational concepts appears in the case?", "o": ["Functional structure with specialization and a professionally uniform product team", "Geographic structure with regional authority and a culturally uniform product team", "Virtual structure with remote coordination and a geographically uniform product team", "Matrix structure with dual reporting and a professionally diverse product team"], "a": 3, "x": "Reporting to a specialist department and a product manager at once = matrix (dual reporting). Varied backgrounds = a diverse team.", "skip": 0}, {"n": 28, "sec": "Mini cases", "cs": -1, "q": "A food company operates in regions facing different climate risks and environmental rules. It reorganizes its operations into geographic divisions so that the managers can adapt sourcing, products, and sustainability practices to local conditions. Which interpretation best explains the organizational change?", "o": ["Internal technological pressures encourage a matrix structure tailored to temporary projects", "Internal cultural pressures encourage a functional structure tailored to specialist occupations", "External competitive pressures encourage a divisional structure tailored to separate product lines", "External natural and legal pressures encourage a geographic structure tailored to regional conditions"], "a": 3, "x": "Climate risks (natural) and environmental rules (legal) are external pressures; reorganizing by region = geographic structure.", "skip": 0}, {"n": 29, "sec": "Mini cases", "cs": -1, "q": "A travel company plans sustainable services for a rapidly growing international market. Its project team includes members with different cultural backgrounds and professional expertise. The team also consults local community leaders, environmental experts, and industry partners to understand emerging expectations and opportunities. Which interpretation best explains the factors strengthening the response?", "o": ["Team diversity broadens market insight, while strategic networking identifies future trends and opportunities", "Centralized expertise broadens international insight, while closed networking identifies future partnership opportunities", "Cultural similarity broadens sustainability insight, while personal networking identifies future regulatory developments", "Professional similarity broadens customer insight, while operational networking identifies future market developments"], "a": 0, "x": "Diverse members broaden insight; consulting outside leaders and experts about future trends = strategic networking.", "skip": 0}, {"n": 30, "sec": "Mini cases", "cs": -1, "q": "A shift toward hybrid work leads a company to add remote specialists from several countries to an established product team. The team leader notices uncertainty about roles, technology, and meeting expectations. She schedules orientation sessions and helps members rebuild shared working agreements. Which two team-development stages best match the change described?", "o": ["Storming after adding members, followed by performing after the first orientation session", "Norming after adding members, followed by adjourning after agreements are established", "Performing after adding members, followed by storming as role expectations become clear", "Forming after adding members, followed by norming as shared agreements develop"], "a": 3, "x": "New members restart the team at forming (uncertainty about roles); rebuilding shared working agreements = norming.", "skip": 0}, {"n": 31, "sec": "Long case · FreshLoop Packaging (Ch 6)", "cs": 3, "q": "Which option correctly classifies FreshLoop’s focus on durability, convenience, and patented freshness technology?", "o": ["Retrenchment based on reducing services, closing collection points, and limiting customer availability; this classification explains the basis on which the company intends to compete in its market.", "Unrelated diversification based on entering industries with no connection to reusable food packaging; this classification explains the basis on which the company intends to compete in its market.", "Differentiation based on distinctive durability, convenience, and food-preservation benefits for customers; this classification explains the basis on which the company intends to compete in its market", "Vertical divestment based on selling the patented technology and outsourcing every customer interaction; this classification explains the basis on which the company intends to compete in its market.", "Cost leadership based on offering standardized containers at the lowest possible market price; this classification explains the basis on which the company intends to compete in its market.", "Market withdrawal based on leaving existing customers and ending all deposit-return activities; this classification explains the basis on which the company intends to compete in its market."], "a": 2, "x": "Competing on unique durability, convenience and patented technology = differentiation.", "skip": 0}, {"n": 32, "sec": "Long case · FreshLoop Packaging (Ch 6)", "cs": 3, "q": "How should FreshLoop’s shift from retailer subscriptions to deposit-return services be classified?", "o": ["An intended strategy because it was fully planned before the customer pilots began; this classification explains how experience changed the strategy that the organization actually followed", "A corporate mission because it defines the organization's fundamental purpose and principal stakeholders; this classification explains how experience changed the strategy that the organization actually followed.", "A realized strategy because it emerged from experience and differed from the original plan; this classification explains how experience changed the strategy that the organization actually followed", "A stakeholder map because it classifies external groups according to power and interest; this classification explains how experience changed the strategy that the organization actually followed.", "A functional strategy because it concerns only one department's routine operational responsibilities; this classification explains how experience changed the strategy that the organization actually followed.", "A vision statement because it describes the company's preferred position in the distant future; this classification explains how experience changed the strategy that the organization actually followed."], "a": 2, "x": "The pattern that emerged from the pilots and differed from the original plan = realized (emergent) strategy.", "skip": 0}, {"n": 33, "sec": "Long case · FreshLoop Packaging (Ch 6)", "cs": 3, "q": "Which value-chain activity is most directly represented by FreshLoop’s collection points and cleaning hubs?", "o": ["Firm infrastructure involving governance, financial control, legal support, and strategic planning processes; this interpretation shows where the activity contributes directly or indirectly to customer value.", "Operations involving the collection, cleaning, preparation, and recirculation of reusable containers; this interpretation shows where the activity contributes directly or indirectly to customer value", "Human-resource management involving recruitment, training, compensation, and development of company employees; this interpretation shows where the activity contributes directly or indirectly to customer value.", "Marketing and sales involving customer communication, pricing, promotion, and contract development; this interpretation shows where the activity contributes directly or indirectly to customer value.", "Technology development involving research, product design, and improvement of the patented sealing system; this interpretation shows where the activity contributes directly or indirectly to customer value.", "Procurement involving the selection and purchase of raw materials from approved external suppliers; this interpretation shows where the activity contributes directly or indirectly to customer value."], "a": 1, "x": "Collecting, cleaning and recirculating containers directly produces the service = operations, a primary activity.", "skip": 0}, {"n": 34, "sec": "Long case · GreenCity Permits (Ch 11)", "cs": 4, "q": "Which Kotter step is represented by presenting waiting-time data and citizen complaints?", "o": ["Building a coalition by selecting influential people who can guide the change together; this classification identifies the early change step that challenges complacency and establishes a reason for action.", "Enlisting volunteers by encouraging a broad group of employees to support implementation; this classification identifies the early change step that challenges complacency and establishes a reason for action.", "Forming a vision by describing the desired future of accessible municipal permit services; this classification identifies the early change step that challenges complacency and establishes a reason for action.", "Generating short-term wins by showing measurable improvement from a limited pilot project; this classification identifies the early change step that challenges complacency and establishes a reason for action.", "Creating urgency by demonstrating why maintaining the current permit process is unacceptable; this classification identifies the early change step that challenges complacency and establishes a reason for action.", "Anchoring change by embedding the portal in recruitment, training, and organizational culture; this classification identifies the early change step that challenges complacency and establishes a reason for action."], "a": 4, "x": "Using data and complaints to show the current situation is unacceptable = creating a sense of urgency (Kotter step 1).", "skip": 0}, {"n": 35, "sec": "Long case · GreenCity Permits (Ch 11)", "cs": 4, "q": "Which part of the c
