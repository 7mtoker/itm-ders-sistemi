<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ITM Exam Lab (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a management casebook. Sticky header with exam countdown + topic rail; plan, mock room, long-case room and topic benches below. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E3E8F0; --ink:#121A26; --muted:#566275; --line:#D3DAE5; --rule:#DDE3EC;
  --accent:#2440D8; --accent-ink:#FFFFFF; --accent-soft:#DDE3FF;
  --marker:#FFD84A; --marker-ink:#2A2200;
  --good:#167A4D; --good-soft:#D7F2E4; --bad:#B8362F; --bad-soft:#FBE0DE; --warn:#9A6400; --warn-soft:#F6E9C8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --sunk:#1D2533; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3546; --rule:#232C3B;
  --accent:#8196FF; --accent-ink:#0E131B; --accent-soft:#232E55; --marker:#E9C53A; --marker-ink:#1E1800;
  --good:#4CC48B; --good-soft:#163527; --bad:#F2766D; --bad-soft:#3D1D1B; --warn:#E3B34F; --warn-soft:#3A2D10; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --sunk:#1D2533; --ink:#E7ECF3; --muted:#9AA6B8; --line:#2B3546; --rule:#232C3B;
  --accent:#8196FF; --accent-ink:#0E131B; --accent-soft:#232E55; --marker:#E9C53A; --marker-ink:#1E1800;
  --good:#4CC48B; --good-soft:#163527; --bad:#F2766D; --bad-soft:#3D1D1B; --warn:#E3B34F; --warn-soft:#3A2D10; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
mark{background:var(--marker);color:var(--marker-ink);padding:0 .2em;border-radius:3px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:0}
.topbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.brand h1{font-size:25px;font-weight:800;letter-spacing:-.02em}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px}
.pill b{font-family:var(--f-mono);background:var(--marker);color:var(--marker-ink);border-radius:999px;min-width:30px;height:26px;display:grid;place-items:center;padding:0 8px;font-variant-numeric:tabular-nums}
.pill.soft{background:var(--surface);color:var(--muted);border:1px solid var(--line);padding:4px 12px}
.pill.soft b{background:var(--sunk);color:var(--ink);height:22px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:var(--good)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin;align-items:stretch}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;text-align:left;font-size:14px;display:flex;flex-direction:column;justify-content:center}
.chip small{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent-ink)}
.chip.main{font-weight:700;justify-content:center}
.chip.main.mock{border-color:var(--ink);border-style:dashed}
.chgap{flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 2px 0 8px;border-left:1px solid var(--line);margin-left:4px}
.st-study{background:var(--bad)}.st-prove{background:var(--warn)}.st-done{background:var(--good)}.st-new{background:var(--line)}

/* common blocks */
.page{padding-top:22px;display:grid;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel h3{font-size:20px;font-weight:800;margin-bottom:4px}
.panel .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:default}
.btn kbd{font-family:var(--f-mono);font-size:11px;opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:var(--surface);white-space:nowrap}
.tag.study{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tag.prove{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.done{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.lvl{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.lvl.l1{color:var(--good);border-color:var(--good)}.lvl.l2{color:var(--warn);border-color:var(--warn)}.lvl.l3{color:var(--bad);border-color:var(--bad)}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:14px;border-left:6px solid var(--marker)}
.hero h2{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.02em;max-width:22ch}
.hero p{margin:0;max-width:64ch;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.fact b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.fact span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* stand + scale */
.stand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{border-radius:12px;padding:14px 16px;background:var(--sunk)}
.stat .eyebrow{font-size:11px}
.stat b{display:block;font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat.tg{background:var(--ink);color:var(--bg)}.stat.tg span,.stat.tg .eyebrow{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.c-good{color:var(--good)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}
@media (max-width:640px){.stand{grid-template-columns:minmax(0,1fr)}}
.scale{position:relative;padding:34px 0 40px}
.track{position:relative;height:18px;border-radius:4px;background:var(--sunk);background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 10%)}
.zone{position:absolute;top:0;bottom:0;left:0;width:22.5%;border-radius:4px 0 0 4px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--muted) 22%,transparent) 0 4px,transparent 4px 8px)}
.zone.pass{left:61.25%;width:13.75%;background:color-mix(in srgb,var(--warn) 18%,transparent);border-radius:0}
.zone.goal{left:75%;width:25%;background:color-mix(in srgb,var(--good) 25%,transparent);border-radius:0 4px 4px 0}
.mk{position:absolute;top:-6px;bottom:-6px;width:3px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.mk span{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 7px;border-radius:5px}
.mk.lo span{bottom:auto;top:calc(100% + 4px)}
.mk.you{background:var(--accent)}.mk.you span{background:var(--accent);color:var(--accent-ink)}
.mk.proj{background:var(--marker)}.mk.proj span{background:var(--marker);color:var(--marker-ink)}
.mk.edgeL span{left:0;transform:none}.mk.edgeR span{left:auto;right:0;transform:none}
.axis{position:absolute;left:0;right:0;bottom:6px;height:16px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.axis i{position:absolute;font-style:normal;transform:translateX(-50%);white-space:nowrap}
.axis i:first-child{transform:none}.axis i:last-child{transform:translateX(-100%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg-guess{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--muted) 30%,transparent) 0 3px,transparent 3px 6px)}
.lg-pass{background:color-mix(in srgb,var(--warn) 30%,transparent)}.lg-goal{background:color-mix(in srgb,var(--good) 40%,transparent)}
@media (max-width:560px){.axis .g{display:none}}

/* chapter bars */
.chbars{display:grid;gap:10px}
.chb{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 84px;gap:12px;align-items:center;font-size:14px}
.chb .t b{display:block;font-size:15px}
.bar{position:relative;height:12px;background:var(--sunk);border-radius:99px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bad)}
.bar i.ok{background:var(--good)}.bar i.mid{background:var(--warn)}
.bar .goal{position:absolute;left:75%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
@media (max-width:640px){.chb{grid-template-columns:minmax(0,1fr) 80px}.chb .bar{grid-column:1/-1;grid-row:2}}

/* plan */
.plan{display:grid;gap:8px;counter-reset:p}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prow::before{counter-increment:p;content:counter(p);font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted);text-align:center}
.prow.done{background:var(--bg)}
.prow .t{font-weight:700}
.prow .meta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px;align-items:center}
@media (max-width:600px){.prow{grid-template-columns:26px minmax(0,1fr)}.prow .btn{grid-column:2;justify-self:start}}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:grid;gap:6px;align-content:start;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h4{font-size:15px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.day button{all:unset;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center;padding:3px 0}
.day button:hover{text-decoration:underline}
.day button:focus-visible{outline:2px solid var(--accent)}
.day .fin{font-size:13px;color:var(--muted)}

/* unit */
.uhead{display:grid;gap:8px}
.uhead h2{font-size:clamp(26px,4.6vw,38px);font-weight:800;letter-spacing:-.02em}
.steps{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto}
.step{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted);flex:none;display:flex;gap:8px;align-items:center}
.step[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step .sc{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.step .sc.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.notes{font-size:16.5px;line-height:1.62;max-width:78ch}
.notes p{margin:6px 0}
.notes h4{font-size:17px;margin:20px 0 6px}
.notes .bl{padding-left:20px;position:relative}
.notes .bl::before{content:"";position:absolute;left:5px;top:.7em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.notes .ar{padding-left:26px;position:relative}
.notes .ar::before{content:"→";position:absolute;left:4px;color:var(--muted);font-family:var(--f-mono)}
.formula{font-family:var(--f-mono);font-size:14.5px;background:var(--sunk);border-left:3px solid var(--ink);padding:9px 14px;margin:10px 0;border-radius:0 8px 8px 0;overflow-x:auto}
.ex{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:15.5px}
.trap{background:var(--warn-soft);border-radius:10px;padding:12px 16px;margin:14px 0 4px;font-size:15.5px}
.trap b:first-child{color:var(--warn)}
table.rules{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0;display:block;overflow-x:auto}
table.rules th,table.rules td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.rules th{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:2px solid var(--ink)}
.tscroll{overflow-x:auto}
.rmsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rmset .sub{margin-bottom:12px}
.ktq{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);margin-bottom:6px}
.ktgrp h4{margin:18px 0 0;display:flex;gap:8px;align-items:center}
.ktg{gap:6px;margin-bottom:12px}
.ktrow[hidden],.ktgrp[hidden]{display:none}
.terms{display:grid;gap:0;margin-top:8px}
.terms div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
.terms b{font-family:var(--f-display)}
@media (max-width:560px){.terms div{grid-template-columns:minmax(0,1fr)}}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.lgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.side{display:grid;gap:10px;position:sticky;top:150px}
@media (max-width:860px){.lgrid,.lgrid.two{grid-template-columns:minmax(0,1fr)}.side{position:static}}

/* flashcards */
.fcwrap{display:grid;gap:14px;max-width:640px;width:100%;margin:0 auto}
.fcard{perspective:1200px;height:260px;border:0;background:none;padding:0;width:100%}
.fin2{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fcard.flip .fin2{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center;overflow:auto}
.face b{font-family:var(--f-display);font-size:clamp(22px,4vw,30px);font-weight:800}
.face.back{transform:rotateY(180deg);background:var(--sunk)}
.face.back p{font-size:17px;margin:0;max-width:44ch}

/* question */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.q .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);margin-bottom:10px;align-items:center}
.stem{font-size:17px;margin:0 0 14px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-size:15.5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:none;width:18px}
.opt[disabled]{cursor:default}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .L{color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .L{color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .L{color:var(--bad)}
.fb{margin-top:14px;border-radius:var(--r);padding:12px 14px;background:var(--sunk);font-size:15px}
.fb b.ok{color:var(--good)}.fb b.no{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.casebox{background:var(--sunk);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.casebox summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center}
.casebox p,.casefull p{margin:10px 0 0;max-width:76ch;font-size:15.5px}
.casefull{background:var(--sunk);border-color:transparent}
.casefull p:first-child{margin-top:0}

/* quiz intro/summary */
.qintro{display:grid;gap:12px}
.rules-list{margin:0;padding-left:20px;display:grid;gap:4px}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px}
.review .q{padding:16px}
.review .stem{font-size:16px}

/* mock room */
.exbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 142px);z-index:4}
.exbar b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.exbar .sp{flex:1}
.exbar button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:5px 12px;font-size:14px;font-weight:700}
.exbar button.go{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.navg{display:grid;gap:6px}
.navrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.navrow .mono{width:56px;font-size:10px;color:var(--muted)}

/* ---------------- Chapter 1 ---------------- */
{id:"c1a", ch:1, pts:4, t:"Management & the P-O-L-C framework",
 notes:`
<p><b>Management</b> = “the art of getting things done through the efforts of other people”. The book's key-term version: creatively solving problems to accomplish organizational goals through the efforts of others.</p>
<h4>The P-O-L-C framework (the four functions)</h4>
<table class="rules"><tr><th>Function</th><th>What it means</th><th>Includes</th></tr>
<tr><td><b>Planning</b></td><td>Setting objectives and deciding the course of action to reach them. Needs environmental scanning, forecasting and good decisions.</td><td>Vision & mission, strategizing, goals & objectives</td></tr>
<tr><td><b>Organizing</b></td><td>Developing an organizational structure and allocating human resources so objectives are reached. Also job design.</td><td>Organization design, culture, social networks</td></tr>
<tr><td><b>Leading</b></td><td>The social and informal sources of influence you use to inspire action by others.</td><td>Leadership, decision making, communication, teams, motivation</td></tr>
<tr><td><b>Controlling</b></td><td>Making sure performance doesn't deviate from standards. Three steps: (1) set performance standards, (2) compare actual performance with the standards, (3) take corrective action when needed.</td><td>Systems & processes, strategic HR</td></tr></table>
<h4>Three levels of planning</h4>
<table class="rules"><tr><th>Level</th><th>Time</th><th>Who</th><th>What</th></tr>
<tr><td>Strategic</td><td>3+ years</td><td>Top management</td><td>Whole organization, mission-driven, competitive positioning (based on SWOT)</td></tr>
<tr><td>Tactical</td><td>1–3 years</td><td>Middle managers</td><td>Concrete means to implement the strategic plan</td></tr>
<tr><td>Operational</td><td>Under 1 year</td><td>Lower managers</td><td>Specific action steps that support the strategic and tactical plans</td></tr></table>
<h4>Leadership, entrepreneurship and strategy</h4>
<p class="bl"><b>Leadership</b>: an act of influence that inspires action by others; the social and informal sources of influence.</p>
<p class="bl"><b>Entrepreneurship</b>: recognizing opportunities (needs, wants, problems) and using or creating resources to implement innovative ideas for new ventures. An <b>intrapreneur</b> does this inside an existing organization.</p>
<p class="bl"><b>Strategy</b>: the central, integrated, externally oriented concept of how an organization will achieve its objectives (Hambrick & Fredrickson).</p>
<h4>Performance</h4>
<p class="bl"><b>Triple bottom line</b>: performance on economic, social and environmental dimensions (profit, people, planet). Linked to <b>CSR</b>: taking responsibility for your impact on customers, employees, communities and the environment beyond what the law requires.</p>
<p class="bl"><b>In-role performance</b>: the productivity and quality your job requires. <b>OCB</b> (organizational citizenship behaviour): voluntary, extra-role behaviour that helps the organization.</p>
<p class="bl"><b>Group performance</b> = the inputs of the group minus <b>process loss</b> (anything in group interaction that hurts problem solving).</p>
<h4>Traditional vs contemporary view</h4>
<p>Traditional: a top-down pyramid. Contemporary: an <b>upside-down pyramid</b> where top managers support and serve other managers and employees (<b>empowerment</b>), who serve the customers. Today's trends: DEI and sustainability.</p>
<div class="trap"><b>Exam traps</b><br>Comparing results with a target and correcting = <b>controlling</b>, not planning.<br>Tactical = 1–3 years and middle management. Operational = under a year.<br>Leading is about <b>informal</b> influence; organizing is about <b>structure</b> and jobs.</div>`,
 terms:[["Management","The art of getting things done through the efforts of other people."],["Planning","Setting objectives and determining a course of action to achieve them."],["Organizing","Developing an organizational structure and allocating human resources to accomplish objectives."],["Leading","The social and informal sources of influence used to inspire action in others."],["Controlling","Ensuring that performance does not deviate from standards."],["Strategic planning","Long-term (3+ years) planning by top management to position the organization."],["Tactical planning","Intermediate (1–3 years) planning to implement the strategic plan."],["Operational planning","Short-term (under 1 year) specific action steps."],["Entrepreneurship","Creating new ventures by recognizing opportunities and innovating."],["Intrapreneur","Someone who is creative and entrepreneurial inside an existing organization."],["Triple bottom line","Performance measured on economic, social and environmental dimensions."],["OCB","Voluntary, extra-role behaviour that benefits the organization."],["Process loss","Any aspect of group interaction that inhibits good problem solving."],["Empowerment","Enabling an individual to think, act and control work and decisions autonomously."]]
},
{id:"c1b", ch:1, pts:4, t:"Managers: Mintzberg's roles & Katz's skills",
 notes:`
<h4>Types of managers</h4>
<table class="rules"><tr><th>Type</th><th>Responsible for</th></tr>
<tr><td>Top manager</td><td>The organization's strategy; steward of vision and mission</td></tr>
<tr><td>Functional manager</td><td>Efficiency and effectiveness of one area (accounting, marketing)</td></tr>
<tr><td>Supervisory / team manager</td><td>Coordinating a subgroup of a function, or a cross-functional team</td></tr>
<tr><td><b>Line manager</b></td><td>A function that contributes <b>directly</b> to the products or services (P&G's Tide product manager)</td></tr>
<tr><td>Staff manager</td><td>A function that creates <b>indirect</b> inputs (finance, accounting)</td></tr>
<tr><td><b>General manager</b></td><td>A clearly identifiable <b>revenue-producing unit</b> (a store, business unit, product line); decides across functions</td></tr>
<tr><td>Project manager</td><td>Planning, executing and closing a project</td></tr></table>
<h4>Mintzberg's 10 managerial roles (3 groups)</h4>
<table class="rules"><tr><th>Group</th><th>Role</th><th>What the manager does</th></tr>
<tr><td rowspan="3"><b>Interpersonal</b></td><td>Figurehead</td><td>Represents the organization in formal and ceremonial matters</td></tr>
<tr><td>Leader</td><td>Relationship with employees: motivating, guiding (important at <b>every</b> level)</td></tr>
<tr><td>Liaison</td><td>Interacts with peers and people <b>outside</b> the unit or organization</td></tr>
<tr><td rowspan="3"><b>Informational</b></td><td>Monitor</td><td>Receives and collects information (reports, complaints, trends)</td></tr>
<tr><td>Disseminator</td><td>Passes information <b>into</b> the organization (to the team)</td></tr>
<tr><td>Spokesperson</td><td>Passes the organization's information <b>out</b> to its environment (press, public)</td></tr>
<tr><td rowspan="4"><b>Decisional</b></td><td>Entrepreneur</td><td>Initiates change, new projects</td></tr>
<tr><td>Disturbance handler</td><td>Deals with threats and crises</td></tr>
<tr><td>Resource allocator</td><td>Decides where the organization spends its effort (budgets, people)</td></tr>
<tr><td>Negotiator</td><td>Negotiates on behalf of the organization</td></tr></table>
<p>Supervisors: the figurehead role matters less, disturbance handler and negotiator matter more.</p>
<h4>Katz's three skills</h4>
<table class="rules"><tr><th>Skill</th><th>Meaning</th><th>Most needed by</th></tr>
<tr><td>Technical</td><td>Know-how in a specific field (using equipment, software, procedures)</td><td>Lower-level managers</td></tr>
<tr><td>Interpersonal (human)</td><td>Working with and leading people, communication</td><td>All levels</td></tr>
<tr><td>Conceptual</td><td>Generating ideas and seeing the big picture: strategy, mission, policies</td><td>Top managers</td></tr></table>
<p>The higher you rise, the more conceptual skills and the fewer technical skills you need.</p>
<div class="trap"><b>Exam traps</b><br>Disseminator = <b>inside</b>, spokesperson = <b>outside</b>.<br>Liaison = contacts outside your own unit. Figurehead = ceremony and formality.<br>Mintzberg's groups are interpersonal, informational, decisional. Katz's skills are technical, interpersonal, conceptual. Don't mix the two lists.</div>`,
 terms:[["Line manager","Leads a function that contributes directly to the organization's products or services."],["General manager","Manages a clearly identifiable revenue-producing unit, such as a store or product line."],["Figurehead","Mintzberg: represents the organization in formal matters."],["Liaison","Mintzberg: interacts with peers and people outside the organization."],["Monitor","Mintzberg: receives and collects information."],["Disseminator","Mintzberg: transmits information into the organization."],["Spokesperson","Mintzberg: transmits the organization's information to its environment."],["Disturbance handler","Mintzberg: deals with threats to the organization."],["Resource allocator","Mintzberg: chooses where the organization expends its efforts."],["Technical skills","Katz: learned capacity in a specific field."],["Conceptual skills","Katz: generating ideas and understanding the broad context; most important at the top."],["Interpersonal skills","Katz: leading and working with people."]]
},
/* ---------------- Chapter 2 ---------------- */
{id:"c2a", ch:2, pts:4, t:"Personality & values",
 notes:`
<p><b>Personality</b>: a person's relatively stable feelings, thoughts and behavioural patterns. Stable, but it can change slowly over a lifetime. Behaviour at work also depends on what the job expects; personality matters most in jobs with a lot of autonomy.</p>
<h4>The Big Five (OCEAN)</h4>
<table class="rules"><tr><th>Trait</th><th>Description</th><th>At work</th></tr>
<tr><td><b>O</b>penness</td><td>Curious, original, intellectual, creative, open to new ideas</td><td>Learns fast, adapts to change, creative; may get bored by routine</td></tr>
<tr><td><b>C</b>onscientiousness</td><td>Organized, systematic, punctual, achievement-oriented, dependable</td><td>The <b>one trait that predicts performance across all jobs</b>; most wanted by recruiters</td></tr>
<tr><td><b>E</b>xtraversion</td><td>Outgoing, talkative, sociable</td><td>Good in sales and as managers; more absenteeism</td></tr>
<tr><td><b>A</b>greeableness</td><td>Affable, tolerant, sensitive, trusting, kind, warm</td><td>Helps others; avoids conflict, so less change-oriented communication</td></tr>
<tr><td><b>N</b>euroticism</td><td>Anxious, irritable, temperamental, moody</td><td>The only trait where <b>high is undesirable</b>; unhappy, lower career success</td></tr></table>
<h4>Other personality dimensions</h4>
<p class="bl"><b>Self-monitoring</b>: how well you read a situation and adjust your behaviour (“social chameleons”).</p>
<p class="bl"><b>Proactive personality</b>: inclination to fix what is wrong and take initiative without being told.</p>
<p class="bl"><b>Self-esteem</b>: overall positive feelings about yourself.</p>
<p class="bl"><b>Self-efficacy</b>: belief that you can perform a <b>specific task</b> successfully. Task-specific, unlike the other traits.</p>
<h4>Personality tests in selection</h4>
<p>Controversial: candidates can fake answers, and personality explains only about <b>10–15%</b> of job performance. <b>Cognitive ability</b> (general mental ability) predicts performance better. Tests must not discriminate.</p>
<h4>Values</h4>
<p><b>Values</b>: people's stable life goals, what matters most to them. They affect job choice and whether people stay. Schwartz's 10 values: achievement, benevolence, conformity, hedonism, power, security, self-direction, stimulation, tradition, universalism.</p>
<div class="trap"><b>Exam traps</b><br>“Organized, dependable, meets deadlines” = <b>conscientiousness</b>, not organizational commitment (mock Q8).<br>Self-efficacy is about one specific task; self-esteem is about yourself in general.</div>`,
 terms:[["Personality","A person's relatively stable feelings, thoughts and behavioural patterns."],["Openness","Curious, original, intellectual, creative, open to new ideas."],["Conscientiousness","Organized, systematic, punctual, achievement-oriented, dependable."],["Extraversion","Outgoing, talkative, sociable, enjoys socializing."],["Agreeableness","Affable, tolerant, sensitive, trusting, kind, warm."],["Neuroticism","Anxious, irritable, temperamental, moody."],["Self-monitoring","Ability to monitor and adjust your actions and appearance in social situations."],["Proactive personality","Inclination to fix what is wrong and use initiative."],["Self-esteem","Overall positive feelings about yourself."],["Self-efficacy","Belief that you can perform a specific task successfully."],["Values","Stable life goals reflecting what is most important to a person."]]
},
{id:"c2b", ch:2, pts:4, t:"Work attitudes & fit",
 notes:`
<p>An <b>attitude</b> = our opinions, beliefs and feelings about aspects of our environment. Two work attitudes matter most:</p>
<p class="bl"><b>Job satisfaction</b>: the feelings people have toward their job. Probably the most studied attitude.</p>
<p class="bl"><b>Organizational commitment</b>: the <b>emotional attachment</b> to the company. A committed employee believes in its values, puts in effort and wants to stay (“<b>we</b> have great benefits”).</p>
<h4>What causes positive work attitudes</h4>
<table class="rules"><tr><th>Factor</th><th>Detail</th></tr>
<tr><td>Personality & values</td><td>e.g. low neuroticism → more satisfied</td></tr>
<tr><td>Job characteristics</td><td>Skill variety, <b>autonomy</b>, feedback, significant tasks. Matters most for people with a high need for growth.</td></tr>
<tr><td>Organizational justice</td><td><b>Distributive</b> (fair pay and rewards), <b>procedural</b> (fair policies and processes), <b>interactional</b> (treated with dignity and respect). At its root: trust.</td></tr>
<tr><td>Psychological contract</td><td>The unspoken understanding of what the employee gives (effort, loyalty) and gets (pay, raises, job security)</td></tr>
<tr><td>Relationships at work</td><td>With coworkers and especially the manager. <b>Relationship management</b> = communicating clearly, keeping good relationships, managing conflict.</td></tr>
<tr><td>Stress</td><td>Environmental, interpersonal, organizational stressors. <b>Role ambiguity</b> = unclear responsibilities; <b>role conflict</b> = contradictory demands. More stress → less satisfaction (but challenging stress can be positive).</td></tr></table>
<h4>Measuring attitudes</h4>
<p class="bl"><b>Attitude surveys</b> (work best when confidential and followed by action) and <b>exit interviews</b> with departing employees.</p>
<p class="bl">Attitudes predict <b>intentions</b> better than actual behaviour: a dissatisfied employee intends to leave, but whether they leave depends on alternatives.</p>
<h4>The interactionist perspective: fit</h4>
<p>Behaviour is a function of the <b>person and the situation</b> interacting.</p>
<p class="bl"><b>Person-job fit</b>: your knowledge, skills, abilities and other characteristics (KSAO) match the <b>job demands</b>.</p>
<p class="bl"><b>Person-organization fit</b>: your personality, values and goals match the <b>organization</b>.</p>
<p>Good fit → more satisfied, more committed, stay longer.</p>
<div class="ex"><b>Case: SAS Institute</b><br>On Fortune's best places to work every year; turnover under 4% where 20% is the industry norm. Google visited the SAS campus for ideas.</div>
<div class="trap"><b>Exam traps</b><br>“Emotional attachment to the company” = organizational commitment, not job satisfaction.<br>Values match the company = person-<b>organization</b> fit. Skills match the job = person-<b>job</b> fit.</div>`,
 terms:[["Attitude","Our opinions, beliefs and feelings about aspects of our environment."],["Job satisfaction","The feelings people have toward their job."],["Organizational commitment","The emotional attachment people have toward the company they work for."],["Psychological contract","Unspoken, informal understanding of what employee and organization give each other."],["Distributive justice","Fairness of the outputs (rewards) received."],["Procedural justice","Fairness of the procedures used to make decisions."],["Interactional justice","Being treated with respect, kindness and dignity."],["Role ambiguity","Uncertainty about what your responsibilities are."],["Role conflict","Contradictory demands at work or between work and other roles."],["Exit interview","Meeting with a departing employee to learn why they leave."],["Person-job fit","Match between a person's KSAOs and the job's demands."],["Person-organization fit","Match between a person's values, personality and goals and the organization's."]]
},
/* ---------------- Chapter 3 ---------------- */
{id:"c3a", ch:3, pts:4, t:"Leadership, power & influence",
 notes:`
<p><b>Leadership</b> = the act of influencing others to work toward a goal. Leaders exist at every level.</p>
<p class="bl"><b>Formal leaders</b> hold a position of authority and can use their position power as well as personal power.</p>
<p class="bl"><b>Informal leaders</b> have no formal position but influence others through personal power. The group acknowledges them.</p>
<p class="bl"><b>Designated leader</b>: put in the role by outside forces. <b>Emergent leader</b>: arises from the group's dynamics while working toward a goal.</p>
<p><b>The leadership process</b> (Hollander & Julian): a complex, dynamic exchange relationship built over time between leader and followers who depend on each other to reach a shared goal.</p>
<h4>French & Raven: five sources of power</h4>
<table class="rules"><tr><th>Power</th><th>Based on</th><th>Type</th></tr>
<tr><td><b>Legitimate</b></td><td>The formal position or title: the “right” to give instructions</td><td>Position</td></tr>
<tr><td><b>Reward</b></td><td>Ability to give rewards (bonuses, promotions, good territories)</td><td>Position</td></tr>
<tr><td><b>Coercive</b></td><td>Ability to punish or take away something valued</td><td>Position</td></tr>
<tr><td><b>Expert</b></td><td>Knowledge and skills others need</td><td>Personal</td></tr>
<tr><td><b>Referent</b></td><td>Others admire the person and want to be associated with them</td><td>Personal</td></tr></table>
<p><b>Effects:</b> coercive power alienates followers. Reward power makes people think “how much am I getting?”. Referent power creates identification with the leader. Expert power and rational arguments create <b>commitment</b>. Referent and expert power give the best satisfaction and performance; referent power strengthens all the other powers.</p>
<h4>Influence-based leadership styles</h4>
<p class="bl"><b>Tannenbaum & Schmidt continuum</b>: from boss-centred (autocratic) to participative to free-rein.</p>
<p class="bl"><b>McGregor's Theory X</b> leader: assumes people dislike work → controlling style. <b>Theory Y</b> leader: assumes people are creative and self-directed → involving style.</p>
<p class="bl"><b>Muczyk & Reimann</b>: directive autocrat, permissive autocrat, directive democrat, permissive democrat (shares decisions <i>and</i> execution).</p>
<div class="trap"><b>Exam traps</b><br>An expert without a management title influencing executives = <b>expert</b> power, not legitimate (mock Q24).<br>Bonuses and good territories for hitting targets = <b>reward</b> power (mock Q23).<br>Respected and liked, people want to be like them = <b>referent</b> power.</div>`,
 terms:[["Leadership","The act of influencing others to work toward a goal."],["Formal leader","Holds a position of authority; recognized as the official leader."],["Informal leader","No formal position; acknowledged by the group as its leader."],["Emergent leader","Arises from the group's dynamics while working toward a collective goal."],["Legitimate power","Power from a formal position; the right to influence."],["Reward power","Ability to give rewards others want."],["Coercive power","Ability to punish or take away something valued."],["Expert power","Power from having knowledge and skills others need."],["Referent power","Power from being admired; others want to be associated with you."],["Theory X / Theory Y","McGregor: people dislike work and need control (X) vs people are creative and self-directed (Y)."]]
},
{id:"c3b", ch:3, pts:4, t:"Trait & behavioural approaches",
 notes:`
<h4>Who is a leader? Trait approaches</h4>
<p>Started with <b>Stogdill</b>: what physical, personality and social traits make leaders? <b>Kirkpatrick & Locke</b> found core traits that give leadership <i>potential</i>:</p>
<p class="bl">Drive · leadership motivation · honesty and integrity · self-confidence · cognitive ability · knowledge of the business · (charisma, creativity, flexibility).</p>
<p><b>Traits related to leadership</b> (Judge et al.):</p>
<table class="rules"><tr><th>Trait</th><th>Finding</th></tr>
<tr><td>Intelligence</td><td>Positive but modest. Goleman: IQ is a threshold; <b>emotional intelligence</b> (self-awareness, motivation, empathy, social skills) separates good from great.</td></tr>
<tr><td>Extraversion</td><td><b>Strongest</b> link to leader emergence and effectiveness</td></tr>
<tr><td>Conscientiousness, openness</td><td>More likely to emerge as and be effective leaders</td></tr>
<tr><td>Agreeableness</td><td>Modest, conflict-avoiding people are <b>less</b> likely to be seen as leaders</td></tr>
<tr><td>Self-esteem, integrity</td><td>Help leaders; lost integrity hurts the leader and the company</td></tr>
<tr><td>Self-monitoring</td><td>High self-monitors emerge more often as leaders</td></tr></table>
<p><b>Limitation:</b> traits matter more in small, flexible firms than in rule-bound ones, and the situation is ignored. Leaders are not simply “born”.</p>
<h4>What do leaders do? Behavioural approaches</h4>
<p>Studies at Ohio State and Michigan found two kinds of behaviour:</p>
<table class="rules"><tr><th>Task-oriented (initiating structure)</th><th>People-oriented (consideration)</th></tr>
<tr><td>Structures roles, gives instructions and deadlines, focuses on performance and goals</td><td>Shows concern for feelings, treats employees with respect, cares about well-being</td></tr>
<tr><td>Slightly higher productivity; too much → burnout</td><td>More satisfied, positive employees</td></tr></table>
<h4>Decision-making styles</h4>
<table class="rules"><tr><th>Style</th><th>Meaning</th></tr>
<tr><td>Authoritarian</td><td>The leader decides alone</td></tr>
<tr><td>Democratic</td><td>Employees participate in the decision (more satisfaction)</td></tr>
<tr><td>Laissez-faire</td><td>Employees decide with minimal guidance (worst track record: role ambiguity, conflict)</td></tr></table>
<p><b>Limitation:</b> like traits, behaviours ignore the situation. No single style works everywhere.</p>
<div class="trap"><b>Exam traps</b><br>Sets deadlines, assigns roles, checks results = <b>task-oriented</b>, even if the leader is friendly.<br>Laissez-faire is a <b>decision-making</b> style (leave it to employees), not a people-oriented style.</div>`,
 terms:[["Trait approach","Looks for personal characteristics that make someone a leader."],["Drive","High effort, ambition, energy, tenacity and initiative."],["Emotional intelligence (EQ)","Monitoring your own and others' emotions and using them to guide behaviour."],["Task-oriented behaviour","Structuring roles, giving instructions, increasing group performance."],["People-oriented behaviour","Showing concern for feelings and treating employees with respect."],["Authoritarian decision-making","Leader makes the decision alone."],["Democratic decision-making","Employees participate in making the decision."],["Laissez-faire decision-making","Employees decide with minimal guidance from the leader."]]
},
/* ---------------- Chapter 4 ---------------- */
{id:"c4a", ch:4, pts:4, t:"Contemporary leadership approaches",
 notes:`
<h4>Transformational vs transactional</h4>
<table class="rules"><tr><th>Transformational</th><th>Transactional</th></tr>
<tr><td>Aligns employee goals with the leader's and company's goals; followers start caring about the company's well-being</td><td>Gets the right behaviour by giving resources and rewards <b>in exchange</b></td></tr>
<tr><td>Four tools: <b>charisma</b> · <b>inspirational motivation</b> (inspiring vision) · <b>intellectual stimulation</b> (challenge the status quo, think creatively) · <b>individualized consideration</b> (personal care)</td><td>Three methods: <b>contingent rewards</b> (reward for accomplishments) · <b>active management by exception</b> (prevent problems before they happen) · <b>passive management by exception</b> (wait until something goes wrong)</td></tr>
<tr><td>Builds <b>trust</b>; strongest effect on effectiveness and satisfaction</td><td>Also effective, except passive management by exception</td></tr></table>
<p>Best: show both. Charisma can be trained, isn't required, and has a dark side (Enron's Skilling).</p>
<h4>Charismatic leadership</h4>
<p><b>Charisma</b>: a leader's charm and magnetism that inspires confidence, commitment and admiration. Leaders of social movements rely on charisma rather than authority.</p>
<h4>Servant leadership</h4>
<p>The leader's role is to <b>serve the needs of others</b>: develop employees, help them reach their goals, serve the community. Focus on ethics and self-sacrifice (Greenleaf; Abraham Lincoln).</p>
<h4>Authentic leadership</h4>
<p>Key advice: “<b>be yourself</b>”. Authentic leaders are self-aware, act consistently with their values and draw strength from their own life experiences (Howard Schultz at Starbucks gave health insurance to part-timers because of his father's experience).</p>
<h4>Leader-member exchange (LMX)</h4>
<p><b>High-quality LMX</b>: trust, liking, respect; both go beyond the job description (in-group). <b>Low-quality LMX</b>: just the formal job (out-group).</p>
<div class="trap"><b>Exam traps</b><br>A leader who asks staff to challenge assumptions and find original solutions = transformational (<b>intellectual stimulation</b>), not transactional (mock Q25).<br>Bonus per target hit = transactional (contingent reward).<br>“Puts employees first and develops them” = servant. “True to own values and life story” = authentic.</div>`,
 terms:[["Transformational leaders","Align employee goals with company goals through charisma, inspiration, intellectual stimulation and individual consideration."],["Transactional leaders","Influence behaviour through rewards and punishment, in exchange."],["Contingent rewards","Rewards given for accomplishing goals."],["Active management by exception","Leaving employees alone but proactively preventing problems."],["Passive management by exception","Waiting until something goes wrong before stepping in."],["Charisma","A leader's charm and magnetism that inspires confidence and commitment."],["Intellectual stimulation","Challenging norms and the status quo; encouraging creative thinking."],["Individualized consideration","Personal care and concern for each follower's well-being."],["Servant leadership","The leader's role is serving the needs of others and developing them."],["Authentic leadership","Being yourself: self-aware and acting consistently with your values."],["LMX","Leader-member exchange: quality of the relationship between leader and each member."]]
},
{id:"c4b", ch:4, pts:4, t:"Values-based & ethical leadership, trends, inclusion",
 notes:`
<h4>Values-based leadership styles</h4>
<p>Copeland found three values-based styles most effective:</p>
<table class="rules"><tr><th>Style</th><th>Definition</th></tr>
<tr><td><b>Authentic</b></td><td>Leaders are aware of their thoughts and behaviour within the context they operate in; “be real”</td></tr>
<tr><td><b>Ethical</b></td><td>Demonstrating normatively appropriate conduct and promoting it to followers through two-way communication, reinforcement and decision making (Brown et al.)</td></tr>
<tr><td><b>Transformational</b></td><td>Motivating others through a common mission or challenge that empowers followers to develop as leaders (Bass & Riggio)</td></tr></table>
<p><b>Vulnerability</b>: taking risks and exposing yourself emotionally (sharing feelings and weaknesses). Builds trust.</p>
<h4>Ethical decision making (SCQA)</h4>
<p class="ar"><b>S</b>ituation: assess it. → <b>C</b>omplication: identify the stakeholders and see it from their view. → <b>Q</b>uestion: what alternatives do I have and how do they affect stakeholders? How does the action make me feel about myself? → <b>A</b>nswer: make a decision and monitor the outcomes.</p>
<p><b>Corporations as social movements</b>: a social movement is group action on a political or social issue. Its leaders rely on <b>charisma rather than authority</b>.</p>
<h4>10 global trends</h4>
<table class="rules"><tr><th>5 challenges</th><th>5 solutions</th></tr>
<tr><td>Increasing concern for the environment<br>Greater personalization and customization<br>Faster pace of innovation<br>Increasing complexity<br>Increasing competition for talent</td><td>Becoming more connected<br>Becoming more global<br>Becoming more mobile<br>Rise of the creative class<br>Increasing collaboration</td></tr></table>
<h4>Inclusive leadership (DEI)</h4>
<p>“Having the courage to take conscious steps to break down barriers for people at risk of being excluded” (Bortini et al.). Centred on relationships and valuing differences.</p>
<p><b>Six Cs</b> of inclusive leaders (Dillon & Bourke): <b>Commitment · Courage · Cognizance of bias · Curiosity · Cultural intelligence · Collaborative</b>.</p>
<p><b>Ethnocentrism</b>: believing your own culture is superior to all others.</p>
<h4>21st-century leaders (Conger)</h4>
<p>Strategic opportunists, globally aware, able to manage decentralized organizations, sensitive to diversity, interpersonally competent, builders of community.</p>
<div class="trap"><b>Exam traps</b><br>A legal but harmful production method = an ethical dilemma because economic interests clash with stakeholder responsibilities (mock Q26).<br>Know the 6 Cs: “aware of personal and organizational biases” = cognizance of bias; “understands other cultures” = cultural intelligence.</div>`,
 terms:[["Ethical leadership","Modelling appropriate conduct and promoting it through two-way communication, reinforcement and decisions."],["Authentic leadership","Self-aware leaders acting in line with their values."],["Vulnerability","Taking risks by being transparent and sharing feelings and weaknesses."],["SCQA","Situation, Complication, Question, Answer: a framework for ethical decisions."],["Social movement","Group action focused on a political or social issue; leaders rely on charisma."],["Inclusive leadership","Valuing differences and advocating for traditionally excluded voices."],["Six Cs","Commitment, courage, cognizance of bias, curiosity, cultural intelligence, collaborative."],["Ethnocentrism","Belief that your own culture is superior to all others."]]
},

{id:"c5a", ch:5, pts:4, t:"Communication: process, barriers & channels",
 notes:`
<p><b>Communication</b>: a process by which information is exchanged between individuals through a common system of symbols, signs or behaviour. Managers spend 50–90% of their time communicating.</p>
<p><b>Three functions</b> in an organization: transmitting information · coordinating effort · sharing emotions and feelings.</p>
<h4>The communication process</h4>
<p class="ar"><b>Sender</b> has an idea and <b>encodes</b> it (turns it into words, diagrams, numbers) → the <b>message</b> travels through a <b>channel/medium</b> (oral, written, nonverbal) → the <b>receiver</b> <b>decodes</b> it (gives it meaning) → <b>feedback</b> back to the sender. <b>Noise</b> = anything that distorts the message (in the environment, the receiver or the sender).</p>
<h4>Barriers to effective communication</h4>
<table class="rules"><tr><th>Barrier</th><th>Meaning</th></tr>
<tr><td>Filtering</td><td>Distorting or withholding information to manage someone's reaction</td></tr>
<tr><td>Selective perception</td><td>Filtering what you see and hear to fit your own needs and beliefs</td></tr>
<tr><td>Information overload</td><td>Receiving more information than you can take in</td></tr>
<tr><td>Emotional disconnects</td><td>Sender or receiver is upset, so the message is ignored or distorted</td></tr>
<tr><td>Lack of source familiarity or credibility</td><td>No shared context, or an untrustworthy sender</td></tr>
<tr><td>Workplace gossip (grapevine)</td><td>Unofficial information that may not be accurate</td></tr>
<tr><td>Semantics / differences in meaning</td><td>Words mean different things to different people (age, culture, jargon)</td></tr>
<tr><td>Gender differences</td><td>Different communication styles</td></tr>
<tr><td>Biased language</td><td>Words that stereotype, offend or exclude</td></tr></table>
<p><b>Listening</b>: workers listen 55% of the time, leaders up to 70%. <b>Active listening</b>: full attention, no interrupting, reflecting and asking questions.</p>
<h4>Types and channels</h4>
<table class="rules"><tr><th>Type</th><th>Examples</th></tr>
<tr><td>Verbal (oral)</td><td>Phone, video calls, meetings, in person. Better for <b>feelings</b>.</td></tr>
<tr><td>Written</td><td>Memos, e-mails, texts, letters, manuals, policies. Better for <b>facts</b>.</td></tr>
<tr><td>Nonverbal</td><td>Facial expressions, body stance, tone of voice. About <b>55%</b> of in-person communication; only 7% comes from the words.</td></tr></table>
<p><b>Information richness</b>: face-to-face, phone and video are richest; e-mail, blogs and memos are medium; formal documents and spreadsheets are leanest.</p>
<p><b>Direction</b>: downward (from leaders), upward (from the front line), horizontal/lateral (between peers), diagonal (across levels and departments).</p>
<div class="trap"><b>Exam traps</b><br>Turning ideas into words and diagrams = <b>encoding</b> (sender side). Interpreting = decoding (receiver side) (mock Q10).<br>Two people hear the same news, one sees an opportunity, one a threat because of past experiences = <b>selective perception</b> (mock Q9).<br>Facial expressions = nonverbal; a phone call is verbal; a memo or text is written (mock Q11).</div>`,
 terms:[["Communication","Exchange of information through a common system of symbols, signs or behaviour."],["Sender","Originator who encodes the idea into a message."],["Encoding","Translating an idea into words or other symbols."],["Receiver","The person who receives and decodes the message."],["Decoding","Assigning meaning to the message."],["Noise","Anything that interferes with or distorts the message."],["Filtering","Distorting or withholding information to manage someone's reaction."],["Selective perception","Filtering what we see and hear to suit our own needs and beliefs."],["Information overload","Receiving more information than we can take in."],["Grapevine","Unofficial communication that may or may not be accurate."],["Active listening","Full attention, no interrupting, reflecting and asking questions."],["Information richness","How much nonverbal information a channel carries."]]
},
{id:"c5b", ch:5, pts:4, t:"Decision making: types, models & groups",
 notes:`
<p><b>Decision making</b>: making choices among alternative courses of action, including inaction. About half of leaders' decisions fail.</p>
<h4>Types of decisions</h4>
<table class="rules"><tr><th>By how often</th><th></th></tr>
<tr><td><b>Programmed</b></td><td>Occur often enough to have an automated response (a <b>decision rule</b>). E.g. automatic reorder at a stock level.</td></tr>
<tr><td><b>Nonprogrammed</b></td><td>Unique and important: conscious thinking, information gathering, careful consideration. E.g. a crisis, McDonald's dropping trans fats.</td></tr>
<tr><th>By organizational level</th><th></th></tr>
<tr><td>Strategic</td><td>Long term, set the course of the organization</td></tr>
<tr><td>Tactical</td><td>How things will get done (mid-term action plans)</td></tr>
<tr><td>Operational</td><td>Daily decisions employees make to run the organization</td></tr></table>
<h4>Four decision-making models</h4>
<table class="rules"><tr><th>Model</th><th>Definition</th><th>Use when</th></tr>
<tr><td><b>Rational</b></td><td>Structured, logical steps to choose the optimal alternative</td><td>Information can be quantified, the decision is important, you want to maximize the outcome</td></tr>
<tr><td><b>Bounded rationality</b></td><td>Limited information, time and brainpower → <b>satisfice</b>: take the first alternative that meets the minimum criteria</td><td>Minimum criteria are clear, little time, not maximizing</td></tr>
<tr><td><b>Intuitive</b></td><td>Gut feeling, experience, pattern recognition, fast</td><td>Goals unclear, time pressure, you have experience</td></tr>
<tr><td><b>Creative</b></td><td>Less structured, generates novel solutions</td><td>No clear solution, new ideas needed, you have time</td></tr></table>
<p><b>Rational steps:</b> identify the problem → set criteria → weight criteria → generate all alternatives → evaluate them → choose the best → implement → evaluate the decision.</p>
<p><b>Creative steps:</b> problem identification → <b>immersion</b> (gather information) → <b>incubation</b> (set it aside; unconscious work) → <b>illumination</b> (insight moment) → <b>verification and application</b>. Creativity is judged on fluency (number of ideas), flexibility (variety) and originality.</p>
<h4>Faulty decisions</h4>
<p class="bl"><b>Overconfidence bias</b> (overestimating your abilities) · <b>hindsight bias</b> (mistakes look obvious afterwards) · <b>anchoring</b> (relying too much on one piece of information) · <b>framing bias</b> (influenced by how it's presented) · <b>escalation of commitment</b> (continuing a failing course because you already invested) · <b>analysis paralysis</b>.</p>
<h4>Individual vs group decisions</h4>
<p><b>Groups:</b> more experiences and perspectives, more creative, easier implementation, but slower, coordination problems, rarely beat their best member. Problems: <b>groupthink</b> (avoiding critical evaluation of ideas the group favours; members stay silent to keep agreement; Challenger launch) and <b>social loafing</b> (some members put in less effort).</p>
<p><b>Techniques:</b> <b>Nominal Group Technique</b> (write ideas alone → share → discuss → vote) · <b>Delphi</b> (written questionnaires, no meeting, until consensus) · <b>majority rule</b> · <b>consensus</b> (everyone agrees) · <b>brainstorming</b> (no criticism, wild ideas, build on others) · <b>GDSS</b> (computer systems) · <b>decision trees</b>.</p>
<div class="trap"><b>Exam traps</b><br>Automatic reorder at a set level = <b>programmed</b> decision (mock Q12).<br>Silent members preserving agreement = <b>groupthink</b> (mock Q13), not social loafing (that's about effort).<br>Taking the first option that's “good enough” = satisficing (bounded rationality).</div>`,
 terms:[["Programmed decision","Recurring decision with an automated response."],["Nonprogrammed decision","Unique, important decision needing careful analysis."],["Rational model","Series of steps to maximize the quality of the outcome."],["Bounded rationality","Choosing from a limited set of options without an exhaustive search."],["Satisfice","Accepting the first alternative that meets your minimum criteria."],["Intuitive model","Decisions based on intuition or experience."],["Incubation","Setting a problem aside so the brain works on it unconsciously."],["Escalation of commitment","Continuing a failing course because you already invested in it."],["Anchoring","Relying too heavily on one piece of information."],["Groupthink","Tendency to avoid critically evaluating ideas the group favours."],["Social loafing","Some members put in less effort when working in a group."],["Nominal Group Technique","Write ideas alone, share, discuss, then vote."],["Delphi Technique","Group decision through written questionnaires, without meeting."]]
},

{id:"c6a", ch:6, pts:3, t:"Mission, vision, stakeholders & the strategy process",
 notes:`
<table class="rules"><tr><th>Statement</th><th>Answers</th><th>Clue words</th></tr>
<tr><td><b>Mission</b></td><td>Why we exist <b>now</b>: the reason for being and how we serve key stakeholders</td><td>“we provide…”, “our purpose is…”</td></tr>
<tr><td><b>Vision</b></td><td>What we want to <b>become</b>: future-oriented purpose and aspirations</td><td>“to be the leading… by 2035”</td></tr>
<tr><td><b>Values</b></td><td>Core beliefs and guiding principles</td><td>“integrity, respect, curiosity”</td></tr></table>
<p>Mission and vision guide all of P-O-L-C: planning starts with them, organizing aligns structure with them, leading is nearly synonymous with them, controlling checks progress toward them.</p>
<h4>Stakeholders</h4>
<p><b>Stakeholders</b>: individuals or groups with an interest in the organization's ability to deliver intended results (customers, employees, investors, suppliers, government, communities). <b>Stakeholder analysis</b>: techniques to identify and understand their needs and expectations, inside and outside the organization.</p>
<h4>The strategic management process</h4>
<p><b>Strategic management</b> = what a firm does to achieve its mission and vision; “the process by which a firm manages the formulation and implementation of its strategy” (Carpenter & Sanders).</p>
<table class="rules"><tr><th>Step</th><th>Means</th></tr>
<tr><td>1. Strategic objectives & analysis</td><td>Vision, mission, values; SWOT, PESTEL</td></tr>
<tr><td>2. Strategy formulation</td><td><b>Deciding</b> what to do: plans, gather resources (also called business or strategic planning)</td></tr>
<tr><td>3. Strategy implementation</td><td><b>Doing</b> it: training, allocating resources</td></tr>
<tr><td>4. Strategic evaluation & control</td><td>Evaluation and correction</td></tr></table>
<div class="trap"><b>Exam traps</b><br>“Become”, “by 2035”, “leading” = vision. “Reason for being” = mission.<br>Training staff and handing out budgets = implementation, not formulation.</div>`,
 terms:[["Mission statement","The organization's reason for being and how it serves its key stakeholders."],["Vision statement","Future-oriented declaration of purpose and aspirations."],["Values statement","The organization's core beliefs and guiding principles."],["Stakeholders","Individuals or groups with an interest in the organization's ability to deliver results."],["Stakeholder analysis","Techniques to identify and understand stakeholders' needs and expectations."],["Strategic management","What a firm does to achieve its mission and vision."],["Strategy formulation","Determining what the firm should do (planning)."],["Strategy implementation","The actions taken to put the strategy into practice."]]
},
{id:"c6b", ch:6, pts:3, t:"Levels of strategy & how firms compete",
 notes:`
<table class="rules"><tr><th>Level</th><th>Key question</th><th>Who</th><th>Tools</th></tr>
<tr><td><b>Corporate</b></td><td>Which business(es) should we be in?</td><td>Top management</td><td>PESTEL, BCG, broad SWOT</td></tr>
<tr><td><b>Business</b></td><td>How do we compete in this market?</td><td>Business-unit managers</td><td>Porter's 5 forces, VRIO, value chain</td></tr>
<tr><td><b>Functional</b></td><td>How does each department support it?</td><td>Marketing, finance, HR…</td><td>Departmental SWOT, detailed value chain</td></tr></table>
<p class="bl"><b>Synergy</b>: two or more activities together create a combined effect greater than the sum of the parts (1 + 1 = 3).</p>
<p class="bl"><b>Diversification</b>: participating in multiple businesses that are distinct from each other, to spread risk (YUM! Brands: KFC, Pizza Hut, Taco Bell).</p>
<p class="bl">McDonald's sold Chipotle in 2006 to focus on one brand: a <b>corporate</b> decision.</p>
<h4>How a business competes (business level)</h4>
<table class="rules"><tr><th>Approach</th><th>Means</th></tr>
<tr><td><b>Cost leadership</b></td><td>Win by being the cheapest: standard product, lowest costs, lowest price</td></tr>
<tr><td><b>Differentiation</b></td><td>Win by being unique (quality, design, technology, durability); customers pay more</td></tr>
<tr><td>Focus</td><td>Cost leadership or differentiation in one narrow segment</td></tr></table>
<p><b>Competitive advantage</b>: a strength that sets you apart from competitors. <b>Sustainable</b> competitive advantage: it can't easily be copied or made less valuable by changes in the environment.</p>
<div class="trap"><b>Exam traps</b><br>Selling or buying a whole business = corporate. One department's routine plans = functional.<br>Patented, durable, unique product at a higher price = differentiation (mock Q31).</div>`,
 terms:[["Corporate strategy","Which business(es) should we be in?"],["Business strategy","How a given business competes to be effective."],["Functional strategy","How each department supports the business strategy."],["Synergy","Combined effect greater than the sum of the individual effects."],["Diversification","Participating in multiple distinct businesses to spread risk."],["Cost leadership","Competing by having the lowest costs and prices."],["Differentiation","Competing with something unique customers will pay more for."],["Sustainable competitive advantage","Strengths that can't easily be copied or made less valuable."]]
},
{id:"c6c", ch:6, pts:3, t:"Internal analysis: value chain, VRIO, BCG",
 notes:`
<p>Internal tools find <b>strengths and weaknesses</b>, things inside the company that it can control.</p>
<h4>Value chain (Michael Porter)</h4>
<p>All activities that combine to create the product or service.</p>
<table class="rules"><tr><th>Primary (create and deliver directly)</th><th>Support (help in the background)</th></tr>
<tr><td>1. Inbound logistics (receiving, storing inputs)<br>2. Operations (turning inputs into the product)<br>3. Outbound logistics (getting it to customers)<br>4. Marketing & sales<br>5. Service (after the sale: repairs, returns, support)</td><td>Firm infrastructure (management, finance, legal, planning)<br>Human resource management<br>Technology development (R&D, IT)<br>Procurement (buying inputs from suppliers)</td></tr></table>
<h4>VRIO: does a resource give a competitive advantage?</h4>
<table class="rules"><tr><th>V</th><th>R</th><th>I (hard to imitate)</th><th>O</th><th>Result</th></tr>
<tr><td>No</td><td></td><td></td><td></td><td>Competitive disadvantage</td></tr>
<tr><td>Yes</td><td>No</td><td></td><td></td><td>Competitive parity (equality)</td></tr>
<tr><td>Yes</td><td>Yes</td><td>No</td><td></td><td>Temporary competitive advantage</td></tr>
<tr><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td><td>Unused competitive advantage</td></tr>
<tr><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Sustained (long-term) competitive advantage</td></tr></table>
<p>Ask in order and stop at the first “no”. Book example: Disney's marketing and design skills pass all four.</p>
<h4>BCG matrix (portfolio of products or businesses)</h4>
<table class="rules"><tr><th></th><th>High market share</th><th>Low market share</th></tr>
<tr><td><b>High growth</b></td><td>⭐ Star</td><td>❓ Question mark</td></tr>
<tr><td><b>Low growth</b></td><td>🐄 Cash cow (funds the others)</td><td>🐕 Dog (sell or close)</td></tr></table>
<div class="trap"><b>Exam traps</b><br>Collecting, cleaning and redistributing a product for reuse is a <b>primary</b> activity (operations/logistics), not a support activity (mock Q32).<br>Valuable but everyone has it = parity. Unique but easy to copy = temporary. Everything but the company doesn't use it = unused.</div>`,
 terms:[["Value chain","The step-by-step activities that combine to form the product or service (Porter)."],["Primary activities","Inbound logistics, operations, outbound logistics, marketing & sales, service."],["Support activities","Firm infrastructure, HRM, technology development, procurement."],["VRIO","Valuable, rare, hard to imitate, organized to exploit."],["Competitive parity","Valuable but not rare: you only keep up."],["Temporary competitive advantage","Valuable and rare but easy to imitate."],["Star","BCG: high growth, high share."],["Question mark","BCG: high growth, low share."],["Cash cow","BCG: low growth, high share."],["Dog","BCG: low growth, low share."]]
},
{id:"c6d", ch:6, pts:3, t:"External analysis: SWOT, PESTEL, Porter's 5 forces",
 notes:`
<h4>SWOT (Ken Andrews, early 1970s)</h4>
<table class="rules"><tr><th></th><th>Helpful</th><th>Harmful</th></tr>
<tr><td><b>Internal</b> (controllable)</td><td>Strengths</td><td>Weaknesses</td></tr>
<tr><td><b>External</b> (not controllable)</td><td>Opportunities</td><td>Threats</td></tr></table>
<p>Good strategy uses strengths to take advantage of opportunities and reduce threats, while managing weaknesses.</p>
<h4>PESTEL: the macro environment</h4>
<table class="rules"><tr><th>Factor</th><th>Examples</th></tr>
<tr><td>Political</td><td>Government policy, stability, trade restrictions, tariffs, tax policy</td></tr>
<tr><td>Economic</td><td>Growth, exchange rates, interest rates, inflation, unemployment</td></tr>
<tr><td>Sociocultural</td><td>Population, age, lifestyle, health consciousness</td></tr>
<tr><td>Technological</td><td>Innovation, automation, R&D, AI</td></tr>
<tr><td>Environmental</td><td>Climate, environmental policy, NGO pressure</td></tr>
<tr><td>Legal</td><td>Employment, consumer protection, antitrust, patent, health & safety law</td></tr></table>
<h4>Porter's five forces: the industry environment</h4>
<p class="bl"><b>Rivalry</b> among existing competitors (the centre)</p>
<p class="bl">Threat of <b>new entrants</b>: new companies coming into the market</p>
<p class="bl">Threat of <b>substitutes</b>: a <i>different kind</i> of product meeting the same need</p>
<p class="bl">Bargaining power of <b>buyers</b>: customers pushing prices down</p>
<p class="bl">Bargaining power of <b>suppliers</b>: suppliers pushing prices up</p>
<div class="trap"><b>Exam traps</b><br>A new law or tariff is external (PESTEL): an opportunity or a threat, never a strength or weakness.<br>New firms entering = new entrants. A different product doing the same job = substitute.<br>A big customer demanding a price cut = buyer power.</div>`,
 terms:[["SWOT","Strengths, weaknesses (internal), opportunities, threats (external)."],["Opportunities","External factors that can benefit the organization."],["Threats","External factors beyond your control that put the business at risk."],["PESTEL","Political, economic, sociocultural, technological, environmental, legal factors."],["Porter's five forces","Rivalry, new entrants, substitutes, buyer power, supplier power."],["Threat of substitutes","Customers switching to a different kind of product that meets the same need."],["Bargaining power of buyers","Customers' power to push prices down."]]
},
{id:"c6e", ch:6, pts:3, t:"How strategies emerge: intended vs realized",
 notes:`
<table class="rules"><tr><th>Strategy</th><th>Meaning</th></tr>
<tr><td><b>Intended</b></td><td>Conceived by the top management team, through negotiation, bargaining and compromise</td></tr>
<tr><td><b>Deliberate</b></td><td>The part of the intended strategy that is actually carried out (design school: rational, top-down planning)</td></tr>
<tr><td><b>Unrealized</b></td><td>The parts of the plan that never happen</td></tr>
<tr><td><b>Emergent</b></td><td>Decisions that emerge as leaders interpret the plan and adapt to changing circumstances; often bottom-up (emergence or learning school)</td></tr>
<tr><td><b>Realized</b></td><td>What is actually implemented = deliberate + emergent</td></tr></table>
<p>Mintzberg: only <b>10–30%</b> of intended strategy is realized. Why plans fail: poorly built plan, competitors undermine it, or poor execution.</p>
<p>The more <b>volatile</b> the environment, the more emergence. Stable organizations (postal services) can plan in detail. Book example: Intel's switch from memory chips to microprocessors grew from plant-level decisions.</p>
<p>Best practice: balance design (planning) with the flexibility to benefit from emergence. Headquarters sets mission, targets and budgets; units adapt and experiment.</p>
<div class="trap"><b>Exam trap</b><br>“Pilot results led to a different approach than the original plan” = emergent strategy that became the <b>realized</b> strategy (mock Q33).</div>`,
 terms:[["Intended strategy","Strategy conceived by the top management team."],["Deliberate strategy","Rational, planned strategy that is actually carried out."],["Emergent strategy","Decisions that emerge as leaders adapt the plan to new circumstances."],["Realized strategy","The strategy actually implemented: deliberate + emergent."],["Design school","Strategy as rational, deliberate planning."],["Emergence (learning) school","Strategy emerging from many decisions at many levels."]]
},
/* ---------------- Chapter 7 ---------------- */
{id:"c7a", ch:7, pts:4, t:"Goals, MBO, Balanced Scorecard, SMART, KPI, CSR",
 notes:`
<p><b>Goals</b>: outcome statements that define what the organization is trying to accomplish. <b>Objectives</b>: very precise, time-based, measurable actions that support a goal (linked to SMART).</p>
<p>Planning starts with vision and mission → strategy → goals and objectives show whether you're on track. Horizons: long term 3+ years, mid-range 1–3 years, short term under 1 year.</p>
<h4>Tools</h4>
<table class="rules"><tr><th>Tool</th><th>What it is</th></tr>
<tr><td><b>Management by Objectives (MBO)</b></td><td>Drucker (1954). Systematic approach that aligns subordinates' objectives with the overall goals; employees help set their own objectives and timelines.</td></tr>
<tr><td><b>Balanced Scorecard</b></td><td>Kaplan & Norton. Translates mission, vision and strategy into specific, measurable goals and monitors them in four areas: <b>financial, customer, internal business processes, learning & growth</b>. Financial + non-financial; leading and lagging measures.</td></tr>
<tr><td><b>SMART</b></td><td>Specific, Measurable, Achievable, Realistic, Time-bound</td></tr>
<tr><td><b>KPI</b></td><td>A measurable value that shows how effectively a company achieves key business objectives</td></tr></table>
<h4>CSR and the triple bottom line</h4>
<p class="bl"><b>CSR</b>: how companies manage their business processes to produce an overall positive effect on society. The Balanced Scorecard can help make CSR values measurable (Crawford & Scaletta).</p>
<p class="bl"><b>Triple bottom line</b>: measuring performance on <b>social, environmental and economic</b> dimensions (people, planet, profit).</p>
<p class="bl">Examples in the slides: Dow Jones Sustainability Index (DJSI), UN Sustainable Development Goals (SDGs) for 2030, Net Zero targets.</p>
<div class="trap"><b>Exam traps</b><br>“An outcome statement of what to accomplish” = goal. “Precise, time-based, measurable action” = objective (mock Q16, Q17).<br>Balanced Scorecard = turns mission and strategy into measurable goals and tracks them (mock Q18), not “only financial targets”.</div>`,
 terms:[["Goals","Outcome statements that define what an organization is trying to accomplish."],["Objectives","Precise, time-based, measurable actions that support a goal."],["MBO","Management by Objectives: aligning subordinate objectives with organizational goals (Drucker)."],["Balanced Scorecard","Translates mission and strategy into measurable goals in four perspectives."],["SMART","Specific, measurable, achievable, realistic, time-bound."],["KPI","Measurable value showing how effectively key objectives are achieved."],["CSR","Managing business processes to produce an overall positive effect on society."],["Triple bottom line","Performance on social, environmental and economic dimensions."]]
},
{id:"c7b", ch:7, pts:4, t:"Motivation theories",
 notes:`
<p><b>Motivation</b>: “the intention of achieving a goal, leading to goal-directed behaviour”.</p>
<div class="formula">Performance = Motivation × Ability × Environment</div>
<h4>Need-based theories</h4>
<table class="rules"><tr><th>Theory</th><th>Core idea</th></tr>
<tr><td><b>Maslow</b></td><td>Five needs in a hierarchy: physiological → safety → social → esteem → self-actualization. A satisfied need no longer motivates.</td></tr>
<tr><td><b>ERG</b> (Alderfer)</td><td>Three groups: <b>E</b>xistence (= physiological + safety), <b>R</b>elatedness (= social), <b>G</b>rowth (= esteem + self-actualization). No fixed order, several needs at once, <b>frustration-regression</b>.</td></tr>
<tr><td><b>Herzberg two-factor</b></td><td><b>Hygiene factors</b> (company policies, supervision, working conditions, salary, safety, security) prevent dissatisfaction but don't motivate. <b>Motivators</b> (achievement, recognition, interesting work, responsibility, advancement, growth) really motivate.</td></tr>
<tr><td><b>McClelland</b></td><td>Acquired needs: achievement, affiliation, power</td></tr></table>
<h4>Process-based theories</h4>
<table class="rules"><tr><th>Theory</th><th>Core idea</th></tr>
<tr><td><b>Equity theory</b> (Adams)</td><td>We compare our <b>inputs</b> (effort, loyalty, skills) and <b>outputs</b> (pay, rewards) with a <b>referent</b>. Inequity creates tension → we reduce our own input, ask for more, distort perceptions, change referent or leave.</td></tr>
<tr><td>Expectancy theory</td><td>Expectancy (effort → performance), instrumentality (performance → reward), valence (value of the reward)</td></tr>
<tr><td><b>Goal-setting theory</b> (Locke & Latham)</td><td>Supported in 1,000+ studies. SMART goals give direction, energize, challenge and push creative thinking. Downsides: tunnel vision, ignoring unmeasured work, unethical behaviour.</td></tr>
<tr><td>Reinforcement theory</td><td>Positive and negative reinforcement increase behaviour; extinction and punishment reduce it</td></tr></table>
<p><b>Justice beyond equity:</b> distributive (fair outcomes), procedural (fair process), interactional (respectful treatment).</p>
<div class="trap"><b>Exam traps</b><br>Better office temperature, job security or clear policies = <b>hygiene</b>. Meaningful responsibility for complete projects = <b>motivator</b> (mock Q14).<br>She sees a colleague get the same reward for less effort and cuts her own effort = <b>equity theory</b> (mock Q15).</div>`,
 terms:[["Motivation","The intention of achieving a goal, leading to goal-directed behaviour."],["Maslow's hierarchy","Physiological, safety, social, esteem, self-actualization."],["ERG theory","Existence, relatedness, growth; several needs at once; frustration-regression."],["Hygiene factors","Job context factors that cause dissatisfaction when missing (pay, policies, conditions)."],["Motivators","Intrinsic job factors that truly motivate (achievement, recognition, responsibility)."],["Equity theory","Motivation from fairness, comparing input/output ratios with a referent."],["Referent","The person or group you compare yourself with."],["Goal-setting theory","Specific, challenging (SMART) goals improve performance."],["Expectancy","Belief that effort will lead to the desired outcome."]]
},
/* ---------------- Chapter 8 ---------------- */
{id:"c8a", ch:8, pts:4, t:"Environments & organizational structures",
 notes:`
<h4>Internal and external environments</h4>
<p class="bl"><b>External (macro, general) environment</b>: the big-picture world with political, economic, social, technological, environmental and legal factors the company barely controls. Tools: PESTEL (macro forces), Porter's 5 forces (competitors).</p>
<p class="bl"><b>Internal environment</b>: resources, capabilities and activities. Tools: VRIO, value chain.</p>
<p>Slide examples: 2025 US tariffs and the impact of AI changing internal structures and business activities.</p>
<h4>Mechanistic vs organic</h4>
